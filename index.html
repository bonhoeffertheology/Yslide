<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yslide Note</title>

<meta name="theme-color" content="#181818">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yslide">

<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-kopubworld@1.0.0/kopubworld.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

<style>
:root {
  --bg-main: #0a0a0a;
  --panel-bg: #181818;
  --border-color: #333333;
  --page-bg: #141414;
  --page-border: #444444;
  --text-color: #ffffff;
  --accent: #38bdf8;
  --toolbar-height: 96px;
  --page-width: min(820px, 92vw);
  --header-height: 42px;
  --active-font: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
  --ui-font: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: var(--bg-main);
  color: var(--text-color);
  font-family: var(--ui-font);
  overflow: hidden;
}

#header-toolbar {
  position: fixed; top: 0; left: 0; width: 100%;
  height: var(--toolbar-height);
  background: var(--panel-bg);
  border-bottom: 1px solid var(--border-color);
  display: flex; flex-direction: column; justify-content: center;
  padding: 0 16px; z-index: 1000; user-select: none; gap: 6px;
}
.toolbar-row {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; height: 40px; overflow-x: auto; white-space: nowrap; gap: 8px;
}
.toolbar-row::-webkit-scrollbar { display: none; }
.toolbar-row-top {
  justify-content: flex-start; border-bottom: 1px solid #282828;
  padding-bottom: 4px; height: 38px; gap: 8px;
}
.tool-group { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }

button {
  height: 32px; padding: 0 10px;
  background: #262626; border: 1px solid #484848; border-radius: 6px;
  color: #e5e5e5; font-size: 13px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  flex-shrink: 0; transition: all 0.15s ease; font-family: var(--ui-font);
}
button:hover { background: #333333; }
button:active { transform: scale(0.97); }
.btn-icon { width: 32px; height: 32px; padding: 0; }
.icon-svg {
  width: 17px; height: 17px; fill: none; stroke: currentColor;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block;
}
.divider { width: 1px; height: 20px; background: var(--border-color); margin: 0 2px; flex-shrink: 0; }

#btn-continuous.active, #btn-batch-mode.active {
  background: #ea580c !important; border-color: #f97316 !important; color: #ffffff !important;
  box-shadow: 0 0 10px rgba(234, 88, 12, 0.6);
}

.color-btn {
  width: 24px; height: 24px; border-radius: 50%; border: 2px solid #555555;
  cursor: pointer; flex-shrink: 0; transition: transform 0.15s ease;
}
.color-btn.selected { border-color: #ffffff; transform: scale(1.2); box-shadow: 0 0 6px rgba(255,255,255,0.8); }
.c-white { background-color: #ffffff; }
.c-red { background-color: #ef4444; }
.c-yellow { background-color: #ffb703; }
.c-blue { background-color: #38bdf8; }
.c-green { background-color: #4ade80; }

.btn-font {
  height: 30px; padding: 0 10px; font-size: 12px; font-weight: bold;
  color: #d1d5db; background: #262626; border: 1px solid #484848; border-radius: 6px;
}
.size-box {
  display: inline-flex; align-items: center; background: #262626;
  border: 1px solid #484848; border-radius: 6px; padding: 2px 4px; gap: 2px;
  height: 32px; flex-shrink: 0;
}
.btn-size-step { width: 20px; height: 20px; padding: 0; background: transparent; border: none; color: #cccccc; font-size: 14px; }
#size-display { font-size: 13px; font-weight: bold; min-width: 20px; text-align: center; color: #38bdf8; }
#file-input { display: none; }

/* ===== 뷰포트 ===== */
#main-viewport {
  position: fixed; top: var(--toolbar-height); bottom: 0; left: 0; right: 0;
  background: var(--bg-main); z-index: 10;
  -webkit-overflow-scrolling: touch;
  overflow-y: auto; overflow-x: hidden;
  display: flex; justify-content: center;
  padding: 24px 16px 140px;
}
#main-viewport::-webkit-scrollbar { display: none; }

#document-workspace { position: relative; width: var(--page-width); max-width: 820px; }

/* 1) 배경 종이 레이어 */
#page-cards-layer { position: absolute; top: 0; left: 0; width: 100%; z-index: 1; pointer-events: none; }
.page-sheet-card {
  position: absolute; left: 0; width: 100%;
  background: var(--page-bg); border: 2px solid var(--page-border); border-radius: 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.95), 0 0 0 1px rgba(255,255,255,0.05);
}

/* 2) 텍스트 캔버스 */
#single-stream-editor {
  position: relative; z-index: 5; width: 100%;
  padding: 66px 36px 24px 36px;
  outline: none; color: #ffffff;
  font-size: 26px; line-height: 1.55;
  font-family: var(--active-font);
  white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
  cursor: text; caret-color: #ffffff; background: transparent;
}
#single-stream-editor.is-empty::after {
  content: "여기를 클릭하여 글을 작성하거나 긴 글을 붙여넣으세요.";
  color: #666666; pointer-events: none;
}
body.paint-mode #single-stream-editor { cursor: crosshair !important; user-select: none; }

#pagination-reserve { height: 0; line-height: 0; font-size: 0; user-select: none; -webkit-user-select: none; pointer-events: none; }
.pg-col  { float: left; clear: left; width: 1px; }
.pg-band { float: left; clear: left; width: 100%; }
.manual-break { display: block; width: 100%; line-height: 0; font-size: 0; user-select: none; -webkit-user-select: none; pointer-events: none; }

/* 3) 페이지 머리글 레이어 */
#page-headers-layer { position: absolute; top: 0; left: 0; width: 100%; z-index: 30; pointer-events: none; }
.page-header {
  position: absolute; left: 0; width: 100%; height: var(--header-height);
  background: #1a1a1a; border-bottom: 1px solid #333333;
  border-radius: 6px 6px 0 0;
  display: grid; grid-template-columns: 110px 1fr 60px; align-items: center;
  padding: 0 12px 0 16px; font-size: 13px; color: #888888;
  pointer-events: auto; user-select: none;
}
.page-badge { font-weight: bold; cursor: default; }
.page-title-input {
  width: 100%; background: transparent; border: none; outline: none;
  color: #ffffff; font-size: 15px; font-weight: 600; text-align: center;
  font-family: var(--ui-font); padding: 4px 8px;
}
.page-title-input::placeholder { color: #555555; }
.page-title-input:focus { color: #38bdf8; }
.btn-page-delete {
  width: 28px; height: 28px; background: #262626; border: 1px solid #484848;
  border-radius: 6px; color: #e5e5e5; display: inline-flex; align-items: center;
  justify-content: center; cursor: pointer; padding: 0; justify-self: end;
}
.btn-page-delete:hover { background: #333333; color: #ef4444; }

/* 10px 플로팅 스크롤바 */
#floating-scrollbar-track {
  position: fixed; top: calc(var(--toolbar-height) + 12px); bottom: 80px; right: 4px;
  width: 22px; background: transparent; z-index: 2000; cursor: pointer;
  touch-action: none; -webkit-tap-highlight-color: transparent;
}
#floating-scrollbar-thumb {
  position: absolute; top: 0; right: 2px; width: 10px; min-height: 36px;
  border-radius: 6px; background: rgba(255,255,255,0.6);
  box-shadow: 0 0 8px rgba(0,0,0,0.7), inset 0 0 2px rgba(255,255,255,0.6);
  opacity: 0; transition: opacity 0.3s ease, width 0.15s ease, background 0.2s ease; touch-action: none;
}
#floating-scrollbar-thumb.visible { opacity: 0.9; }
#floating-scrollbar-thumb:hover, #floating-scrollbar-thumb.active {
  width: 12px; background: rgba(255,255,255,0.95); box-shadow: 0 0 10px rgba(56,189,248,0.8);
}

#bottom-dock {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(26,26,26,0.95); border: 1px solid #444444;
  padding: 6px 18px; border-radius: 30px; display: flex; align-items: center; gap: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.8); z-index: 1000; backdrop-filter: blur(8px);
}
#page-info { font-size: 13px; font-weight: bold; color: #d1d5db; min-width: 60px; text-align: center; }

/* 슬라이드 뷰어 */
#reader-container {
  display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: #000000; z-index: 5000; user-select: none; overflow: hidden;
}
#reader-viewport { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
.slide-sheet {
  width: var(--page-width); max-width: 820px;
  background: var(--page-bg); border: 1px solid #383838; border-radius: 8px;
  padding: 24px 36px; color: #ffffff;
  white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; overflow: hidden; display: none;
  font-family: var(--active-font);
}
.slide-sheet.active { display: block; }
.slide-title-header {
  font-size: 20px; font-weight: bold; color: #38bdf8; text-align: center;
  margin-bottom: 20px; padding-bottom: 8px; border-bottom: 1px solid #333333;
}
.touch-zone { position: absolute; top: 0; bottom: 0; width: 50%; cursor: pointer; z-index: 5500; -webkit-tap-highlight-color: transparent; }
#touch-left { left: 0; }
#touch-right { right: 0; }
#exit-reader-btn {
  position: absolute; top: 18px; right: 24px; width: 44px; height: 44px; border-radius: 50%;
  background: rgba(40,40,40,0.85); border: 1px solid #666666; color: #ffffff;
  font-size: 20px; font-weight: bold; cursor: pointer; z-index: 6000;
}
#reader-page-badge {
  position: absolute; top: 22px; left: 24px; background: rgba(30,30,30,0.85);
  border: 1px solid #444444; padding: 6px 14px; border-radius: 12px;
  color: #ffb703; font-size: 14px; font-weight: bold; z-index: 6000;
}

/* ==========================================================================
   스마트 프롬프터 모달 (에디터 완벽 일치 구조)
   ========================================================================== */
#prompter-modal {
  display: none; position: fixed; inset: 0;
  background-color: #0b0c10; z-index: 7000;
  flex-direction: column; overflow: hidden;
  font-family: var(--active-font);
  user-select: none;
}
#prompter-modal.active { display: flex; }

#prompter-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 20px; background: #12141a; border-bottom: 1px solid #20242f;
  gap: 12px; z-index: 10;
}
.p-controls-group { display: flex; align-items: center; gap: 10px; }

.p-icon-btn {
  width: 42px; height: 42px; border-radius: 8px;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; border: 1px solid #2d3342; background: #181b24; color: #e2e8f0;
  transition: all 0.15s ease;
}
.p-icon-btn svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.p-icon-btn:active { transform: scale(0.94); background: #232836; }
.p-icon-btn.active { background: #ffffff; border-color: #ffffff; }
.p-icon-btn.active svg { stroke: #000000; fill: #000000; }

.p-stepper-group {
  display: inline-flex; align-items: center; background: #12141a;
  border: 1px solid #242936; border-radius: 8px; padding: 2px 4px; gap: 2px;
}
.p-stepper-label { font-size: 13px; color: #717c91; padding-left: 6px; }
.p-stepper-btn {
  width: 32px; height: 32px; padding: 0; font-size: 18px; border: none;
  background: transparent; color: #e2e8f0; cursor: pointer;
  display: flex; align-items: center; justify-content: center; border-radius: 4px;
}
.p-stepper-btn:active { background: #232836; }
.p-stepper-value {
  min-width: 40px; text-align: center; font-size: 14px; font-weight: 600;
  color: #f1f5f9; font-variant-numeric: tabular-nums;
}

/* 80% 높이 시선 확보를 위한 상단 20vh 패딩 */
#p-viewport {
  flex: 1; overflow-y: scroll;
  padding: 20vh 0 80vh 0;
  scrollbar-width: none; position: relative;
  display: flex; justify-content: center;
}
#p-viewport::-webkit-scrollbar { display: none; }

#p-workspace-wrapper {
  position: relative;
  width: var(--page-width);
  max-width: 820px;
  flex-shrink: 0;
}

#p-content-text {
  width: 100%;
  padding: 0 36px;
  word-break: break-word;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  font-family: var(--active-font);
  font-size: 26px;
  line-height: 1.55;
  letter-spacing: 0px;
}

/* 단어 토큰 스타일 */
.p-word {
  display: inline;
  padding: 0;
  border-radius: 4px;
  transition: color 0.15s ease, background 0.15s ease;
  cursor: pointer;
}
.p-word.read {
  color: #242b3d;
}
.p-word.active {
  color: #ffffff;
  font-weight: 700;
  background: rgba(255, 255, 255, 0.2);
}
.p-word.preview-reading {
  color: #ffffff !important;
  font-weight: 600;
}
.p-word.upcoming {
  color: #525866;
}

#p-floating-scrollbar {
  position: absolute; right: 6px; top: 64px; bottom: 38px; width: 32px;
  z-index: 15; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
}
#p-floating-scrollbar.visible { opacity: 1; pointer-events: auto; }
#p-scroll-thumb {
  position: absolute; top: 0; right: 8px; width: 6px; background: #475569;
  border-radius: 4px; cursor: pointer; transition: width 0.2s, background 0.2s;
}
#p-floating-scrollbar:active #p-scroll-thumb,
#p-scroll-thumb:active { width: 10px; background: #ffffff; }

#p-status-bar {
  padding: 8px 20px; font-size: 13px; background: #090a0e; color: #555f73;
  display: flex; justify-content: space-between; border-top: 1px solid #181b24; z-index: 10;
}

#print-area { display: none; }
@media print {
  @page { margin: 15mm; size: auto; }
  html, body { position: static !important; overflow: visible !important; background: #fff !important; color: #000 !important; height: auto !important; }
  #header-toolbar, #main-viewport, #bottom-dock, #reader-container, #toast, #floating-scrollbar-track, #prompter-modal { display: none !important; }
  #print-area { display: block !important; width: 100% !important; background: #fff !important; }
  .print-page-sheet {
    page-break-after: always !important; break-after: page !important;
    padding: 10px 0 20px; color: #000 !important; font-size: 18pt !important;
    line-height: 1.6 !important; white-space: pre-wrap !important; word-break: break-word !important;
    font-family: var(--active-font);
  }
  .print-page-sheet:last-child { page-break-after: avoid !important; break-after: avoid !important; }
  .print-page-header {
    font-size: 12pt; font-weight: bold; color: #444; display: flex; justify-content: space-between;
    border-bottom: 1px solid #ddd; margin-bottom: 15px; padding-bottom: 4px;
  }
}

#toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: rgba(30,30,30,0.95); border: 1px solid #555555; color: #38bdf8;
  padding: 8px 18px; border-radius: 20px; font-size: 14px; font-weight: bold;
  opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 9000;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="header-toolbar">
  <div class="toolbar-row toolbar-row-top">
    <div class="tool-group">
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLetterSpacing(-0.5)" title="자간 좁게">
        <svg class="icon-svg" viewBox="0 0 24 24"><line x1="4" y1="12" x2="10" y2="12"></line><polyline points="7 9 10 12 7 15"></polyline><line x1="20" y1="12" x2="14" y2="12"></line><polyline points="17 9 14 12 17 15"></polyline></svg>
      </button>
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLetterSpacing(0.5)" title="자간 넓게">
        <svg class="icon-svg" viewBox="0 0 24 24"><line x1="10" y1="12" x2="4" y2="12"></line><polyline points="7 9 4 12 7 15"></polyline><line x1="14" y1="12" x2="20" y2="12"></line><polyline points="17 9 20 12 17 15"></polyline></svg>
      </button>
      <div class="divider"></div>
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLineHeight(-0.1)" title="줄간격 좁게">
        <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="9 6 12 9 15 6"></polyline><line x1="12" y1="2" x2="12" y2="9"></line><polyline points="9 18 12 15 15 18"></polyline><line x1="12" y1="22" x2="12" y2="15"></line></svg>
      </button>
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLineHeight(0.1)" title="줄간격 넓게">
        <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="8 6 12 2 16 6"></polyline><line x1="12" y1="2" x2="12" y2="10"></line><polyline points="8 18 12 22 16 18"></polyline><line x1="12" y1="22" x2="12" y2="14"></line></svg>
      </button>
      <div class="divider"></div>
      <button id="btn-font-cycle" class="btn-font" onclick="cycleFontFamily()" title="글꼴 변경">기본</button>
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="toggleBold()" title="볼드체">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path></svg>
      </button>
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="toggleItalic()" title="이탤릭체">
        <svg class="icon-svg" viewBox="0 0 24 24"><line x1="19" y1="4" x2="10" y2="4"></line><line x1="14" y1="20" x2="5" y2="20"></line><line x1="15" y1="4" x2="9" y2="20"></line></svg>
      </button>
      <button id="btn-align-cycle" class="btn-icon" onmousedown="event.preventDefault()" onclick="cycleTextAlign()" title="정렬 변경">
        <svg id="icon-align" class="icon-svg" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="15" y2="12"></line><line x1="3" y1="18" x2="18" y2="18"></line></svg>
      </button>
      <button id="btn-batch-mode" class="btn-icon" onmousedown="event.preventDefault()" onclick="toggleBatchMode()" title="모든 페이지 일괄 서식 적용 모드">
        <svg class="icon-svg" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
      </button>
      <div class="divider"></div>
      <button id="btn-install-app" class="btn-icon" onclick="promptInstallApp()" style="display:none; background:#0284c7; border-color:#38bdf8;" title="앱 설치">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      </button>
    </div>
  </div>

  <div class="toolbar-row">
    <div class="tool-group">
      <button class="btn-icon" onclick="document.getElementById('file-input').click()" title="파일 불러오기 (.txt, .json)">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path></svg>
      </button>
      <input type="file" id="file-input" accept=".txt,.json" onchange="handleFileImport(this.files)">
      <button class="btn-icon" onclick="saveNoteData()" title="저장">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
      </button>
      <button class="btn-icon" onclick="shareNoteContent()" title="텍스트 공유">
        <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
      </button>
      <button class="btn-icon" onclick="printNoteDocument()" title="문서 인쇄">

<script>
const FONT_LIST = [
  { name: '기본', family: "-apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', sans-serif" },
  { name: 'KoPub 돋움', family: "'KoPubWorld Dotum', sans-serif" },
  { name: 'KoPub 바탕', family: "'KoPubWorld Batang', serif" }
];
const ALIGN_MODES = ['left', 'center', 'right'];
const ALIGN_NAMES = ['좌측 정렬', '가운데 정렬', '우측 정렬'];

const HEADER_H = 42;
const PAD_TOP  = 24;
const PAD_BOT  = 24;
const PAGE_GAP = 28;
const EDITOR_PAD_TOP = HEADER_H + PAD_TOP;
const GAP_BLOCK = PAGE_GAP + PAD_BOT + HEADER_H + PAD_TOP;

let currentFontIndex = 0, activeColor = '#ef4444', isContinuousMode = false, isBatchMode = false;
let isPainting = false, lastPaintedKey = '';
let currentFontSize = 26, globalLetterSpacing = 0, globalLineHeight = 1.55;
let globalIsBold = false, globalIsItalic = false, currentTextAlignIndex = 0;
let pageTitles = [], undoStack = [], redoStack = [];
const MAX_HISTORY = 40;

let pageCount = 1, composing = false, reflowBusy = false, reflowQueued = false;

const viewport = document.getElementById('main-viewport');
const workspace = document.getElementById('document-workspace');
const cardsLayer = document.getElementById('page-cards-layer');
const headersLayer = document.getElementById('page-headers-layer');
const editor = document.getElementById('single-stream-editor');

const readerViewport = document.getElementById('reader-viewport');
const btnFontCycle = document.getElementById('btn-font-cycle');
const btnBatchMode = document.getElementById('btn-batch-mode');
const iconAlign = document.getElementById('icon-align');
const scrollbarThumb = document.getElementById('floating-scrollbar-thumb');
const scrollbarTrack = document.getElementById('floating-scrollbar-track');

let reserve = null;

let stableViewportH = window.innerHeight;
function cardHeight() { return Math.max(460, Math.round(stableViewportH * 0.8)); }
function contentHeight() { return cardHeight() - HEADER_H - PAD_TOP - PAD_BOT; }
function pageUnit() { return contentHeight() + GAP_BLOCK; }
function contentOriginY() { return editor.getBoundingClientRect().top + EDITOR_PAD_TOP; }

function ensureReserve() {
  let r = editor.querySelector(':scope > #pagination-reserve');
  if (!r) {
    r = document.createElement('div');
    r.id = 'pagination-reserve';
    r.setAttribute('contenteditable', 'false');
    r.setAttribute('aria-hidden', 'true');
    editor.insertBefore(r, editor.firstChild);
  } else if (editor.firstChild !== r) {
    editor.insertBefore(r, editor.firstChild);
  }
  reserve = r;
  return r;
}

function buildReserve(n) {
  const ch = contentHeight();
  const key = n + '|' + ch + '|' + GAP_BLOCK;
  if (reserve.dataset.key === key) return;
  let html = '';
  for (let i = 0; i < n - 1; i++) {
    html += '<div class="pg-col" style="height:' + ch + 'px"></div>' +
            '<div class="pg-band" style="height:' + GAP_BLOCK + 'px"></div>';
  }
  reserve.innerHTML = html;
  reserve.dataset.key = key;
}

function layoutManualBreaks() {
  const breaks = editor.querySelectorAll('.manual-break');
  if (!breaks.length) return;
  const unit = pageUnit();
  breaks.forEach(b => { b.style.height = '0px'; });
  breaks.forEach(b => {
    const top = b.getBoundingClientRect().top - contentOriginY();
    const k = Math.floor((top + 0.5) / unit);
    const target = (k + 1) * unit;
    b.style.height = Math.max(0, Math.round(target - top)) + 'px';
  });
}

function contentBottom() {
  const base = contentOriginY();
  let max = 0;
  try {
    const r = document.createRange();
    r.setStartAfter(reserve);
    r.setEnd(editor, editor.childNodes.length);
    const rects = r.getClientRects();
    for (let i = 0; i < rects.length; i++) {
      if (rects[i].height) max = Math.max(max, rects[i].bottom - base);
    }
  } catch (e) {}
  for (const el of editor.children) {
    if (el === reserve) continue;
    const rc = el.getBoundingClientRect();
    if (rc.height) max = Math.max(max, rc.bottom - base);
  }
  return max;
}

function reflow() {
  if (composing || reflowBusy) return;
  reflowBusy = true;
  ensureReserve();

  const ch = contentHeight(), unit = pageUnit();
  const minPages = 1 + editor.querySelectorAll('.manual-break').length;
  let n = Math.max(minPages, pageCount, 1);
  let shrunk = false;

  buildReserve(n);
  layoutManualBreaks();

  for (let guard = 0; guard < 40; guard++) {
    const bottom = contentBottom();
    const cap = (n - 1) * unit + ch;
    if (bottom > cap + 0.5) {
      n += Math.max(1, Math.ceil((bottom - cap) / ch));
      buildReserve(n); layoutManualBreaks();
      continue;
    }
    if (!shrunk) {
      const fit = Math.max(minPages, 1, Math.floor(Math.max(0, bottom - 0.5) / unit) + 1);
      if (fit < n) {
        n = fit; shrunk = true;
        buildReserve(n); layoutManualBreaks();
        continue;
      }
    }
    break;
  }

  pageCount = n;
  editor.classList.toggle('is-empty', editor.textContent.replace(/\u200B/g, '').trim() === '');
  renderPageChrome(n);
  reflowBusy = false;
}

function scheduleReflow() {
  if (reflowQueued || composing) return;
  reflowQueued = true;
  requestAnimationFrame(() => { reflowQueued = false; reflow(); });
}

function renderPageChrome(n) {
  const cardH = cardHeight();
  while (pageTitles.length < n) pageTitles.push('');
  if (pageTitles.length > n) pageTitles = pageTitles.slice(0, n);

  cardsLayer.innerHTML = '';
  headersLayer.innerHTML = '';

  for (let i = 0; i < n; i++) {
    const top = i * (cardH + PAGE_GAP);

    const card = document.createElement('div');
    card.className = 'page-sheet-card';
    card.style.height = cardH + 'px';
    card.style.top = top + 'px';
    cardsLayer.appendChild(card);

    const header = document.createElement('div');
    header.className = 'page-header';
    header.style.top = (top + 2) + 'px';

    const badge = document.createElement('span');
    badge.className = 'page-badge';
    badge.textContent = '[ PAGE ' + (i + 1) + ' ]';

    const title = document.createElement('input');
    title.className = 'page-title-input';
    title.type = 'text';
    title.placeholder = '';
    title.value = pageTitles[i] || '';
    title.addEventListener('input', e => { pageTitles[i] = e.target.value; saveModel(); });

    const del = document.createElement('button');
    del.className = 'btn-page-delete';
    del.type = 'button';
    del.title = '이 페이지 삭제';
    del.innerHTML = '<svg class="icon-svg" viewBox="0 0 24 24" style="width:15px;height:15px"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path></svg>';
    del.addEventListener('pointerdown', e => e.preventDefault());
    del.addEventListener('click', e => { e.stopPropagation(); deletePageAt(i); });

    header.append(badge, title, del);
    headersLayer.appendChild(header);
  }

  const total = n * cardH + (n - 1) * PAGE_GAP;
  workspace.style.height = total + 'px';
  editor.style.minHeight = total + 'px';
  document.getElementById('page-info').textContent = n + ' 페이지';
  updateFloatingScrollbar();
}

function pointAtLocalY(y) {
  const base = contentOriginY();
  const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT, {
    acceptNode(nd) {
      if (!nd.nodeValue || !nd.nodeValue.length) return NodeFilter.FILTER_REJECT;
      if (nd.parentElement && nd.parentElement.closest('#pagination-reserve')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  let nd;
  while ((nd = walker.nextNode())) {
    const nr = document.createRange();
    nr.selectNodeContents(nd);
    const box = nr.getBoundingClientRect();
    if (!box.height) continue;
    if (box.bottom - base <= y + 0.5) continue;

    let lo = 0, hi = nd.length, res = -1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      const cr = document.createRange();
      cr.setStart(nd, mid);
      cr.setEnd(nd, Math.min(nd.length, mid + 1));
      const b = cr.getBoundingClientRect();
      if (b.height && b.top - base >= y - 0.5) { res = mid; hi = mid; }
      else lo = mid + 1;
    }
    if (res >= 0) return { node: nd, offset: res };
  }
  return null;
}

function pageBoundaryPoints() {
  const unit = pageUnit(), pts = [];
  for (let i = 1; i < pageCount; i++) {
    const p = pointAtLocalY(i * unit);
    if (p) pts.push(p);
  }
  return pts;
}

function rangeBetween(from, to) {
  const r = document.createRange();
  if (from) r.setStart(from.node, from.offset); else r.setStartAfter(reserve);
  if (to) r.setEnd(to.node, to.offset); else r.setEnd(editor, editor.childNodes.length);
  return r;
}

function buildPageFragments() {
  const pts = pageBoundaryPoints();
  const out = [];
  for (let i = 0; i <= pts.length; i++) {
    const r = rangeBetween(i === 0 ? null : pts[i - 1], i < pts.length ? pts[i] : null);
    const box = document.createElement('div');
    box.appendChild(r.cloneContents());
    box.querySelectorAll('#pagination-reserve, .pg-col, .pg-band, .manual-break').forEach(x => x.remove());
    out.push(box.innerHTML);
  }
  return out;
}

function addNewPageBreak() {
  pushHistory();
  const br = document.createElement('div');
  br.className = 'manual-break';
  br.setAttribute('contenteditable', 'false');

  const sel = window.getSelection();
  let placed = false;
  if (sel && sel.rangeCount) {
    const r = sel.getRangeAt(0);
    if (editor.contains(r.commonAncestorContainer) && !editor.querySelector('#pagination-reserve').contains(r.commonAncestorContainer)) {
      r.collapse(false);
      r.insertNode(br);
      placed = true;
    }
  }
  if (!placed) editor.appendChild(br);

  const tail = document.createElement('br');
  br.parentNode.insertBefore(tail, br.nextSibling);
  const nr = document.createRange();
  nr.setStartAfter(tail); nr.collapse(true);
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(nr);

  pageTitles.splice(Math.min(pageTitles.length, pageCount), 0, '');
  saveModel();
  reflow();
  showToast('📄 새 페이지가 추가되었습니다');
}

function deletePageAt(idx) {
  if (pageCount <= 1) { showToast('⚠️ 마지막 남은 페이지는 삭제할 수 없습니다'); return; }
  pushHistory();
  const pts = pageBoundaryPoints();
  const from = idx === 0 ? null : pts[idx - 1];
  const to = idx < pts.length ? pts[idx] : null;
  const r = rangeBetween(from, to);

  const doomed = [];
  const walker = document.createTreeWalker(editor, NodeFilter.SHOW_ELEMENT, {
    acceptNode: n => n.classList && n.classList.contains('manual-break') ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP
  });
  let b; while ((b = walker.nextNode())) { if (r.intersectsNode(b)) doomed.push(b); }

  r.deleteContents();
  doomed.forEach(x => x.remove());
  pageTitles.splice(idx, 1);
  pageCount = Math.max(1, pageCount - 1);
  saveModel();
  reflow();
  showToast('🗑️ 페이지가 삭제되었습니다');
}

editor.addEventListener('compositionstart', () => { composing = true; });
editor.addEventListener('compositionend', () => { composing = false; saveModel(); scheduleReflow(); });
editor.addEventListener('input', e => {
  if (e.isComposing || composing) return;
  saveModel();
  scheduleReflow();
});
editor.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === 'Backspace' || e.key === 'Delete') pushHistory();
});
editor.addEventListener('paste', e => {
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData('text/plain');
  if (!text) return;
  pushHistory();
  document.execCommand('insertText', false, text);
  saveModel();
  scheduleReflow();
  showToast('📋 붙여넣기가 완료되었습니다');
});

/* 서식 */
let formatSelectionRange = null;

document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return;
  const r = sel.getRangeAt(0);
  if (editor.contains(r.commonAncestorContainer) && !r.collapsed) formatSelectionRange = r.cloneRange();
});

function restoreFormatSelection() {
  if (!formatSelectionRange) return false;
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(formatSelectionRange.cloneRange());
  return true;
}
function applyFormatCommand(cmd, val = null) {
  restoreFormatSelection();
  document.execCommand(cmd, false, val);
  saveModel();
  scheduleReflow();
}
function hasSelection() { return formatSelectionRange && !formatSelectionRange.collapsed && !isBatchMode; }

function toggleBold() {
  pushHistory();
  if (hasSelection()) { applyFormatCommand('bold'); return; }
  globalIsBold = !globalIsBold;
  editor.style.fontWeight = globalIsBold ? 'bold' : 'normal';
  showToast(globalIsBold ? '전체 볼드체 적용' : '전체 볼드체 해제');
  saveModel(); scheduleReflow();
}
function toggleItalic() {
  pushHistory();
  if (hasSelection()) { applyFormatCommand('italic'); return; }
  globalIsItalic = !globalIsItalic;
  editor.style.fontStyle = globalIsItalic ? 'italic' : 'normal';
  showToast(globalIsItalic ? '전체 이탤릭체 적용' : '전체 이탤릭체 해제');
  saveModel(); scheduleReflow();
}
function adjustLetterSpacing(delta) {
  globalLetterSpacing = parseFloat((globalLetterSpacing + delta).toFixed(1));
  editor.style.letterSpacing = globalLetterSpacing + 'px';
  showToast('자간: ' + globalLetterSpacing + 'px');
  saveModel(); scheduleReflow();
}
function adjustLineHeight(delta) {
  globalLineHeight = parseFloat(Math.max(0.8, globalLineHeight + delta).toFixed(2));
  editor.style.lineHeight = String(globalLineHeight);
  showToast('줄간격: ' + globalLineHeight);
  saveModel(); scheduleReflow();
}
function cycleFontFamily() {
  currentFontIndex = (currentFontIndex + 1) % FONT_LIST.length;
  try { localStorage.getItem('yslide_note_font_idx', currentFontIndex); } catch (e) {}
  document.documentElement.style.setProperty('--active-font', FONT_LIST[currentFontIndex].family);
  btnFontCycle.innerText = FONT_LIST[currentFontIndex].name;
  editor.style.fontFamily = FONT_LIST[currentFontIndex].family;
  showToast('글꼴: ' + FONT_LIST[currentFontIndex].name);
  scheduleReflow();
}
function cycleTextAlign() {
  currentTextAlignIndex = (currentTextAlignIndex + 1) % ALIGN_MODES.length;
  const mode = ALIGN_MODES[currentTextAlignIndex];
  if (mode === 'left') iconAlign.innerHTML = '<line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="15" y2="12"></line><line x1="3" y1="18" x2="18" y2="18"></line>';
  else if (mode === 'center') iconAlign.innerHTML = '<line x1="3" y1="6" x2="21" y2="6"></line><line x1="6" y1="12" x2="18" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line>';
  else iconAlign.innerHTML = '<line x1="3" y1="6" x2="21" y2="6"></line><line x1="9" y1="12" x2="21" y2="12"></line><line x1="6" y1="18" x2="21" y2="18"></line>';

  pushHistory();
  if (hasSelection()) {
    restoreFormatSelection();
    document.execCommand(mode === 'left' ? 'justifyLeft' : mode === 'center' ? 'justifyCenter' : 'justifyRight', false, null);
  } else {
    editor.style.textAlign = mode;
  }
  showToast(ALIGN_NAMES[currentTextAlignIndex] + ' 적용');
  saveModel(); scheduleReflow();
}
function changeFontSize(delta) {
  currentFontSize = Math.min(48, Math.max(16, currentFontSize + delta));

editor.addEventListener('touchstart', e => {

  pushHistory(); isPainting = true;

editor.addEventListener('touchmove', e => {
  if (!isContinuousMode || !isPainting) return;

function paintAt(x, y) {
  const r = document.caretRangeFromPoint ? document.caretRangeFromPoint(x, y) : null;
  if (!r) return;
  let n = r.startContainer;
  if (n.nodeType !== Node.TEXT_NODE && n.childNodes.length) {
    n = n.childNodes[r.startOffset] || n.firstChild;
    while (n && n.nodeType !== Node.TEXT_NODE && n.firstChild) n = n.firstChild;
  }
  if (!n || n.nodeType !== Node.TEXT_NODE) return;
  if (n.parentElement && n.parentElement.closest('#pagination-reserve')) return;

  const txt = n.textContent, off = r.startOffset;
  let a = Math.min(off, txt.length ? txt.length - 1 : 0);
  while (a > 0 && !/\s/.test(txt[a - 1])) a--;
  let b = off;
  while (b < txt.length && !/\s/.test(txt[b])) b++;
  if (a >= b) return;

  const key = txt + '_' + a + '_' + b;
  if (key === lastPaintedKey) return;
  lastPaintedKey = key;

  const wr = document.createRange();
  wr.setStart(n, a); wr.setEnd(n, b);
  const s = window.getSelection();
  s.removeAllRanges(); s.addRange(wr);
  document.execCommand('foreColor', false, activeColor);
  s.removeAllRanges();
  saveModel();
}

/* 10px 플로팅 스크롤바 */
function updateFloatingScrollbar() {
  if (!scrollbarThumb) return;
  const sh = viewport.scrollHeight, ch = viewport.clientHeight;
  if (sh <= ch + 10) { scrollbarThumb.classList.remove('visible'); return; }
  const th = Math.max(36, (ch / sh) * scrollbarTrack.clientHeight);
  const top = (viewport.scrollTop / (sh - ch)) * (scrollbarTrack.clientHeight - th);
  scrollbarThumb.style.height = th + 'px';
  scrollbarThumb.style.transform = 'translateY(' + top + 'px)';
  scrollbarThumb.classList.add('visible');
  clearTimeout(window._sf);
  window._sf = setTimeout(() => { if (!isDrag) scrollbarThumb.classList.remove('visible'); }, 1400);
}
viewport.addEventListener('scroll', updateFloatingScrollbar, { passive: true });

let isDrag = false, startY = 0, startScroll = 0, dragPointerId = null;

function scrollRangeFromDelta(dy) {
  const trackH = scrollbarTrack.clientHeight - scrollbarThumb.clientHeight;
  const scrollH = viewport.scrollHeight - viewport.clientHeight;
  if (trackH <= 0) return;
  viewport.scrollTop = Math.max(0, Math.min(scrollH, startScroll + (dy / trackH) * scrollH));
}

function beginThumbDrag(e) {
  isDrag = true;
  dragPointerId = e.pointerId;
  startY = e.clientY;
  startScroll = viewport.scrollTop;
  scrollbarThumb.classList.add('active', 'visible');
  document.body.style.userSelect = 'none';
  try { scrollbarThumb.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
  e.stopPropagation();
}
function endThumbDrag(e) {
  if (!isDrag) return;
  isDrag = false;
  scrollbarThumb.classList.remove('active');
  document.body.style.userSelect = '';
  if (dragPointerId !== null) {
    try { scrollbarThumb.releasePointerCapture(dragPointerId); } catch (err) {}
    dragPointerId = null;
  }
  updateFloatingScrollbar();
}

scrollbarThumb.addEventListener('pointerdown', beginThumbDrag);
scrollbarThumb.addEventListener('pointermove', e => {
  if (!isDrag || e.pointerId !== dragPointerId) return;
  scrollRangeFromDelta(e.clientY - startY);
  e.preventDefault();
});
scrollbarThumb.addEventListener('pointerup', endThumbDrag);
scrollbarThumb.addEventListener('pointercancel', endThumbDrag);
window.addEventListener('pointerup', endThumbDrag);

scrollbarTrack.addEventListener('pointerdown', e => {
  if (e.target === scrollbarThumb) return;
  const rect = scrollbarTrack.getBoundingClientRect();
  const thumbH = scrollbarThumb.clientHeight;
  const trackH = rect.height - thumbH;
  const scrollH = viewport.scrollHeight - viewport.clientHeight;
  if (trackH <= 0 || scrollH <= 0) return;
  const pos = Math.max(0, Math.min(trackH, e.clientY - rect.top - thumbH / 2));
  viewport.scrollTop = (pos / trackH) * scrollH;
  updateFloatingScrollbar();
  beginThumbDrag(e);
});

scrollbarTrack.addEventListener('touchstart', e => {
  scrollbarThumb.classList.add('visible');
  e.preventDefault();
}, { passive: false });

function currentStyleState() {
  return {
    fontSize: currentFontSize, lineHeight: globalLineHeight, letterSpacing: globalLetterSpacing,
    bold: globalIsBold, italic: globalIsItalic, align: currentTextAlignIndex
  };
}
function applyStyleState(s) {
  if (!s) return;
  currentFontSize = s.fontSize || 26;
  globalLineHeight = s.lineHeight || 1.55;
  globalLetterSpacing = s.letterSpacing || 0;
  globalIsBold = !!s.bold; globalIsItalic = !!s.italic;
  currentTextAlignIndex = s.align || 0;
  editor.style.fontSize = currentFontSize + 'px';
  editor.style.lineHeight = String(globalLineHeight);
  editor.style.letterSpacing = globalLetterSpacing + 'px';

function saveModel() {
  try {
    localStorage.setItem('yslide_note_v90', JSON.stringify({
      html: getContentHTML(), titles: pageTitles, style: currentStyleState()
    }));
  } catch (e) {}
}
function pushHistory() {
  const st = JSON.stringify({ html: getContentHTML(), titles: pageTitles });
  if (!undoStack.length || undoStack[undoStack.length - 1] !== st) {
    undoStack.push(st);
    if (undoStack.length > MAX_HISTORY) undoStack.shift();
    redoStack = [];
  }
}
function undo() {
  if (undoStack.length <= 1) { showToast('⚠️ 더 이상 되돌릴 작업이 없습니다'); return; }
  redoStack.push(undoStack.pop());
  const prev = JSON.parse(undoStack[undoStack.length - 1]);
  setContentHTML(prev.html);
  pageTitles = prev.titles || [];
  pageCount = 1; reflow(); saveModel();
  showToast('↶ 되돌리기');
}
function redo() {
  if (!redoStack.length) { showToast('⚠️ 다시 실행할 작업이 없습니다'); return; }
  const n = redoStack.pop();
  undoStack.push(n);
  const next = JSON.parse(n);
  setContentHTML(next.html);
  pageTitles = next.titles || [];
  pageCount = 1; reflow(); saveModel();
  showToast('↷ 다시 실행');
}

function saveNoteData() {
  saveModel();
  const now = new Date();
  const p = v => String(v).padStart(2, '0');
  const ds = now.getFullYear() + p(now.getMonth() + 1) + p(now.getDate()) + '_' + p(now.getHours()) + p(now.getMinutes());
  const blob = new Blob([JSON.stringify({ html: getContentHTML(), titles: pageTitles, style: currentStyleState() }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Yslide_' + ds + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  showToast('💾 파일로 저장되었습니다');
}

function handleFileImport(files) {
  if (!files || !files.length) return;
  const reader = new FileReader();
  reader.onload = e => {
    pushHistory();
    try {
      const x = JSON.parse(e.target.result);
      if (x.html !== undefined) {
        setContentHTML(x.html);
        pageTitles = x.titles || [];
        applyStyleState(x.style);
      } else if (Array.isArray(x)) {
        setContentHTML(x.map(p => p.html || '').join('<br><br>'));
        pageTitles = x.map(p => p.title || '');
      }
    } catch (err) {
      setContentHTML(String(e.target.result).replace(/\r\n/g, '\n').replace(/\n/g, '<br>'));
      pageTitles = [];
    }
    pageCount = 1;
    reflow();
    saveModel();
    showToast('📂 파일을 성공적으로 불러왔습니다');
  };
  reader.readAsText(files[0]);
}

async function shareNoteContent() {

  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast('📋 클립보드에 복사되었습니다'));
  }
}

async function translateSelectedTextWithGemini() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) { showToast('⚠️ 번역할 문장을 먼저 드래그하세요'); return; }
  const range = sel.getRangeAt(0);
  const temp = document.createElement('div');
  temp.appendChild(range.cloneContents());
  temp.querySelectorAll('#pagination-reserve, .manual-break').forEach(x => x.remove());
  const originalHtml = temp.innerHTML;

  let key = localStorage.getItem('yslide_gemini_api_key');
  if (!key) {
    key = prompt('Google Gemini API 키를 입력해주세요 (최초 1회 저장):');
    if (!key) return;
    localStorage.setItem('yslide_gemini_api_key', key.trim());
  }

  showToast('🌐 Gemini AI 영문 번역 중...');
  try {
    const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + encodeURIComponent(key), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: 'Translate the provided HTML naturally into dignified, accurate English. Maintain all existing HTML tags intact. Return ONLY the translated raw HTML without markdown.\n\n' + originalHtml }] }]
      })
    });
    const data = await res.json();
    let out = (((data.candidates || [])[0] || {}).content || {}).parts;
    out = out && out[0] ? out[0].text : '';
    out = String(out).replace(/^```html\s*/i, '').replace(/\s*```$/i, '').trim();
    if (!out) throw new Error('empty');

    pushHistory();
    range.deleteContents();
    const d = document.createElement('div');
    d.innerHTML = out;
    const f = document.createDocumentFragment();
    while (d.firstChild) f.appendChild(d.firstChild);
    range.insertNode(f);
    saveModel();
    reflow();
    showToast('✨ 영어 번역 완료');
  } catch (e) {
    showToast('⚠️ 번역 실패: API 키 또는 네트워크 상태를 확인하세요');
  }
}

const pState = {
  words: [],
  currentIndex: 0,
  targetScrollTop: 0,
  isListening: false,
  isDraggingThumb: false,
  fontSize: 26,
  lineHeight: 1.55,
  fadeTimer: null,
  webRecognition: null
};

function normalizePrompterWord(str) {
  return str.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"'<>]/g, "").trim().toLowerCase();
}

function parsePrompterScript(rawText) {
  const tokens = [];
  const lines = rawText.split('\n');
  lines.forEach((line, lineIdx) => {
    const words = line.trim().split(/\s+/);
    words.forEach(w => {
      if (w.length > 0) tokens.push({ raw: w, clean: normalizePrompterWord(w), isLineBreak: false });
    });
    if (lineIdx < lines.length - 1 && tokens.length > 0) tokens[tokens.length - 1].isLineBreak = true;
  });
  return tokens;
}

function renderPrompterTokens() {
  pContentText.innerHTML = '';
  pState.words.forEach((token, idx) => {
    const span = document.createElement('span');
    span.className = 'p-word upcoming';
    span.innerText = token.raw;
    span.dataset.index = idx;
    span.addEventListener('click', () => setPrompterWordIndex(idx));
    pContentText.appendChild(span);

    pContentText.appendChild(document.createTextNode(' '));

    if (token.isLineBreak) {
      pContentText.appendChild(document.createElement('br'));
    }
  });
  setPrompterWordIndex(0);
  updatePrompterThumbPosition();
}

function setPrompterWordIndex(idx) {
  if (idx < 0 || idx >= pState.words.length) return;
  pState.currentIndex = idx;
  const spans = pContentText.querySelectorAll('.p-word');
  
  // 아래 3줄 선제적 하이라이트
  const previewLookahead = 22; 
  const previewEnd = Math.min(pState.words.length, idx + previewLookahead);

  spans.forEach((s, i) => {
    if (i < idx) {
      s.className = 'p-word read';
    } else if (i === idx) {
      s.className = 'p-word active';
    } else if (i > idx && i <= previewEnd) {
      s.className = 'p-word preview-reading';
    } else {
      s.className = 'p-word upcoming';
    }
  });

  pProgressCounter.innerText = `${pState.currentIndex + 1} / ${pState.words.length}`;
  if (!pState.isDraggingThumb) updatePrompterTargetScroll();
}

function updatePrompterTargetScroll() {
  const activeSpan = pContentText.querySelector(`.p-word[data-index="${pState.currentIndex}"]`);
  if (!activeSpan) return;
  const offset = activeSpan.getBoundingClientRect().top - pViewport.getBoundingClientRect().top;
  const targetLine = pViewport.clientHeight * 0.20; // 80% 높이에 배치
  pState.targetScrollTop = pViewport.scrollTop + (offset - targetLine);
}

function smoothPrompterScrollLoop() {
  if (!pState.isDraggingThumb && prompterModal.classList.contains('active')) {
    const diff = pState.targetScrollTop - pViewport.scrollTop;
    if (Math.abs(diff) > 0.5) pViewport.scrollTop += diff * 0.1;
  }
  requestAnimationFrame(smoothPrompterScrollLoop);
}
requestAnimationFrame(smoothPrompterScrollLoop);

// --- 텍스트 유사도 계산 ---
function getSimilarity(s1, s2) {
  if (s1 === s2) return 1.0;
  if (!s1 || !s2) return 0;
  
  // 어근 접두사 일치 (2글자 이상 일치 시 높은 점수)
  if (s1.length >= 2 && s2.length >= 2) {
    if (s1.startsWith(s2.slice(0, 2)) || s2.startsWith(s1.slice(0, 2))) return 0.88;
  }

  const getBigrams = str => {
    const s = new Set();
    for (let i = 0; i < str.length - 1; i++) s.add(str.slice(i, i + 2));
    return s;
  };
  
  const b1 = getBigrams(s1);
  const b2 = getBigrams(s2);
  if (b1.size === 0 || b2.size === 0) return s1.includes(s2) || s2.includes(s1) ? 0.7 : 0;

  let intersection = 0;
  b1.forEach(bg => { if (b2.has(bg)) intersection++; });
  return (2.0 * intersection) / (b1.size + b2.size);
}

// --- 안전 잠금(Screen Bounds Guard) 음성 매칭 엔진 ---
window.onNativeSpeechResult = function(recognizedText) {
  pSpeechPreview.innerText = `🗣️ ${recognizedText.slice(-20)}`;
  const incomingWords = recognizedText.trim().split(/\s+/).map(normalizePrompterWord).filter(Boolean);
  if (incomingWords.length === 0) return;

  const recentSpoken = incomingWords.slice(-3);

  // [핵심 방어선]: 현재 화면에서 벗어난 먼 과거/먼 미래로의 점프를 원천 차단
  // 이전으로는 절대 되돌아가지 않으며(뒤로 최대 1단어만 허용),
  // 앞으로도 현재 태블릿 화면 시야 내에 들어와 있는 약 10~12단어 안쪽에서만 탐색합니다.
  const lookBehind = Math.max(0, pState.currentIndex - 1);
  const lookAhead = Math.min(pState.words.length, pState.currentIndex + 12);

  let bestMatchIdx = -1;
  let bestScore = 0;

  for (let spoken of recentSpoken) {
    if (spoken.length < 2) continue;

    for (let i = lookBehind; i < lookAhead; i++) {
      const targetClean = pState.words[i].clean;
      const score = getSimilarity(targetClean, spoken);

      // 충분한 일치도(0.68) 이상일 때만 매칭 인정
      if (score > 0.68 && score > bestScore) {
        bestScore = score;
        bestMatchIdx = i;
      }
    }
  }

  // 화면 내 안전 범위에서 확인된 단어일 때만 스크롤 위치 이동
  if (bestMatchIdx !== -1 && bestMatchIdx >= pState.currentIndex) {
    setPrompterWordIndex(bestMatchIdx);
  }
};

function initBrowserWebSpeech() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return null;
  const rec = new SpeechRecognition();
  rec.continuous = true;
  rec.interimResults = true;
  rec.lang = 'ko-KR';
  rec.onresult = (e) => {
    let t = '';
    for (let i = e.resultIndex; i < e.results.length; ++i) t += e.results[i][0].transcript;
    window.onNativeSpeechResult(t);
  };
  rec.onend = () => {
    if (pState.isListening && !window.AndroidBridge) {
      try { rec.start(); } catch (err) {}
    }
  };
  return rec;
}

function startPrompterListening() {
  pState.isListening = true;
  pBtnToggle.classList.add('active');
  pIconMic.style.display = 'none';
  pIconStop.style.display = 'block';
  pSpeechPreview.innerText = "듣고 있습니다...";

  if (window.AndroidBridge && window.AndroidBridge.startSpeechRecognition) {
    window.AndroidBridge.startSpeechRecognition();
  } else {
    if (!pState.webRecognition) pState.webRecognition = initBrowserWebSpeech();
    if (pState.webRecognition) {
      try { pState.webRecognition.start(); } catch(e) {}
    }
  }
}

function stopPrompterListening() {
  pState.isListening = false;
  pBtnToggle.classList.remove('active');
  pIconMic.style.display = 'block';
  pIconStop.style.display = 'none';
  pSpeechPreview.innerText = "정지됨";

  if (window.AndroidBridge && window.AndroidBridge.stopSpeechRecognition) {
    window.AndroidBridge.stopSpeechRecognition();
  } else if (pState.webRecognition) {
    try { pState.webRecognition.stop(); } catch(e) {}
  }
}

pBtnToggle.addEventListener('click', () => {
  if (pState.isListening) stopPrompterListening();
  else startPrompterListening();
});

function showPrompterScrollbar() {
  pFloatingScrollbar.classList.add('visible');
  clearTimeout(pState.fadeTimer);
  if (!pState.isDraggingThumb) {
    pState.fadeTimer = setTimeout(() => pFloatingScrollbar.classList.remove('visible'), 1500);
  }
}

function updatePrompterThumbPosition() {
  const scrollHeight = pViewport.scrollHeight;
  const clientHeight = pViewport.clientHeight;
  const trackHeight = pFloatingScrollbar.clientHeight;
  if (scrollHeight <= clientHeight) {
    pScrollThumb.style.display = 'none';
    return;
  }
  pScrollThumb.style.display = 'block';
  const thumbHeight = Math.max(40, (clientHeight / scrollHeight) * trackHeight);
  pScrollThumb.style.height = `${thumbHeight}px`;

  const maxScrollTop = scrollHeight - clientHeight;
  const currentRatio = pViewport.scrollTop / maxScrollTop;
  pScrollThumb.style.top = `${currentRatio * (trackHeight - thumbHeight)}px`;
}

pViewport.addEventListener('scroll', () => {
  if (!pState.isDraggingThumb) {
    updatePrompterThumbPosition();
    showPrompterScrollbar();
  }
});

function handlePrompterThumbMove(clientY) {
  const trackRect = pFloatingScrollbar.getBoundingClientRect();
  const trackHeight = pFloatingScrollbar.clientHeight;
  const thumbHeight = pScrollThumb.offsetHeight;
  const maxTop = trackHeight - thumbHeight;

  let relativeY = Math.max(0, Math.min(maxTop, clientY - trackRect.top - (thumbHeight / 2)));
  const ratio = relativeY / maxTop;
  pViewport.scrollTop = ratio * (pViewport.scrollHeight - pViewport.clientHeight);
  pState.targetScrollTop = pViewport.scrollTop;
  pScrollThumb.style.top = `${relativeY}px`;
}

function onPrompterPointerDown(e) {
  pState.isDraggingThumb = true;
  showPrompterScrollbar();
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  handlePrompterThumbMove(clientY);

  const onMove = (me) => handlePrompterThumbMove(me.touches ? me.touches[0].clientY : me.clientY);
  const onUp = () => {
    pState.isDraggingThumb = false;
    showPrompterScrollbar();
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
    window.removeEventListener('touchmove', onMove);
    window.removeEventListener('touchend', onUp);
  };
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onUp);
}

pFloatingScrollbar.addEventListener('mousedown', onPrompterPointerDown);
pFloatingScrollbar.addEventListener('touchstart', onPrompterPointerDown, { passive: false });

function applyPrompterStyle() {
  pValFontSize.innerText = pState.fontSize;
  pValLineHeight.innerText = pState.lineHeight;
  pContentText.style.fontSize = `${pState.fontSize}px`;
  pContentText.style.lineHeight = String(pState.lineHeight);
  pContentText.style.letterSpacing = `${globalLetterSpacing}px`;
  pContentText.style.textAlign = ALIGN_MODES[currentTextAlignIndex];
  pContentText.style.fontFamily = FONT_LIST[currentFontIndex].family;
  pContentText.style.fontWeight = globalIsBold ? 'bold' : 'normal';
  pContentText.style.fontStyle = globalIsItalic ? 'italic' : 'normal';
  updatePrompterTargetScroll();
  updatePrompterThumbPosition();
}

pBtnFontDec.addEventListener('click', () => {
  pState.fontSize = Math.max(16, pState.fontSize - 2);
  applyPrompterStyle();
});
pBtnFontInc.addEventListener('click', () => {
  pState.fontSize = Math.min(64, pState.fontSize + 2);
  applyPrompterStyle();
});
pBtnLineDec.addEventListener('click', () => {
  pState.lineHeight = Math.max(1.0, parseFloat((pState.lineHeight - 0.05).toFixed(2)));
  applyPrompterStyle();
});
pBtnLineInc.addEventListener('click', () => {
  pState.lineHeight = Math.min(3.0, parseFloat((pState.lineHeight + 0.05).toFixed(2)));
  applyPrompterStyle();
});

function openSmartPrompter() {
  const fullText = editor.innerText.replace(/\u200B/g, '').trim();
  if (!fullText) {
    showToast('⚠️ 프롬프터로 읽을 원고 내용이 없습니다');
    return;
  }
  
  pState.fontSize = currentFontSize;
  pState.lineHeight = globalLineHeight;
  applyPrompterStyle();

  pState.words = parsePrompterScript(fullText);
  renderPrompterTokens();
  prompterModal.classList.add('active');
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
}

function closeSmartPrompter() {
  if (pState.isListening) stopPrompterListening();
  prompterModal.classList.remove('active');
  if (document.fullscreenElement && document.exitFullscreen) {
    document.exitFullscreen().catch(() => {});
  }
}

const headerToolbar = document.getElementById('header-toolbar');
const bottomDock = document.getElementById('bottom-dock');
const vv = window.visualViewport;
let keyboardInset = 0;

function syncViewportInsets() {
  if (!vv) return;
  const visibleBottom = vv.offsetTop + vv.height;
  if (visibleBottom > stableViewportH) stableViewportH = Math.round(visibleBottom);
  keyboardInset = Math.max(0, Math.round(stableViewportH - visibleBottom));
  const topShift = Math.round(vv.offsetTop);

  headerToolbar.style.transform = 'translateY(' + topShift + 'px)';
  bottomDock.style.transform = 'translateX(-50%) translateY(' + keyboardInset + 'px)';
  scrollbarTrack.style.transform = 'translateY(' + keyboardInset + 'px)';
}

if (vv) {
  vv.addEventListener('resize', syncViewportInsets);
  vv.addEventListener('scroll', syncViewportInsets);
}
window.addEventListener('orientationchange', () => {
  setTimeout(() => {
    stableViewportH = window.innerHeight;
    syncViewportInsets();
    pageCount = 1;
    reflow();
  }, 250);
});

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    syncViewportInsets();
    if (keyboardInset > 80) return;
    stableViewportH = window.innerHeight;
    pageCount = 1;
    reflow();
  }, 160);
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => t.classList.remove('show'), 1500);
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  const btn = document.getElementById('btn-install-app');
  if (btn) btn.style.display = 'inline-flex';
});
function promptInstallApp() {
  if (!deferredPrompt) { showToast('💡 브라우저 메뉴의 [홈 화면에 추가] 또는 [설치]를 눌러주세요'); return; }
  deferredPrompt.prompt();
  deferredPrompt.userChoice.finally(() => {
    deferredPrompt = null;
    const btn = document.getElementById('btn-install-app');
    if (btn) btn.style.display = 'none';
  });
}

function init() {
  try {
    const f = localStorage.getItem('yslide_note_font_idx');
    if (f !== null) currentFontIndex = (+f) % FONT_LIST.length;
    document.documentElement.style.setProperty('--active-font', FONT_LIST[currentFontIndex].family);
    btnFontCycle.innerText = FONT_LIST[currentFontIndex].name;
    editor.style.fontFamily = FONT_LIST[currentFontIndex].family;

    const saved = localStorage.getItem('yslide_note_v90') || localStorage.getItem('yslide_note_v70');
    if (saved) {
      const x = JSON.parse(saved);
      setContentHTML((x.html || '').replace(/<div class="page-gap-spacer"[^>]*>[\s\S]*?<\/div>/gi, ''));
      pageTitles = x.titles || [];
      applyStyleState(x.style);
    } else {
      setContentHTML('');
    }
  } catch (e) { setContentHTML(''); }

  ensureReserve();
  syncViewportInsets();
  pushHistory();
  reflow();
  requestAnimationFrame(reflow);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { pageCount = 1; reflow(); });
}

init();
</script>
