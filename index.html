<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Samsung Notes Web</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  :root {
    --bg-main: #141414;
    --panel-bg: #1f1f1f;
    --border-color: #333333;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --text-primary: #f3f4f6;
    --text-secondary: #9ca3af;
    --page-bg: #ffffff;
    --page-width: 800px;
    --page-height: 1130px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', sans-serif;
    background-color: var(--bg-main);
    color: var(--text-primary);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 상단 메인 툴바 */
  #header-toolbar {
    height: 52px;
    background-color: var(--panel-bg);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 100;
  }

  .tool-row { display: flex; align-items: center; gap: 6px; }

  button {
    height: 32px;
    padding: 0 10px;
    background-color: #2b2b2b;
    border: 1px solid #404040;
    border-radius: 6px;
    color: #d1d5db;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    user-select: none;
    transition: background 0.15s;
  }
  button:hover { background-color: #383838; color: #fff; }
  button.active { background-color: var(--accent); border-color: #60a5fa; color: #fff; }

  .divider { width: 1px; height: 18px; background-color: var(--border-color); margin: 0 4px; }

  /* 펜/형광펜 옵션 */
  .color-circle {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid #555;
    cursor: pointer;
  }
  .color-circle.selected { border-color: #ffffff; transform: scale(1.15); }
  .c-black { background-color: #111111; }
  .c-blue { background-color: #2563eb; }
  .c-red { background-color: #dc2626; }
  .c-yellow { background-color: #facc15; }

  /* 메인 컨테이너 */
  #main-viewport {
    flex: 1;
    overflow-y: auto;
    background-color: #0d0d0d;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 0 80px 0;
    gap: 20px;
  }

  /* 삼성노트 스타일 A4 페이지 시트 */
  .note-page-card {
    width: var(--page-width);
    height: var(--page-height);
    background-color: var(--page-bg);
    box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    position: relative;
    border-radius: 2px;
    overflow: hidden;
  }

  /* 줄/모눈 템플릿 레이어 */
  .page-template {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 1;
  }
  .template-ruled {
    background-image: linear-gradient(#e2e8f0 1px, transparent 1px);
    background-size: 100% 32px;
    margin-top: 50px;
  }
  .template-grid {
    background-size: 24px 24px;
    background-image: 
      linear-gradient(to right, #f1f5f9 1px, transparent 1px),
      linear-gradient(to bottom, #f1f5f9 1px, transparent 1px);
  }

  /* 텍스트 편집 레이어 */
  .text-layer {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    padding: 50px 48px;
    font-size: 18px;
    line-height: 32px;
    color: #1e293b;
    outline: none;
    white-space: pre-wrap;
    word-break: keep-all;
    z-index: 2;
  }

  /* S펜 / 손글씨 드로잉 캔버스 */
  .drawing-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 3;
    pointer-events: none;
  }
  body.mode-draw .drawing-canvas { pointer-events: auto; cursor: crosshair; }
  body.mode-text .drawing-canvas { pointer-events: none; }

  /* 하단 플로팅 페이지 컨트롤러 */
  #page-dock {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(30, 30, 30, 0.9);
    border: 1px solid #444;
    padding: 6px 14px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    z-index: 1000;
  }
  #page-counter { font-size: 13px; font-weight: bold; color: #e5e5e5; }
</style>
</head>
<body class="mode-text">

<!-- 상단 툴바 -->
<div id="header-toolbar">
  <div class="tool-row">
    <button id="btn-mode-text" class="active" onclick="setMode('text')">⌨️ 텍스트</button>
    <button id="btn-mode-pen" onclick="setMode('pen')">🖊️ 펜</button>
    <button id="btn-mode-highlighter" onclick="setMode('highlighter')">🖍️ 형광펜</button>
    <button id="btn-mode-eraser" onclick="setMode('eraser')">🧹 지우개</button>
    <div class="divider"></div>
    <div class="color-circle c-black selected" onclick="setColor('#111111', this)"></div>
    <div class="color-circle c-blue" onclick="setColor('#2563eb', this)"></div>
    <div class="color-circle c-red" onclick="setColor('#dc2626', this)"></div>
    <div class="color-circle c-yellow" onclick="setColor('#facc15', this)"></div>
  </div>

  <div class="tool-row">
    <button onclick="toggleTemplate()">📑 양식 변경</button>
    <div class="divider"></div>
    <button onclick="saveNote()">💾 저장</button>
    <button onclick="printOrExportPDF()">🖨️ PDF/인쇄</button>
  </div>
</div>

<!-- 메인 노트 페이지 뷰포트 -->
<div id="main-viewport"></div>

<!-- 하단 고정 페이지 컨트롤러 -->
<div id="page-dock">
  <span id="page-counter">1 / 1</span>
  <button onclick="addNewPage()">➕ 페이지 추가</button>
</div>

<script>
  let currentMode = 'text'; // 'text', 'pen', 'highlighter', 'eraser'
  let drawColor = '#111111';
  let penWidth = 3;
  let currentTemplate = 'ruled'; // 'blank', 'ruled', 'grid'
  let pagesData = [];

  const viewport = document.getElementById('main-viewport');

  function initApp() {
    const saved = localStorage.getItem('samsung_notes_data');
    if (saved) {
      try {
        pagesData = JSON.parse(saved);
      } catch (e) {
        pagesData = [{ text: '', drawing: null }];
      }
    } else {
      pagesData = [
        { text: '삼성노트 웹 에디터에 오신 것을 환영합니다.\n\n상단 툴바에서 텍스트 입력과 S펜 스타일 드로잉 모드를 전환할 수 있습니다.', drawing: null }
      ];
    }
    renderAllPages();
  }

  function renderAllPages() {
    viewport.innerHTML = '';
    pagesData.forEach((pageData, index) => {
      const pageCard = document.createElement('div');
      pageCard.className = 'note-page-card';
      pageCard.id = `page-${index}`;

      // 템플릿 레이어
      const templateLayer = document.createElement('div');
      templateLayer.className = `page-template template-${currentTemplate}`;
      pageCard.appendChild(templateLayer);

      // 텍스트 레이어
      const textLayer = document.createElement('div');
      textLayer.className = 'text-layer';
      textLayer.contentEditable = 'true';
      textLayer.spellcheck = false;
      textLayer.innerHTML = pageData.text || '';
      textLayer.oninput = () => {
        pagesData[index].text = textLayer.innerHTML;
      };
      pageCard.appendChild(textLayer);

      // 캔버스 드로잉 레이어
      const canvas = document.createElement('canvas');
      canvas.className = 'drawing-canvas';
      canvas.width = 800;
      canvas.height = 1130;
      pageCard.appendChild(canvas);

      setupCanvasEvents(canvas, index);

      // 저장된 드로잉 복원
      if (pageData.drawing) {
        const img = new Image();
        img.onload = () => canvas.getContext('2d').drawImage(img, 0, 0);
        img.src = pageData.drawing;
      }

      viewport.appendChild(pageCard);
    });

    updatePageCount();
  }

  function setupCanvasEvents(canvas, pageIndex) {
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;

    function startDraw(e) {
      if (currentMode === 'text') return;
      isDrawing = true;
      const rect = canvas.getBoundingClientRect();
      lastX = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
      lastY = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
    }

    function draw(e) {
      if (!isDrawing || currentMode === 'text') return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
      const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;

      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(x, y);

      if (currentMode === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = 20;
        ctx.lineCap = 'round';
        ctx.stroke();
      } else if (currentMode === 'highlighter') {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = drawColor === '#111111' ? 'rgba(250, 204, 21, 0.4)' : drawColor + '66';
        ctx.lineWidth = 18;
        ctx.lineCap = 'square';
        ctx.stroke();
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = drawColor;
        ctx.lineWidth = penWidth;
        ctx.lineCap = 'round';
        ctx.stroke();
      }

      lastX = x;
      lastY = y;
    }

    function stopDraw() {
      if (!isDrawing) return;
      isDrawing = false;
      pagesData[pageIndex].drawing = canvas.toDataURL();
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDraw);

    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    window.addEventListener('touchend', stopDraw);
  }

  function setMode(mode) {
    currentMode = mode;
    document.body.className = `mode-${mode === 'text' ? 'text' : 'draw'}`;
    document.querySelectorAll('#header-toolbar button').forEach(b => b.classList.remove('active'));
    
    if (mode === 'text') document.getElementById('btn-mode-text').classList.add('active');
    if (mode === 'pen') document.getElementById('btn-mode-pen').classList.add('active');
    if (mode === 'highlighter') document.getElementById('btn-mode-highlighter').classList.add('active');
    if (mode === 'eraser') document.getElementById('btn-mode-eraser').classList.add('active');
  }

  function setColor(color, el) {
    drawColor = color;
    document.querySelectorAll('.color-circle').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    if (currentMode === 'text' || currentMode === 'eraser') setMode('pen');
  }

  function toggleTemplate() {
    const templates = ['blank', 'ruled', 'grid'];
    let idx = templates.indexOf(currentTemplate);
    currentTemplate = templates[(idx + 1) % templates.length];
    
    document.querySelectorAll('.page-template').forEach(t => {
      t.className = `page-template template-${currentTemplate}`;
    });
  }

  function addNewPage() {
    pagesData.push({ text: '', drawing: null });
    renderAllPages();
    const lastPage = document.querySelector('.note-page-card:last-child');
    if (lastPage) lastPage.scrollIntoView({ behavior: 'smooth' });
  }

  function updatePageCount() {
    document.getElementById('page-counter').innerText = `총 ${pagesData.length} 페이지`;
  }

  function saveNote() {
    try {
      localStorage.setItem('samsung_notes_data', JSON.stringify(pagesData));
      alert('💾 노트가 성공적으로 저장되었습니다.');
    } catch (e) {
      alert('⚠️ 용량 제한으로 인해 브라우저 저장에 실패했습니다.');
    }
  }

  function printOrExportPDF() {
    window.print();
  }

  initApp();
</script>
</body>
</html>
