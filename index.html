<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yslide Note</title>

<!-- PWA 메타 태그 및 아이콘 설정 -->
<meta name="theme-color" content="#181818">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yslide">
<link rel="apple-touch-icon" href="https://api.iconify.design/fluent-emoji:memo.svg">
<link id="manifest-link" rel="manifest">

<!-- KoPubWorld 및 Pretendard CDN 로드 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-kopubworld@1.0.0/kopubworld.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

<style>
  :root {
    --bg-main: #0a0a0a;
    --panel-bg: #181818;
    --border-color: #333333;
    --page-bg: #141414;
    --page-border: #444444;
    --text-color: #ffffff;
    --accent: #38bdf8;
    --toolbar-height: 96px;
    --page-width: min(820px, 92vw);
    --page-card-height: 80vh;
    --header-height: 42px;
    --page-gap: 28px;
    --active-font: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
    --ui-font: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background-color: var(--bg-main);
    color: var(--text-color);
    font-family: var(--ui-font);
    overflow: hidden;
  }

  /* 상단 2단 고정 툴바 */
  #header-toolbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: var(--toolbar-height);
    background-color: var(--panel-bg);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 16px;
    z-index: 1000;
    user-select: none;
    gap: 6px;
  }

  .toolbar-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: 40px;
    overflow-x: auto;
    white-space: nowrap;
    gap: 8px;
  }
  .toolbar-row::-webkit-scrollbar { display: none; }

  .toolbar-row-top {
    justify-content: flex-start;
    border-bottom: 1px solid #282828;
    padding-bottom: 4px;
    height: 38px;
    gap: 8px;
  }

  .tool-group {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  button {
    height: 32px;
    padding: 0 10px;
    background-color: #262626;
    border: 1px solid #484848;
    border-radius: 6px;
    color: #e5e5e5;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    flex-shrink: 0;
    transition: all 0.15s ease;
    font-family: var(--ui-font);
  }
  button:hover { background-color: #333333; }
  button:active { transform: scale(0.97); }

  .btn-icon {
    width: 32px;
    height: 32px;
    padding: 0;
  }
  .icon-svg {
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .divider {
    width: 1px;
    height: 20px;
    background-color: var(--border-color);
    margin: 0 2px;
    flex-shrink: 0;
  }

  #btn-continuous.active, #btn-batch-mode.active {
    background-color: #ea580c !important;
    border-color: #f97316 !important;
    color: #ffffff !important;
    box-shadow: 0 0 10px rgba(234, 88, 12, 0.6);
  }

  .color-btn {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid #555555;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.15s ease;
  }
  .color-btn.selected {
    border-color: #ffffff;
    transform: scale(1.2);
    box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
  }
  .c-white { background-color: #ffffff; }
  .c-red { background-color: #ef4444; }
  .c-yellow { background-color: #ffb703; }
  .c-blue { background-color: #38bdf8; }
  .c-green { background-color: #4ade80; }

  .btn-font {
    height: 30px;
    padding: 0 10px;
    font-size: 12px;
    font-weight: bold;
    color: #d1d5db;
    background-color: #262626;
    border: 1px solid #484848;
    border-radius: 6px;
  }

  .size-box {
    display: inline-flex;
    align-items: center;
    background-color: #262626;
    border: 1px solid #484848;
    border-radius: 6px;
    padding: 2px 4px;
    gap: 2px;
    height: 32px;
    flex-shrink: 0;
  }
  .btn-size-step {
    width: 20px;
    height: 20px;
    padding: 0;
    background: transparent;
    border: none;
    color: #cccccc;
    font-size: 14px;
  }
  #size-display {
    font-size: 13px;
    font-weight: bold;
    min-width: 20px;
    text-align: center;
    color: #38bdf8;
  }

  #file-input { display: none; }

  /* 메인 뷰포트 */
  #main-viewport {
    position: fixed;
    top: var(--toolbar-height);
    bottom: 0;
    left: 0;
    right: 0;
    background-color: var(--bg-main);
    display: flex;
    -webkit-overflow-scrolling: touch;
    z-index: 10;
  }

  #main-viewport.view-scroll {
    overflow-y: auto !important;
    overflow-x: hidden;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 140px 16px;
    gap: var(--page-gap);
  }
  #main-viewport.view-scroll::-webkit-scrollbar { display: none; }

  #main-viewport.view-page {
    overflow-x: auto !important;
    overflow-y: hidden;
    flex-direction: row;
    align-items: center;
    scroll-snap-type: x mandatory;
    padding: 0;
    gap: 0;
  }
  #main-viewport.view-page::-webkit-scrollbar { display: none; }

  #main-viewport.view-page .page-lens-wrapper {
    flex: 0 0 100vw;
    width: 100vw;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    scroll-snap-align: center;
    scroll-snap-stop: always;
    box-sizing: border-box;
    padding: 12px;
  }

  /* 플로팅 스크롤바 */
  #floating-scrollbar-track {
    position: fixed;
    top: calc(var(--toolbar-height) + 12px);
    bottom: 80px;
    right: 6px;
    width: 12px;
    background: transparent;
    z-index: 2000;
    cursor: pointer;
  }

  #floating-scrollbar-thumb {
    position: absolute;
    top: 0;
    right: 0;
    width: 6px;
    min-height: 32px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.45);
    box-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
    opacity: 0;
    transition: opacity 0.4s ease, background 0.2s;
    touch-action: none;
  }
  #floating-scrollbar-thumb.visible { opacity: 0.85; }

  /* 페이지 카드 */
  .note-page-card {
    width: var(--page-width);
    max-width: 820px;
    height: var(--page-card-height);
    min-height: 460px;
    background-color: var(--page-bg);
    border: 2px solid var(--page-border);
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.05);
    position: relative;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }

  .page-header {
    height: var(--header-height);
    background-color: #1a1a1a;
    border-bottom: 1px solid #333333;
    display: grid;
    grid-template-columns: 110px 1fr 60px;
    align-items: center;
    padding: 0 12px 0 16px;
    font-size: 13px;
    color: #888888;
    flex-shrink: 0;
    box-sizing: border-box;
    z-index: 5;
  }

  .page-badge {
    font-weight: bold;
    user-select: none;
    cursor: default;
  }

  .page-title-input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    font-family: var(--ui-font);
    padding: 4px 8px;
  }
  .page-title-input::placeholder { color: #555555; }
  .page-title-input:focus { color: #38bdf8; }

  .btn-page-delete {
    width: 28px;
    height: 28px;
    background-color: #262626;
    border: 1px solid #484848;
    border-radius: 6px;
    color: #e5e5e5;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s ease;
    padding: 0;
    justify-self: end;
  }
  .btn-page-delete:hover {
    background-color: #333333;
    color: #ef4444;
  }

  .page-editor {
    flex: 1;
    width: 100%;
    height: calc(100% - var(--header-height));
    max-height: calc(100% - var(--header-height));
    padding: 24px 36px;
    color: #ffffff;
    font-size: 26px;
    line-height: 1.55;
    outline: none;
    white-space: pre-wrap;
    word-break: break-word;
    overflow-y: hidden;
    cursor: text;
    font-family: var(--active-font);
    box-sizing: border-box;
  }

  .page-editor.is-placeholder { color: #666666 !important; }

  body.paint-mode .page-editor {
    cursor: crosshair !important;
    user-select: none;
  }

  /* 하단 독 */
  #bottom-dock {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(26, 26, 26, 0.95);
    border: 1px solid #444444;
    padding: 6px 18px;
    border-radius: 30px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
    z-index: 1000;
    backdrop-filter: blur(8px);
  }
  #page-info { font-size: 13px; font-weight: bold; color: #d1d5db; }

  /* 전체화면 슬라이드 뷰어 */
  #reader-container {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background-color: #000000;
    z-index: 5000;
    user-select: none;
    overflow: hidden;
  }

  #reader-viewport {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .slide-sheet {
    width: var(--page-width);
    max-width: 820px;
    height: var(--page-card-height);
    min-height: 480px;
    background-color: var(--page-bg);
    border: 1px solid #383838;
    border-radius: 8px;
    padding: 28px 40px;
    color: #ffffff;
    font-size: 26px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    overflow: hidden;
    display: none;
    box-sizing: border-box;
    font-family: var(--active-font);
  }
  .slide-sheet.active { display: block; }

  .slide-title-header {
    font-size: 20px;
    font-weight: bold;
    color: #38bdf8;
    text-align: center;
    margin-bottom: 20px;
    padding-bottom: 8px;
    border-bottom: 1px solid #333333;
  }

  .touch-zone {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50%;
    cursor: pointer;
    z-index: 5500;
    -webkit-tap-highlight-color: transparent;
  }
  #touch-left { left: 0; }
  #touch-right { right: 0; }

  #exit-reader-btn {
    position: absolute; top: 18px; right: 24px;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(40, 40, 40, 0.85); border: 1px solid #666666;
    color: #ffffff; font-size: 20px; font-weight: bold;
    cursor: pointer; z-index: 6000;
  }

  #reader-page-badge {
    position: absolute; top: 22px; left: 24px;
    background: rgba(30, 30, 30, 0.85); border: 1px solid #444444;
    padding: 6px 14px; border-radius: 12px;
    color: #ffb703; font-size: 14px; font-weight: bold;
    z-index: 6000;
  }

  #print-area { display: none; }
  @media print {
    @page { margin: 15mm; size: auto; }
    html, body {
      position: static !important;
      overflow: visible !important;
      background-color: #ffffff !important;
      color: #000000 !important;
    }
    #header-toolbar, #main-viewport, #bottom-dock, #reader-container, #toast, #floating-scrollbar-track {
      display: none !important;
    }
    #print-area {
      display: block !important;
      width: 100% !important;
    }
    .print-page-sheet {
      page-break-after: always !important;
      padding: 10px 0 20px 0;
      color: #000000 !important;
      font-size: 18pt !important;
      line-height: 1.6 !important;
      white-space: pre-wrap !important;
      word-break: break-word !important;
      font-family: var(--active-font);
    }
    .print-page-sheet:last-child { page-break-after: avoid !important; }
    .print-page-header {
      font-size: 12pt;
      font-weight: bold;
      color: #444;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #ddd;
      margin-bottom: 15px;
      padding-bottom: 4px;
    }
  }

  #toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(30, 30, 30, 0.95);
    border: 1px solid #555555;
    color: #38bdf8;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 9000;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- 상단 2단 툴바 -->
<div id="header-toolbar">
  <div class="toolbar-row toolbar-row-top">
    <div class="tool-group">
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLetterSpacing(-0.5)" title="자간 좁게">
        <svg class="icon-svg" viewBox="0 0 24 24"><line x1="4" y1="12" x2="10" y2="12"></line><polyline points="7 9 10 12 7 15"></polyline><line x1="20" y1="12" x2="14" y2="12"></line><polyline points="17 9 14 12 17 15"></polyline></svg>
      </button>
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLetterSpacing(0.5)" title="자간 넓게">
        <svg class="icon-svg" viewBox="0 0 24 24"><line x1="10" y1="12" x2="4" y2="12"></line><polyline points="7 9 4 12 7 15"></polyline><line x1="14" y1="12" x2="20" y2="12"></line><polyline points="17 9 20 12 17 15"></polyline></svg>
      </button>

      <div class="divider"></div>

      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLineHeight(-0.1)" title="줄간격 좁게">
        <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="9 6 12 9 15 6"></polyline><line x1="12" y1="2" x2="12" y2="9"></line><polyline points="9 18 12 15 15 18"></polyline><line x1="12" y1="22" x2="12" y2="15"></line></svg>
      </button>
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLineHeight(0.1)" title="줄간격 넓게">
        <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="8 6 12 2 16 6"></polyline><line x1="12" y1="2" x2="12" y2="10"></line><polyline points="8 18 12 22 16 18"></polyline><line x1="12" y1="22" x2="12" y2="14"></line></svg>
      </button>

      <div class="divider"></div>

      <button id="btn-font-cycle" class="btn-font" onclick="cycleFontFamily()" title="글꼴 변경">기본</button>

      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="toggleBold()" title="볼드체">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path></svg>
      </button>

      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="toggleItalic()" title="이탤릭체">
        <svg class="icon-svg" viewBox="0 0 24 24"><line x1="19" y1="4" x2="10" y2="4"></line><line x1="14" y1="20" x2="5" y2="20"></line><line x1="15" y1="4" x2="9" y2="20"></line></svg>
      </button>

      <!-- 텍스트 정렬 순환 버튼 -->
      <button id="btn-align-cycle" class="btn-icon" onmousedown="event.preventDefault()" onclick="cycleTextAlign()" title="정렬 변경">
        <svg id="icon-align" class="icon-svg" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="15" y2="12"></line><line x1="3" y1="18" x2="18" y2="18"></line></svg>
      </button>

      <!-- 일괄 적용 토글 버튼 -->
      <button id="btn-batch-mode" class="btn-icon" onmousedown="event.preventDefault()" onclick="toggleBatchMode()" title="모든 페이지 일괄 서식 적용">
        <svg class="icon-svg" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
      </button>

      <div class="divider"></div>

      <!-- 💡 스크롤 / 페이지 모드 전환 버튼 복원 -->
      <button id="btn-view-mode" class="btn-icon" onclick="toggleViewMode()" title="스크롤 / 페이지 모드 전환">
        <svg id="icon-view-mode" class="icon-svg" viewBox="0 0 24 24">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
      </button>
    </div>
  </div>

  <div class="toolbar-row">
    <div class="tool-group">
      <button class="btn-icon" onclick="document.getElementById('file-input').click()" title="파일 불러오기 (.txt, .json)">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path></svg>
      </button>
      <input type="file" id="file-input" accept=".txt,.json" onchange="handleFileImport(this.files)">

      <button class="btn-icon" onclick="saveNoteData()" title="저장">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
      </button>

      <button class="btn-icon" onclick="shareNoteContent()" title="텍스트 공유">
        <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
      </button>

      <button class="btn-icon" onclick="printNoteDocument()" title="문서 인쇄">
        <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
      </button>

      <button class="btn-icon" onclick="translateSelectedTextWithGemini()" title="영어 번역 (Gemini AI)">
        <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
      </button>

      <button class="btn-icon" onclick="undo()" title="실행 취소">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
      </button>

      <button class="btn-icon" onclick="redo()" title="다시 실행">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"></path></svg>
      </button>

      <div class="divider"></div>

      <button id="btn-continuous" onclick="toggleContinuousMode()" title="연속 채색">연속</button>
      <div class="color-btn c-white" onmousedown="event.preventDefault()" onclick="selectColor('#ffffff', this)" title="흰색"></div>
      <div class="color-btn c-red selected" onmousedown="event.preventDefault()" onclick="selectColor('#ef4444', this)" title="빨간색"></div>
      <div class="color-btn c-yellow" onmousedown="event.preventDefault()" onclick="selectColor('#ffb703', this)" title="황금 주황"></div>
      <div class="color-btn c-blue" onmousedown="event.preventDefault()" onclick="selectColor('#38bdf8', this)" title="밝은 파랑"></div>
      <div class="color-btn c-green" onmousedown="event.preventDefault()" onclick="selectColor('#4ade80', this)" title="밝은 초록"></div>

      <div class="divider"></div>

      <div class="size-box">
        <button class="btn-size-step" onclick="changeFontSize(-2)">-</button>
        <span id="size-display">26</span>
        <button class="btn-size-step" onclick="changeFontSize(2)">+</button>
      </div>
    </div>

    <div class="tool-group">
      <button class="btn-icon" onclick="previewCurrentViewPage()" title="현재 페이지 미리보기">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
      <button class="btn-icon" onclick="startFullPresentation(0)" title="1페이지부터 프레젠테이션">
        <svg class="icon-svg" viewBox="0 0 24 24" style="fill: currentColor; stroke: none;"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      </button>
    </div>
  </div>
</div>

<!-- 메인 에디터 뷰포트 -->
<div id="main-viewport" class="view-scroll"></div>

<!-- 플로팅 스크롤바 트랙 -->
<div id="floating-scrollbar-track">
  <div id="floating-scrollbar-thumb"></div>
</div>

<!-- 하단 고정 독 -->
<div id="bottom-dock">
  <span id="page-info">1 페이지</span>
  <button onclick="addNewPage()">➕ 새 페이지</button>
</div>

<!-- 전체화면 슬라이드 뷰포트 -->
<div id="reader-container">
  <button id="exit-reader-btn" onclick="exitReaderMode()" title="닫기 (ESC)">✕</button>
  <div class="touch-zone" id="touch-left" onclick="prevSlide()"></div>
  <div class="touch-zone" id="touch-right" onclick="nextSlide()"></div>
  <div id="reader-viewport"></div>
  <div id="reader-page-badge"><span id="reader-curr">1</span> / <span id="reader-total">1</span></div>
</div>

<div id="print-area"></div>
<div id="toast"></div>

<script>
  /* PWA 설정 */
  const manifestData = {
    name: "Yslide Note",
    short_name: "Yslide",
    start_url: "./",
    display: "standalone",
    background_color: "#0a0a0a",
    theme_color: "#181818",
    icons: [{ src: "https://api.iconify.design/fluent-emoji:memo.svg", sizes: "192x192 512x512", type: "image/svg+xml" }]
  };
  const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
  document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);

  if ('serviceWorker' in navigator) {
    const swCode = `
      self.addEventListener('install', e => self.skipWaiting());
      self.addEventListener('activate', e => clients.claim());
      self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
    `;
    const swBlob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
  }

  const PLACEHOLDER_TEXT = "여기를 클릭하여 글을 작성하거나 긴 글을 붙여넣으세요.";
  const FONT_LIST = [
    { name: "기본", family: "-apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', sans-serif" },
    { name: "KoPub 돋움", family: "'KoPubWorld Dotum', sans-serif" },
    { name: "KoPub 바탕", family: "'KoPubWorld Batang', serif" }
  ];

  let currentFontIndex = 0;
  let activeColor = '#ef4444';
  let isContinuousMode = false;
  let isBatchMode = false;
  let isPainting = false;
  let lastPaintedKey = '';
  let currentFontSize = 26;
  let currentReaderIndex = 0;
  let isReaderOpen = false;

  let globalLetterSpacing = 0;
  let globalLineHeight = 1.55;
  let globalIsBold = false;
  let globalIsItalic = false;
  let currentTextAlignIndex = 0;
  const ALIGN_MODES = ['left', 'center', 'right'];
  const ALIGN_NAMES = ['좌측 정렬', '가운데 정렬', '우측 정렬'];

  let viewMode = 'scroll';
  let pagesData = [];
  let undoStack = [];
  let redoStack = [];
  const MAX_HISTORY = 40;
  let isReflowing = false;
  let reflowTimer = null;

  const viewport = document.getElementById('main-viewport');
  const readerViewport = document.getElementById('reader-viewport');
  const btnFontCycle = document.getElementById('btn-font-cycle');
  const btnBatchMode = document.getElementById('btn-batch-mode');
  const btnViewMode = document.getElementById('btn-view-mode');
  const iconViewMode = document.getElementById('icon-view-mode');
  const iconAlign = document.getElementById('icon-align');
  const scrollbarThumb = document.getElementById('floating-scrollbar-thumb');
  const scrollbarTrack = document.getElementById('floating-scrollbar-track');

  let scrollFadeTimer = null;

  /* 스크롤바 제어 */
  function updateFloatingScrollbar() {
    if (!viewport || !scrollbarThumb || !scrollbarTrack || viewMode !== 'scroll') {
      if (scrollbarThumb) scrollbarThumb.classList.remove('visible');
      return;
    }
    const scrollHeight = viewport.scrollHeight;
    const clientHeight = viewport.clientHeight;
    const scrollTop = viewport.scrollTop;

    if (scrollHeight <= clientHeight + 10) {
      scrollbarThumb.classList.remove('visible');
      return;
    }

    const trackHeight = scrollbarTrack.clientHeight;
    const thumbHeight = Math.max(30, (clientHeight / scrollHeight) * trackHeight);
    const maxScrollTop = scrollHeight - clientHeight;
    const maxThumbTop = trackHeight - thumbHeight;
    const thumbTop = (scrollTop / maxScrollTop) * maxThumbTop;

    scrollbarThumb.style.height = `${thumbHeight}px`;
    scrollbarThumb.style.transform = `translateY(${thumbTop}px)`;
    scrollbarThumb.classList.add('visible');

    if (scrollFadeTimer) clearTimeout(scrollFadeTimer);
    scrollFadeTimer = setTimeout(() => {
      scrollbarThumb.classList.remove('visible');
    }, 1200);
  }

  viewport.addEventListener('scroll', updateFloatingScrollbar, { passive: true });

  /* 💡 뷰 모드 전환 (스크롤 <-> 카드 스냅) */
  function toggleViewMode() {
    viewMode = viewMode === 'scroll' ? 'page' : 'scroll';
    localStorage.setItem('yslide_note_view_mode', viewMode);
    applyViewModeUI();
    renderPages();
    showToast(viewMode === 'scroll' ? '📜 세로 스크롤 모드' : '📄 페이지 넘김 모드');
  }

  function applyViewModeUI() {
    viewport.className = viewMode === 'scroll' ? 'view-scroll' : 'view-page';
    if (iconViewMode) {
      if (viewMode === 'scroll') {
        iconViewMode.innerHTML = '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>';
        btnViewMode.title = "현재: 세로 스크롤 모드";
      } else {
        iconViewMode.innerHTML = '<rect x="4" y="2" width="16" height="20" rx="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="8" y1="10" x2="16" y2="10"></line><line x1="8" y1="14" x2="16" y2="14"></line><line x1="8" y1="18" x2="16" y2="18"></line>';
        btnViewMode.title = "현재: 페이지 넘김 모드";
      }
    }
    updateFloatingScrollbar();
  }

  function getDynamicAvailableHeight() {
    const cardH = window.innerHeight * 0.8;
    return Math.max(300, cardH - 42 - 48);
  }

  function getDynamicCardWidth() {
    return Math.min(820, window.innerWidth * 0.92);
  }

  let permanentMeasureBox = null;
  function getMeasureBox() {
    const targetWidth = getDynamicCardWidth() - 72;
    if (!permanentMeasureBox) {
      permanentMeasureBox = document.createElement('div');
      permanentMeasureBox.style.position = 'fixed';
      permanentMeasureBox.style.top = '0';
      permanentMeasureBox.style.left = '0';
      permanentMeasureBox.style.height = 'auto';
      permanentMeasureBox.style.padding = '0';
      permanentMeasureBox.style.boxSizing = 'border-box';
      permanentMeasureBox.style.whiteSpace = 'pre-wrap';
      permanentMeasureBox.style.wordBreak = 'break-word';
      permanentMeasureBox.style.visibility = 'hidden';
      permanentMeasureBox.style.zIndex = '-99999';
      permanentMeasureBox.style.pointerEvents = 'none';
      document.body.appendChild(permanentMeasureBox);
    }
    permanentMeasureBox.style.width = `${targetWidth}px`;
    permanentMeasureBox.style.maxWidth = `${targetWidth}px`;
    permanentMeasureBox.style.fontSize = `${currentFontSize}px`;
    permanentMeasureBox.style.fontFamily = FONT_LIST[currentFontIndex].family;
    permanentMeasureBox.style.letterSpacing = `${globalLetterSpacing}px`;
    permanentMeasureBox.style.lineHeight = `${globalLineHeight}`;
    return permanentMeasureBox;
  }

  function init() {
    try {
      const savedFont = localStorage.getItem('yslide_note_font_idx');
      if (savedFont !== null) {
        currentFontIndex = parseInt(savedFont, 10) % FONT_LIST.length;
      }
      applyCurrentFont();

      const savedMode = localStorage.getItem('yslide_note_view_mode');
      if (savedMode) viewMode = savedMode;
      applyViewModeUI();

      const saved = localStorage.getItem('yslide_note_pages_v53');
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length > 0) {
          pagesData = parsed;
        } else {
          pagesData = [{ title: '', html: PLACEHOLDER_TEXT, isPlaceholder: true, align: 'left' }];
        }
      } else {
        pagesData = [{ title: '', html: PLACEHOLDER_TEXT, isPlaceholder: true, align: 'left' }];
      }
    } catch (e) {
      pagesData = [{ title: '', html: PLACEHOLDER_TEXT, isPlaceholder: true, align: 'left' }];
    }

    pushHistory();
    renderPages();
    updateFontSize();
    setTimeout(updateFloatingScrollbar, 200);
  }

  window.addEventListener('resize', () => {
    if (reflowTimer) clearTimeout(reflowTimer);
    reflowTimer = setTimeout(() => {
      seamlessContinuousReflow();
      updateFloatingScrollbar();
    }, 200);
  });

  function toggleBatchMode() {
    isBatchMode = !isBatchMode;
    if (isBatchMode) {
      btnBatchMode.classList.add('active');
      showToast('🌐 일괄 적용 모드 ON');
    } else {
      btnBatchMode.classList.remove('active');
      showToast('📄 단일 적용 모드 ON');
    }
  }

  function pushHistory() {
    const stateStr = JSON.stringify(pagesData);
    if (undoStack.length === 0 || undoStack[undoStack.length - 1] !== stateStr) {
      undoStack.push(stateStr);
      if (undoStack.length > MAX_HISTORY) undoStack.shift();
      redoStack = [];
    }
  }

  function undo() {
    if (undoStack.length > 1) {
      const currentState = undoStack.pop();
      redoStack.push(currentState);
      pagesData = JSON.parse(undoStack[undoStack.length - 1]);
      renderPages();
      saveToLocalStorageSilent();
      showToast('↶ 되돌리기');
    } else {
      showToast('⚠️ 더 이상 되돌릴 작업이 없습니다');
    }
  }

  function redo() {
    if (redoStack.length > 0) {
      const nextState = redoStack.pop();
      undoStack.push(nextState);
      pagesData = JSON.parse(nextState);
      renderPages();
      saveToLocalStorageSilent();
      showToast('↷ 다시 실행');
    } else {
      showToast('⚠️ 다시 실행할 작업이 없습니다');
    }
  }

  function cycleFontFamily() {
    currentFontIndex = (currentFontIndex + 1) % FONT_LIST.length;
    localStorage.setItem('yslide_note_font_idx', currentFontIndex);
    applyCurrentFont();
    showToast(`글꼴: ${FONT_LIST[currentFontIndex].name}`);
  }

  function applyCurrentFont() {
    const current = FONT_LIST[currentFontIndex];
    document.documentElement.style.setProperty('--active-font', current.family);
    if (btnFontCycle) btnFontCycle.innerText = current.name;
  }

  function cycleTextAlign() {
    pushHistory();
    currentTextAlignIndex = (currentTextAlignIndex + 1) % ALIGN_MODES.length;
    const mode = ALIGN_MODES[currentTextAlignIndex];
    const name = ALIGN_NAMES[currentTextAlignIndex];

    if (mode === 'left') {
      iconAlign.innerHTML = '<line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="15" y2="12"></line><line x1="3" y1="18" x2="18" y2="18"></line>';
    } else if (mode === 'center') {
      iconAlign.innerHTML = '<line x1="3" y1="6" x2="21" y2="6"></line><line x1="6" y1="12" x2="18" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line>';
    } else {
      iconAlign.innerHTML = '<line x1="3" y1="6" x2="21" y2="6"></line><line x1="9" y1="12" x2="21" y2="12"></line><line x1="6" y1="18" x2="21" y2="18"></line>';
    }

    if (isBatchMode) {
      document.querySelectorAll('.page-editor').forEach(ed => { ed.style.textAlign = mode; });
      pagesData.forEach(p => p.align = mode);
      showToast(`전체 ${name}`);
    } else {
      const idx = getCurrentPageIndex();
      const editor = document.querySelectorAll('.page-editor')[idx];
      if (editor) {
        editor.style.textAlign = mode;
        if (pagesData[idx]) pagesData[idx].align = mode;
        showToast(`페이지 ${idx + 1}: ${name}`);
      }
    }
    saveAllPagesState();
  }

  /* 💡 페이지 삭제 기능 (휴지통 버튼) */
  function deletePage(index) {
    if (pagesData.length <= 1) {
      showToast('⚠️ 마지막 남은 페이지는 삭제할 수 없습니다');
      return;
    }
    pushHistory();
    if (index > 0) {
      pagesData[index - 1].html = (pagesData[index - 1].html || '') + (pagesData[index].html || '');
      pagesData.splice(index, 1);
    } else {
      pagesData[1].html = (pagesData[0].html || '') + (pagesData[1].html || '');
      pagesData.splice(0, 1);
    }
    seamlessContinuousReflow();
    showToast('🗑️ 페이지가 삭제되었습니다');
  }

  /* 💡 페이지 렌더링 (헤더, 제목입력, 휴지통 버튼 완벽 복원) */
  function renderPages() {
    if (!viewport) return;
    viewport.innerHTML = '';
    pagesData.forEach((page, index) => {
      const card = document.createElement('div');
      card.className = 'note-page-card';
      card.dataset.index = index;

      const header = document.createElement('div');
      header.className = 'page-header';
      
      const badge = document.createElement('span');
      badge.className = 'page-badge';
      badge.innerText = `[ PAGE ${index + 1} ]`;

      const titleInput = document.createElement('input');
      titleInput.type = 'text';
      titleInput.className = 'page-title-input';
      titleInput.placeholder = '제목을 입력하세요';
      titleInput.value = page.title || '';
      titleInput.addEventListener('input', (e) => {
        pagesData[index].title = e.target.value;
        saveToLocalStorageSilent();
      });

      // 개별 페이지 삭제 버튼
      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'btn-page-delete';
      deleteBtn.title = '이 페이지 삭제';
      deleteBtn.innerHTML = `
        <svg class="icon-svg" viewBox="0 0 24 24" style="width:15px; height:15px;">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      `;
      deleteBtn.onclick = () => deletePage(index);

      header.appendChild(badge);
      header.appendChild(titleInput);
      header.appendChild(deleteBtn);

      const editor = document.createElement('div');
      editor.className = 'page-editor';
      editor.contentEditable = 'true';
      editor.spellcheck = false;
      editor.style.fontSize = `${currentFontSize}px`;
      editor.style.textAlign = page.align || 'left';
      
      if (page.isPlaceholder || (!page.html && page.html !== '')) {
        editor.classList.add('is-placeholder');
        editor.innerHTML = PLACEHOLDER_TEXT;
      } else {
        editor.innerHTML = page.html || '';
      }

      editor.addEventListener('focus', () => {
        if (editor.classList.contains('is-placeholder') || editor.innerHTML.trim() === PLACEHOLDER_TEXT) {
          pushHistory();
          editor.innerHTML = '';
          editor.classList.remove('is-placeholder');
          pagesData[index].isPlaceholder = false;
          pagesData[index].html = '';
          saveToLocalStorageSilent();
        }
      });

      editor.addEventListener('input', () => {
        if (isReflowing) return;
        if (editor.classList.contains('is-placeholder')) {
          editor.classList.remove('is-placeholder');
          pagesData[index].isPlaceholder = false;
        }

        pagesData[index].html = editor.innerHTML;
        saveToLocalStorageSilent();

        const maxHeight = getDynamicAvailableHeight();
        if (editor.scrollHeight > (editor.clientHeight + 2) || editor.offsetHeight > maxHeight) {
          if (reflowTimer) clearTimeout(reflowTimer);
          reflowTimer = setTimeout(() => {
            seamlessContinuousReflow();
          }, 30);
        }
      });

      editor.addEventListener('paste', (e) => {
        e.preventDefault();
        let text = (e.clipboardData || window.clipboardData).getData('text/plain');
        if (editor.classList.contains('is-placeholder')) {
          editor.classList.remove('is-placeholder');
          pagesData[index].isPlaceholder = false;
          pagesData[index].html = '';
        }
        if (text) {
          const formatted = text.replace(/\r\n/g, '<br>').replace(/\n/g, '<br>');
          const curHtml = pagesData[index].html || '';
          pagesData[index].html = curHtml ? `${curHtml}<br>${formatted}` : formatted;
          seamlessContinuousReflow();
        }
      });

      attachContinuousEvents(editor, index);

      card.appendChild(header);
      card.appendChild(editor);

      if (viewMode === 'page') {
        const wrapper = document.createElement('div');
        wrapper.className = 'page-lens-wrapper';
        wrapper.appendChild(card);
        viewport.appendChild(wrapper);
      } else {
        viewport.appendChild(card);
      }
    });

    updatePageInfo();
    updateFloatingScrollbar();
  }

  /* 💡 글자 침범을 원천 차단하는 유기적 스트림 리플로우 엔진 */
  function seamlessContinuousReflow() {
    if (isReflowing) return;
    isReflowing = true;

    saveAllPagesState();

    let fullHtml = pagesData
      .map(p => (p.isPlaceholder ? '' : p.html))
      .filter(h => h && h.trim() !== '')
      .join('<br>');

    if (!fullHtml.trim()) {
      isReflowing = false;
      return;
    }

    const measureBox = getMeasureBox();
    const MAX_PAGE_HEIGHT = getDynamicAvailableHeight();
    const rawParagraphs = fullHtml.split(/<br\s*[\/]?>/gi);

    let newPagesHtml = [];
    let currentPageLines = [];
    measureBox.innerHTML = '';

    for (let i = 0; i < rawParagraphs.length; i++) {
      const p = rawParagraphs[i];
      if (p === '') {
        const testLines = [...currentPageLines, ''];
        measureBox.innerHTML = testLines.map(l => l || '<br>').join('<br>');
        if (measureBox.offsetHeight <= MAX_PAGE_HEIGHT) {
          currentPageLines = testLines;
        } else {
          if (currentPageLines.length > 0) newPagesHtml.push(currentPageLines.join('<br>'));
          currentPageLines = [''];
          measureBox.innerHTML = '<br>';
        }
        continue;
      }

      const testLines = [...currentPageLines, p];
      measureBox.innerHTML = testLines.map(l => l || '<br>').join('<br>');

      if (measureBox.offsetHeight <= MAX_PAGE_HEIGHT) {
        currentPageLines = testLines;
      } else {
        const words = p.split(' ');
        let low = 0;
        let high = words.length;
        let bestFit = 0;

        while (low <= high) {
          const mid = Math.floor((low + high) / 2);
          const chunk = words.slice(0, mid).join(' ');
          const candidate = [...currentPageLines, chunk].map(l => l || '<br>').join('<br>');
          measureBox.innerHTML = candidate;

          if (measureBox.offsetHeight <= MAX_PAGE_HEIGHT) {
            bestFit = mid;
            low = mid + 1;
          } else {
            high = mid - 1;
          }
        }

        if (bestFit > 0) {
          const fitChunk = words.slice(0, bestFit).join(' ');
          currentPageLines.push(fitChunk);
          newPagesHtml.push(currentPageLines.join('<br>'));
          const remainingWords = words.slice(bestFit).join(' ');
          currentPageLines = remainingWords ? [remainingWords] : [];
          measureBox.innerHTML = remainingWords || '';
        } else {
          if (currentPageLines.length > 0) newPagesHtml.push(currentPageLines.join('<br>'));
          currentPageLines = [p];
          measureBox.innerHTML = p;
        }
      }
    }

    if (currentPageLines.length > 0 && currentPageLines.join('<br>').trim() !== '') {
      newPagesHtml.push(currentPageLines.join('<br>'));
    }

    if (newPagesHtml.length === 0) newPagesHtml = [''];

    const oldAligns = pagesData.map(p => p.align || 'left');
    const oldTitles = pagesData.map(p => p.title || '');

    pagesData = newPagesHtml.map((h, idx) => ({
      title: oldTitles[idx] || '',
      html: h,
      isPlaceholder: false,
      align: oldAligns[idx] || 'left'
    }));

    renderPages();
    saveToLocalStorageSilent();
    isReflowing = false;
    updateFloatingScrollbar();
  }

  function getCurrentPageIndex() {
    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0) {
      let node = sel.anchorNode;
      while (node && node !== document.body) {
        if (node.classList && node.classList.contains('note-page-card')) {
          return parseInt(node.dataset.index, 10) || 0;
        }
        node = node.parentNode;
      }
    }
    return 0;
  }

  /* 서식 토글 */
  function toggleBold() {
    pushHistory();
    if (isBatchMode) {
      globalIsBold = !globalIsBold;
      document.querySelectorAll('.page-editor').forEach(ed => {
        ed.style.fontWeight = globalIsBold ? 'bold' : 'normal';
      });
      showToast(globalIsBold ? '전체 볼드체 적용' : '전체 볼드체 해제');
    } else {
      document.execCommand('bold', false, null);
    }
    saveAllPagesState();
  }

  function toggleItalic() {
    pushHistory();
    if (isBatchMode) {
      globalIsItalic = !globalIsItalic;
      document.querySelectorAll('.page-editor').forEach(ed => {
        ed.style.fontStyle = globalIsItalic ? 'italic' : 'normal';
      });
      showToast(globalIsItalic ? '전체 이탤릭체 적용' : '전체 이탤릭체 해제');
    } else {
      document.execCommand('italic', false, null);
    }
    saveAllPagesState();
  }

  function adjustLetterSpacing(delta) {
    pushHistory();
    globalLetterSpacing = parseFloat((globalLetterSpacing + delta).toFixed(1));
    document.querySelectorAll('.page-editor').forEach(ed => {
      ed.style.letterSpacing = `${globalLetterSpacing}px`;
    });
    showToast(`자간: ${globalLetterSpacing}px`);
    saveAllPagesState();
    seamlessContinuousReflow();
  }

  function adjustLineHeight(delta) {
    pushHistory();
    globalLineHeight = parseFloat(Math.max(0.8, globalLineHeight + delta).toFixed(2));
    document.querySelectorAll('.page-editor').forEach(ed => {
      ed.style.lineHeight = `${globalLineHeight}`;
    });
    showToast(`줄간격: ${globalLineHeight}`);
    saveAllPagesState();
    seamlessContinuousReflow();
  }

  function changeFontSize(delta) {
    currentFontSize = Math.min(48, Math.max(16, currentFontSize + delta));
    updateFontSize();
    seamlessContinuousReflow();
  }

  function updateFontSize() {
    document.getElementById('size-display').innerText = currentFontSize;
    document.querySelectorAll('.page-editor').forEach(ed => {
      ed.style.fontSize = `${currentFontSize}px`;
    });
  }

  /* 연속 터치 채색 모드 */
  function attachContinuousEvents(editorEl, pageIdx) {
    function paintAtCoord(clientX, clientY) {
      if (editorEl.classList.contains('is-placeholder')) return;
      let range = document.caretRangeFromPoint ? document.caretRangeFromPoint(clientX, clientY) : null;
      if (!range) return;

      let node = range.startContainer;
      if (node && node.nodeType === Node.TEXT_NODE) {
        const text = node.textContent;
        const offset = range.startOffset;
        let start = Math.min(offset, text.length > 0 ? text.length - 1 : 0);
        while (start > 0 && !/\s/.test(text[start - 1])) start--;
        let end = offset;
        while (end < text.length && !/\s/.test(text[end])) end++;

        if (start < end) {
          const key = `${node.textContent}_${start}_${end}`;
          if (lastPaintedKey === key) return;
          lastPaintedKey = key;

          const wordRange = document.createRange();
          wordRange.setStart(node, start);
          wordRange.setEnd(node, end);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(wordRange);

          document.execCommand('foreColor', false, activeColor);
          sel.removeAllRanges();

          pagesData[pageIdx].html = editorEl.innerHTML;
          saveToLocalStorageSilent();
        }
      }
    }

    editorEl.addEventListener('touchstart', (e) => {
      if (isContinuousMode) {
        pushHistory();
        isPainting = true;
        paintAtCoord(e.touches[0].clientX, e.touches[0].clientY);
        e.preventDefault();
      }
    }, { passive: false });

    editorEl.addEventListener('touchmove', (e) => {
      if (isContinuousMode && isPainting) {
        paintAtCoord(e.touches[0].clientX, e.touches[0].clientY);
        e.preventDefault();
      }
    }, { passive: false });

    editorEl.addEventListener('mousedown', (e) => {
      if (isContinuousMode) {
        pushHistory();
        isPainting = true;
        paintAtCoord(e.clientX, e.clientY);
        e.preventDefault();
      }
    });

    editorEl.addEventListener('mousemove', (e) => {
      if (isContinuousMode && isPainting) {
        paintAtCoord(e.clientX, e.clientY);
        e.preventDefault();
      }
    });
  }

  window.addEventListener('mouseup', () => { isPainting = false; lastPaintedKey = ''; });
  window.addEventListener('touchend', () => { isPainting = false; lastPaintedKey = ''; });

  function selectColor(color, el) {
    activeColor = color;
    document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('selected'));
    if (el) el.classList.add('selected');
    if (!isContinuousMode) {
      document.execCommand('foreColor', false, color);
      saveAllPagesState();
    }
  }

  function toggleContinuousMode() {
    isContinuousMode = !isContinuousMode;
    const btn = document.getElementById('btn-continuous');
    if (isContinuousMode) {
      btn.classList.add('active');
      document.body.classList.add('paint-mode');
      showToast('🎨 연속 채색 모드 ON');
    } else {
      btn.classList.remove('active');
      document.body.classList.remove('paint-mode');
      showToast('⌨️ 일반 텍스트 모드 ON');
    }
  }

  function addNewPage() {
    pushHistory();
    saveAllPagesState();
    pagesData.push({ title: '', html: '', isPlaceholder: false, align: 'left' });
    renderPages();
    pushHistory();

    setTimeout(() => {
      const cards = document.querySelectorAll('.note-page-card');
      const lastCard = cards[cards.length - 1];
      if (lastCard) {
        lastCard.scrollIntoView({ behavior: 'smooth' });
        const ed = lastCard.querySelector('.page-editor');
        if (ed) ed.focus();
      }
    }, 50);

    showToast('📄 새 페이지가 추가되었습니다');
  }

  function updatePageInfo() {
    document.getElementById('page-info').innerText = `${pagesData.length} 페이지`;
  }

  function saveAllPagesState() {
    document.querySelectorAll('.note-page-card').forEach((card, idx) => {
      const editor = card.querySelector('.page-editor');
      const titleInput = card.querySelector('.page-title-input');
      if (editor && pagesData[idx]) {
        if (!editor.classList.contains('is-placeholder')) {
          pagesData[idx].html = editor.innerHTML;
          pagesData[idx].isPlaceholder = false;
        }
        pagesData[idx].align = editor.style.textAlign || 'left';
        if (titleInput) pagesData[idx].title = titleInput.value;
      }
    });
    saveToLocalStorageSilent();
  }

  function saveToLocalStorageSilent() {
    try {
      localStorage.setItem('yslide_note_pages_v53', JSON.stringify(pagesData));
    } catch(e) {}
  }

  function saveNoteData() {
    saveAllPagesState();
    const now = new Date();
    const dateStr = `${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2, '0')}${now.getDate().toString().padStart(2, '0')}`;
    const filename = `Yslide_${dateStr}.json`;
    const blob = new Blob([JSON.stringify(pagesData, null, 2)], { type: "application/json" });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('💾 파일로 저장되었습니다');
  }

  function handleFileImport(files) {
    if (!files || files.length === 0) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const raw = e.target.result;
      pushHistory();
      try {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length > 0) {
          pagesData = parsed;
          renderPages();
          saveToLocalStorageSilent();
          showToast('📂 파일을 불러왔습니다');
          return;
        }
      } catch (err) {}
      pagesData = [{ title: '', html: raw.replace(/\r\n/g, '<br>').replace(/\n/g, '<br>'), isPlaceholder: false, align: 'left' }];
      seamlessContinuousReflow();
    };
    reader.readAsText(files[0]);
  }

  async function shareNoteContent() {
    saveAllPagesState();
    let shareText = pagesData.map((p, idx) => {
      const titleStr = p.title ? `[${p.title}]\n` : '';
      const bodyStr = p.isPlaceholder ? '' : p.html.replace(/<br\s*[\/]?>/gi, '\n').replace(/<[^>]+>/g, '');
      return `[PAGE ${idx + 1}] ${titleStr}${bodyStr}`;
    }).join('\n\n');

    if (!shareText.trim()) return showToast('⚠️ 공유할 내용이 없습니다');

    if (navigator.share) {
      try {
        await navigator.share({ title: 'Yslide 원고', text: shareText });
        showToast('📤 공유 완료');
      } catch (e) {}
    } else {
      navigator.clipboard.writeText(shareText).then(() => {
        showToast('📋 전체 원고가 클립보드에 복사되었습니다');
      });
    }
  }

  function printNoteDocument() {
    saveAllPagesState();
    const printArea = document.getElementById('print-area');
    printArea.innerHTML = '';
    pagesData.forEach((page, idx) => {
      const sheet = document.createElement('div');
      sheet.className = 'print-page-sheet';
      sheet.innerHTML = `
        <div class="print-page-header">
          <span>[ PAGE ${idx + 1} / ${pagesData.length} ]</span>
          <span>${page.title || ''}</span>
        </div>
        <div>${page.isPlaceholder ? '' : (page.html || '')}</div>
      `;
      printArea.appendChild(sheet);
    });
    window.print();
  }

  /* Gemini 번역 */
  async function translateSelectedTextWithGemini() {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed) return showToast('⚠️ 번역할 텍스트를 먼저 드래그하세요');

    const targetRange = sel.getRangeAt(0);
    const tempDiv = document.createElement('div');
    tempDiv.appendChild(targetRange.cloneContents());
    const originalHtml = tempDiv.innerHTML.trim();

    let apiKey = localStorage.getItem('yslide_gemini_api_key');
    if (!apiKey) {
      apiKey = prompt("Google Gemini API 키를 입력하세요:");
      if (!apiKey) return;
      localStorage.setItem('yslide_gemini_api_key', apiKey.trim());
    }

    showToast('🌐 Gemini가 번역 중입니다...');
    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: `Translate HTML text to English naturally, keep tags:\n${originalHtml}` }] }]
        })
      });
      const resData = await response.json();
      let translatedHtml = resData.candidates?.[0]?.content?.parts?.[0]?.text;
      if (translatedHtml) {
        pushHistory();
        translatedHtml = translatedHtml.replace(/^```html\s*/i, '').replace(/\s*```$/i, '').trim();
        targetRange.deleteContents();
        const wrapper = document.createElement('div');
        wrapper.innerHTML = translatedHtml;
        const frag = document.createDocumentFragment();
        let node;
        while ((node = wrapper.firstChild)) frag.appendChild(node);
        targetRange.insertNode(frag);
        seamlessContinuousReflow();
        showToast('✨ 번역 완료');
      }
    } catch (err) {
      showToast('⚠️ 번역 실패');
    }
  }

  function previewCurrentViewPage() {
    const cards = document.querySelectorAll('.note-page-card');
    const viewportCenter = viewport.scrollTop + (viewport.clientHeight / 2);
    let targetIndex = 0;
    cards.forEach((card, idx) => {
      if (card.offsetTop <= viewportCenter) targetIndex = idx;
    });
    startFullPresentation(targetIndex);
  }

  function startFullPresentation(startIndex = 0) {
    saveAllPagesState();
    readerViewport.innerHTML = '';
    pagesData.forEach((page, idx) => {
      const sheet = document.createElement('div');
      sheet.className = `slide-sheet ${idx === startIndex ? 'active' : ''}`;
      sheet.style.fontSize = `${currentFontSize}px`;
      const titleHtml = page.title ? `<div class="slide-title-header">${page.title}</div>` : '';
      sheet.innerHTML = `${titleHtml}${page.isPlaceholder ? '' : (page.html || '')}`;
      readerViewport.appendChild(sheet);
    });

    currentReaderIndex = Math.min(startIndex, pagesData.length - 1);
    document.getElementById('reader-curr').innerText = currentReaderIndex + 1;
    document.getElementById('reader-total').innerText = pagesData.length;
    document.getElementById('reader-container').style.display = 'block';
    isReaderOpen = true;
  }

  function nextSlide() {
    const slides = document.querySelectorAll('.slide-sheet');
    if (currentReaderIndex < slides.length - 1) {
      slides[currentReaderIndex].classList.remove('active');
      currentReaderIndex++;
      slides[currentReaderIndex].classList.add('active');
      document.getElementById('reader-curr').innerText = currentReaderIndex + 1;
    }
  }

  function prevSlide() {
    const slides = document.querySelectorAll('.slide-sheet');
    if (currentReaderIndex > 0) {
      slides[currentReaderIndex].classList.remove('active');
      currentReaderIndex--;
      slides[currentReaderIndex].classList.add('active');
      document.getElementById('reader-curr').innerText = currentReaderIndex + 1;
    }
  }

  function exitReaderMode() {
    document.getElementById('reader-container').style.display = 'none';
    isReaderOpen = false;
  }

  window.addEventListener('keydown', (e) => {
    if (isReaderOpen) {
      if (['ArrowRight', 'ArrowDown', ' ', 'PageDown'].includes(e.key)) {
        e.preventDefault();
        nextSlide();
      } else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'Escape') {
        exitReaderMode();
      }
    }
  });

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1500);
  }

  init();
</script>
