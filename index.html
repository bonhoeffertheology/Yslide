<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yslide Note</title>

<!-- PWA 메타 태그 및 아이콘 설정 -->
<meta name="theme-color" content="#181818">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yslide">

<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">

<!-- KoPubWorld 및 Pretendard CDN 로드 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-kopubworld@1.0.0/kopubworld.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

<style>
:root {
  --bg-main: #0a0a0a;
  --panel-bg: #181818;
  --border-color: #333333;
  --page-bg: #141414;
  --page-border: #444444;
  --text-color: #ffffff;
  --accent: #38bdf8;
  --toolbar-height: 96px;
  --page-width: min(820px, 92vw);
  --page-card-height: 80vh;
  --header-height: 42px;
  --page-gap: 28px;
  --active-font: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
  --ui-font: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  background: var(--bg-main);
  color: var(--text-color);
  font-family: var(--ui-font);
  overflow: hidden;
}

/* 상단 2단 고정 툴바 */
#header-toolbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--toolbar-height);
  background: var(--panel-bg);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 16px;
  z-index: 1000;
  user-select: none;
  gap: 6px;
}

.toolbar-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  height: 40px;
  overflow-x: auto;
  white-space: nowrap;
  gap: 8px;
}
.toolbar-row::-webkit-scrollbar { display: none; }

.toolbar-row-top {
  justify-content: flex-start;
  border-bottom: 1px solid #282828;
  padding-bottom: 4px;
  height: 38px;
  gap: 8px;
}

.tool-group {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

button {
  height: 32px;
  padding: 0 10px;
  background: #262626;
  border: 1px solid #484848;
  border-radius: 6px;
  color: #e5e5e5;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  flex-shrink: 0;
  transition: all 0.15s ease;
  font-family: var(--ui-font);
}
button:hover { background: #333333; }
button:active { transform: scale(0.97); }

.btn-icon { width: 32px; height: 32px; padding: 0; }

.icon-svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  display: block;
}

.divider {
  width: 1px;
  height: 20px;
  background: var(--border-color);
  margin: 0 2px;
  flex-shrink: 0;
}

#btn-continuous.active, #btn-batch-mode.active {
  background: #ea580c !important;
  border-color: #f97316 !important;
  color: #ffffff !important;
  box-shadow: 0 0 10px rgba(234, 88, 12, 0.6);
}

.color-btn {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid #555555;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.15s ease;
}
.color-btn.selected {
  border-color: #ffffff;
  transform: scale(1.2);
  box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
}
.c-white { background-color: #ffffff; }
.c-red { background-color: #ef4444; }
.c-yellow { background-color: #ffb703; }
.c-blue { background-color: #38bdf8; }
.c-green { background-color: #4ade80; }

.btn-font {
  height: 30px;
  padding: 0 10px;
  font-size: 12px;
  font-weight: bold;
  color: #d1d5db;
  background: #262626;
  border: 1px solid #484848;
  border-radius: 6px;
}

.size-box {
  display: inline-flex;
  align-items: center;
  background: #262626;
  border: 1px solid #484848;
  border-radius: 6px;
  padding: 2px 4px;
  gap: 2px;
  height: 32px;
  flex-shrink: 0;
}
.btn-size-step {
  width: 20px;
  height: 20px;
  padding: 0;
  background: transparent;
  border: none;
  color: #cccccc;
  font-size: 14px;
}
#size-display {
  font-size: 13px;
  font-weight: bold;
  min-width: 20px;
  text-align: center;
  color: #38bdf8;
}
#file-input { display: none; }

/* 뷰포트 레이아웃 */
#main-viewport {
  position: fixed;
  top: var(--toolbar-height);
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-main);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  overflow-y: auto;
  overflow-x: hidden;
  display: flex;
  justify-content: center;
  padding: 24px 16px 140px;
}
#main-viewport::-webkit-scrollbar { display: none; }

/* 💡 삼성노트 방식의 통합 아키텍처: 단일 캔버스 컨테이너 */
#document-workspace {
  position: relative;
  width: var(--page-width);
  max-width: 820px;
}

/* 배경 페이지 카드 레이어 */
#page-cards-layer {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  pointer-events: none;
  z-index: 1;
}

.page-sheet-card {
  position: absolute;
  width: 100%;
  background: var(--page-bg);
  border: 2px solid var(--page-border);
  border-radius: 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.95), 0 0 0 1px rgba(255,255,255,0.05);
  box-sizing: border-box;
  pointer-events: auto;
}

.page-header {
  height: var(--header-height);
  background: #1a1a1a;
  border-bottom: 1px solid #333333;
  display: grid;
  grid-template-columns: 110px 1fr 60px;
  align-items: center;
  padding: 0 12px 0 16px;
  font-size: 13px;
  color: #888888;
  box-sizing: border-box;
  user-select: none !important;
}

.page-badge {
  font-weight: bold;
  user-select: none;
  cursor: default;
}

.page-title-input {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: #ffffff;
  font-size: 15px;
  font-weight: 600;
  text-align: center;
  font-family: var(--ui-font);
  padding: 4px 8px;
}
.page-title-input::placeholder { color: #555555; }
.page-title-input:focus { color: #38bdf8; }

.btn-page-delete {
  width: 28px;
  height: 28px;
  background: #262626;
  border: 1px solid #484848;
  border-radius: 6px;
  color: #e5e5e5;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  justify-self: end;
}
.btn-page-delete:hover {
  background: #333333;
  color: #ef4444;
}

/* 💡 단 하나의 연속된 에디터 본체 (커서 튐 / 줄바꿈 / 백스페이스 완벽 보장) */
#single-stream-editor {
  position: relative;
  z-index: 5;
  width: 100%;
  min-height: 100%;
  outline: none;
  color: #ffffff;
  font-size: 26px;
  line-height: 1.55;
  font-family: var(--active-font);
  white-space: pre-wrap;
  word-break: break-word;
  overflow-wrap: anywhere;
  cursor: text;
  caret-color: #ffffff;
  box-sizing: border-box;
}

#single-stream-editor:empty:before {
  content: "여기를 클릭하여 글을 작성하거나 긴 글을 붙여넣으세요.";
  color: #666666;
  pointer-events: none;
}

body.paint-mode #single-stream-editor {
  cursor: crosshair !important;
  user-select: none;
}

/* 10px 플로팅 스크롤바 */
#floating-scrollbar-track {
  position: fixed;
  top: calc(var(--toolbar-height) + 12px);
  bottom: 80px;
  right: 4px;
  width: 18px;
  background: transparent;
  z-index: 2000;
  cursor: pointer;
}

#floating-scrollbar-thumb {
  position: absolute;
  top: 0;
  right: 2px;
  width: 10px;
  min-height: 36px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.6);
  box-shadow: 0 0 8px rgba(0, 0, 0, 0.7), inset 0 0 2px rgba(255, 255, 255, 0.6);
  opacity: 0;
  transition: opacity 0.3s ease, width 0.15s ease, background 0.2s ease;
  touch-action: none;
}
#floating-scrollbar-thumb.visible { opacity: 0.9; }
#floating-scrollbar-thumb:hover, #floating-scrollbar-thumb.active {
  width: 12px;
  background: rgba(255, 255, 255, 0.95);
  box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
}

#bottom-dock {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(26, 26, 26, 0.95);
  border: 1px solid #444444;
  padding: 6px 18px;
  border-radius: 30px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.8);
  z-index: 1000;
  backdrop-filter: blur(8px);
}
#page-info { font-size: 13px; font-weight: bold; color: #d1d5db; }

/* 슬라이드 뷰어 */
#reader-container {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  background: #000000;
  z-index: 5000;
  user-select: none;
  overflow: hidden;
}
#reader-viewport {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}
.slide-sheet {
  width: var(--page-width);
  max-width: 820px;
  height: var(--page-card-height);
  min-height: 480px;
  background: var(--page-bg);
  border: 1px solid #383838;
  border-radius: 8px;
  padding: 28px 40px;
  color: #ffffff;
  font-size: 26px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
  overflow: hidden;
  display: none;
  box-sizing: border-box;
  font-family: var(--active-font);
}
.slide-sheet.active { display: block; }
.slide-title-header {
  font-size: 20px;
  font-weight: bold;
  color: #38bdf8;
  text-align: center;
  margin-bottom: 20px;
  padding-bottom: 8px;
  border-bottom: 1px solid #333333;
}
.touch-zone {
  position: absolute;
  top: 0; bottom: 0; width: 50%;
  cursor: pointer;
  z-index: 5500;
  -webkit-tap-highlight-color: transparent;
}
#touch-left { left: 0; }
#touch-right { right: 0; }
#exit-reader-btn {
  position: absolute;
  top: 18px; right: 24px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: rgba(40, 40, 40, 0.85);
  border: 1px solid #666666;
  color: #ffffff;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  z-index: 6000;
}
#reader-page-badge {
  position: absolute;
  top: 22px; left: 24px;
  background: rgba(30, 30, 30, 0.85);
  border: 1px solid #444444;
  padding: 6px 14px;
  border-radius: 12px;
  color: #ffb703;
  font-size: 14px;
  font-weight: bold;
  z-index: 6000;
}

#print-area { display: none; }
@media print {
  @page { margin: 15mm; size: auto; }
  html, body {
    position: static !important;
    overflow: visible !important;
    background: #ffffff !important;
    color: #000000 !important;
    height: auto !important;
  }
  #header-toolbar, #main-viewport, #bottom-dock, #reader-container, #toast, #floating-scrollbar-track {
    display: none !important;
  }
  #print-area { display: block !important; width: 100% !important; background: #ffffff !important; }
  .print-page-sheet {
    page-break-after: always !important;
    break-after: page !important;
    padding: 10px 0 20px;
    color: #000000 !important;
    font-size: 18pt !important;
    line-height: 1.6 !important;
    white-space: pre-wrap !important;
    word-break: break-word !important;
    font-family: var(--active-font);
  }
  .print-page-sheet:last-child { page-break-after: avoid !important; break-after: avoid !important; }
  .print-page-header {
    font-size: 12pt;
    font-weight: bold;
    color: #444444;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #dddddd;
    margin-bottom: 15px;
    padding-bottom: 4px;
  }
}

#toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(30, 30, 30, 0.95);
  border: 1px solid #555555;
  color: #38bdf8;
  padding: 8px 18px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: bold;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 9000;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 페이지 카드 레이어가 키보드 입력의 스크롤 앵커가 되지 않도록 한다. */
#page-cards-layer {
  overflow-anchor: none;
}
#single-stream-editor {
  overflow-anchor: auto;
}

</style>
</head>
<body>

<!-- 상단 2단 툴바 -->
<div id="header-toolbar">
  <div class="toolbar-row toolbar-row-top">
    <div class="tool-group">
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLetterSpacing(-0.5)" title="자간 좁게">
        <svg class="icon-svg" viewBox="0 0 24 24"><line x1="4" y1="12" x2="10" y2="12"></line><polyline points="7 9 10 12 7 15"></polyline><line x1="20" y1="12" x2="14" y2="12"></line><polyline points="17 9 14 12 17 15"></polyline></svg>
      </button>
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLetterSpacing(0.5)" title="자간 넓게">
        <svg class="icon-svg" viewBox="0 0 24 24"><line x1="10" y1="12" x2="4" y2="12"></line><polyline points="7 9 4 12 7 15"></polyline><line x1="14" y1="12" x2="20" y2="12"></line><polyline points="17 9 20 12 17 15"></polyline></svg>
      </button>

      <div class="divider"></div>

      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLineHeight(-0.1)" title="줄간격 좁게">
        <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="9 6 12 9 15 6"></polyline><line x1="12" y1="2" x2="12" y2="9"></line><polyline points="9 18 12 15 15 18"></polyline><line x1="12" y1="22" x2="12" y2="15"></line></svg>
      </button>
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLineHeight(0.1)" title="줄간격 넓게">
        <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="8 6 12 2 16 6"></polyline><line x1="12" y1="2" x2="12" y2="10"></line><polyline points="8 18 12 22 16 18"></polyline><line x1="12" y1="22" x2="12" y2="14"></line></svg>
      </button>

      <div class="divider"></div>

      <button id="btn-font-cycle" class="btn-font" onclick="cycleFontFamily()" title="글꼴 변경">기본</button>

      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="toggleBold()" title="볼드체">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path></svg>
      </button>

      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="toggleItalic()" title="이탤릭체">
        <svg class="icon-svg" viewBox="0 0 24 24"><line x1="19" y1="4" x2="10" y2="4"></line><line x1="14" y1="20" x2="5" y2="20"></line><line x1="15" y1="4" x2="9" y2="20"></line></svg>
      </button>

      <button id="btn-align-cycle" class="btn-icon" onmousedown="event.preventDefault()" onclick="cycleTextAlign()" title="정렬 변경">
        <svg id="icon-align" class="icon-svg" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="15" y2="12"></line><line x1="3" y1="18" x2="18" y2="18"></line></svg>
      </button>

      <button id="btn-batch-mode" class="btn-icon" onmousedown="event.preventDefault()" onclick="toggleBatchMode()" title="모든 페이지 일괄 서식 적용 모드">
        <svg class="icon-svg" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
      </button>

      <div class="divider"></div>

      <button id="btn-view-mode" class="btn-icon" onclick="toggleViewMode()" title="스크롤 / 페이지 모드 전환">
        <svg id="icon-view-mode" class="icon-svg" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
      </button>

      <div class="divider"></div>

      <!-- 앱 설치 버튼 -->
      <button id="btn-install-app" class="btn-icon" onclick="promptInstallApp()" style="display:none; background:#0284c7; border-color:#38bdf8;" title="앱 설치">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      </button>
    </div>
  </div>

  <div class="toolbar-row">
    <div class="tool-group">
      <button class="btn-icon" onclick="document.getElementById('file-input').click()" title="파일 불러오기 (.txt, .json)">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path></svg>
      </button>
      <input type="file" id="file-input" accept=".txt,.json" onchange="handleFileImport(this.files)">

      <button class="btn-icon" onclick="saveNoteData()" title="저장">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
      </button>

      <button class="btn-icon" onclick="shareNoteContent()" title="텍스트 공유">
        <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
      </button>

      <button class="btn-icon" onclick="printNoteDocument()" title="문서 인쇄">
        <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
      </button>

      <button class="btn-icon" onclick="translateSelectedTextWithGemini()" title="영어 번역 (Gemini AI)">
        <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
      </button>

      <button class="btn-icon" onclick="undo()" title="실행 취소 / 되돌리기">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
      </button>

      <button class="btn-icon" onclick="redo()" title="다시 실행">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"></path></svg>
      </button>

      <div class="divider"></div>

      <button id="btn-continuous" onclick="toggleContinuousMode()" title="연속 채색">연속</button>
      <div class="color-btn c-white" onmousedown="event.preventDefault()" onclick="selectColor('#ffffff', this)" title="흰색"></div>
      <div class="color-btn c-red selected" onmousedown="event.preventDefault()" onclick="selectColor('#ef4444', this)" title="빨간색"></div>
      <div class="color-btn c-yellow" onmousedown="event.preventDefault()" onclick="selectColor('#ffb703', this)" title="황금 주황"></div>
      <div class="color-btn c-blue" onmousedown="event.preventDefault()" onclick="selectColor('#38bdf8', this)" title="밝은 파랑"></div>
      <div class="color-btn c-green" onmousedown="event.preventDefault()" onclick="selectColor('#4ade80', this)" title="밝은 초록"></div>

      <div class="divider"></div>

      <div class="size-box">
        <button class="btn-size-step" onclick="changeFontSize(-2)">-</button>
        <span id="size-display">26</span>
        <button class="btn-size-step" onclick="changeFontSize(2)">+</button>
      </div>
    </div>

    <div class="tool-group">
      <button class="btn-icon" onclick="previewCurrentViewPage()" title="현재 화면 페이지 미리보기">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
      <button class="btn-icon" onclick="startFullPresentation(0)" title="1페이지부터 전체보기">
        <svg class="icon-svg" viewBox="0 0 24 24" style="fill: currentColor; stroke: none;"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      </button>
    </div>
  </div>
</div>

<!-- 메인 에디터 뷰포트 -->
<div id="main-viewport">
  <div id="document-workspace">
    <!-- 배경 페이지 카드 레이어 (자동 증감) -->
    <div id="page-cards-layer"></div>

    <!-- 💡 단 하나의 끊김 없는 에디터 본체 (커서 튐 / 줄바꿈 증폭 완전 해결) -->
    <div id="single-stream-editor" contenteditable="true" spellcheck="false"></div>
  </div>
</div>

<!-- 10px 플로팅 스크롤바 -->
<div id="floating-scrollbar-track">
  <div id="floating-scrollbar-thumb"></div>
</div>

<!-- 하단 고정 독 -->
<div id="bottom-dock">
  <span id="page-info">1 페이지</span>
  <button onclick="addNewPageBreak()">➕ 새 페이지</button>
</div>

<!-- 전체화면 슬라이드 뷰포트 -->
<div id="reader-container">
  <button id="exit-reader-btn" onclick="exitReaderMode()" title="닫기 (ESC)">✕</button>
  <div class="touch-zone" id="touch-left" onclick="prevSlide()"></div>
  <div class="touch-zone" id="touch-right" onclick="nextSlide()"></div>
  <div id="reader-viewport"></div>
  <div id="reader-page-badge"><span id="reader-curr">1</span> / <span id="reader-total">1</span></div>
</div>

<div id="print-area"></div>
<div id="toast"></div>

<script>
const FONT_LIST = [
  { name: '기본', family: "-apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', sans-serif" },
  { name: 'KoPub 돋움', family: "'KoPubWorld Dotum', sans-serif" },
  { name: 'KoPub 바탕', family: "'KoPubWorld Batang', serif" }
];
const ALIGN_MODES = ['left', 'center', 'right'];
const ALIGN_NAMES = ['좌측 정렬', '가운데 정렬', '우측 정렬'];

let currentFontIndex = 0, activeColor = '#ef4444', isContinuousMode = false, isBatchMode = false, isPainting = false, lastPaintedKey = '';
let currentFontSize = 26, globalLetterSpacing = 0, globalLineHeight = 1.55, globalIsBold = false, globalIsItalic = false, currentTextAlignIndex = 0;
let viewMode = 'scroll', pageTitles = [], undoStack = [], redoStack = [], MAX_HISTORY = 40;

const viewport = document.getElementById('main-viewport');
const workspace = document.getElementById('document-workspace');
const cardsLayer = document.getElementById('page-cards-layer');
const editor = document.getElementById('single-stream-editor');
const readerViewport = document.getElementById('reader-viewport');
const btnFontCycle = document.getElementById('btn-font-cycle'), btnBatchMode = document.getElementById('btn-batch-mode');
const iconAlign = document.getElementById('icon-align');
const scrollbarThumb = document.getElementById('floating-scrollbar-thumb'), scrollbarTrack = document.getElementById('floating-scrollbar-track');

/* PWA 서비스 워커 등록 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById('btn-install-app');
  if (btn) btn.style.display = 'inline-flex';
});

function promptInstallApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(() => {
      deferredPrompt = null;
      const btn = document.getElementById('btn-install-app');
      if (btn) btn.style.display = 'none';
    });
  } else {
    showToast('💡 브라우저 메뉴의 [홈 화면에 추가] 또는 [설치]를 눌러주세요');
  }
}

function getCardHeight() {
  return Math.max(460, window.innerHeight * 0.8);
}

function getContentHeight() {
  return getCardHeight() - 42 - 48; // 카드 높이 - 헤더(42) - 상하 패딩(48)
}

/* 💡 에디터 높이에 맞춰 시각적 배경 카드를 완벽 동기화하는 레이아웃 엔진 */
function syncLayout() {
  const cardHeight = getCardHeight();
  const contentHeight = getContentHeight();
  const pageGap = 28;

  // 전체 본문 높이 기준 페이지 수 계산
  const currentHeight = editor.offsetHeight;
  const pageCount = Math.max(1, Math.ceil(currentHeight / contentHeight));

  while (pageTitles.length < pageCount) pageTitles.push('');
  if (pageTitles.length > pageCount) pageTitles = pageTitles.slice(0, pageCount);

  cardsLayer.innerHTML = '';
  for (let i = 0; i < pageCount; i++) {
    const card = document.createElement('div');
    card.className = 'page-sheet-card';
    card.style.height = `${cardHeight}px`;
    card.style.top = `${i * (cardHeight + pageGap)}px`;

    const header = document.createElement('div');
    header.className = 'page-header';

    const badge = document.createElement('span');
    badge.className = 'page-badge';
    badge.textContent = `[ PAGE ${i + 1} ]`;

    const title = document.createElement('input');
    title.className = 'page-title-input';
    title.type = 'text';
    title.placeholder = '제목을 입력하세요';
    title.value = pageTitles[i] || '';
    title.addEventListener('input', e => {
      pageTitles[i] = e.target.value;
      saveModel();
    });

    const del = document.createElement('button');
    del.className = 'btn-page-delete';
    del.title = '이 페이지 삭제';
    del.innerHTML = `
      <svg class="icon-svg" viewBox="0 0 24 24" style="width:15px;height:15px">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      </svg>
    `;
    del.onclick = (e) => {
      e.stopPropagation();
      deletePageAt(i);
    };

    header.append(badge, title, del);
    card.appendChild(header);
    cardsLayer.appendChild(card);
  }

  // 에디터 패딩 및 전체 워크스페이스 높이 일치화
  editor.style.paddingTop = '66px'; // 헤더(42) + 본문 상단 여백(24)
  editor.style.paddingBottom = '32px';
  editor.style.paddingLeft = '36px';
  editor.style.paddingRight = '36px';

  const totalWorkspaceHeight = pageCount * cardHeight + (pageCount - 1) * pageGap;
  // The editor is the real document. The workspace only provides enough room
  // for the visual page cards; never resize the editor itself here.
  workspace.style.minHeight = `${Math.max(totalWorkspaceHeight, editor.scrollHeight)}px`;

  document.getElementById('page-info').textContent = `${pageCount} 페이지`;
  updateFloatingScrollbar();
}

/* =========================================================
   단일 연속 문서 입력 엔진
   ---------------------------------------------------------
   핵심 원칙:
   1) #single-stream-editor만 contenteditable이다.
   2) Enter / Backspace / Delete 때 editor.innerHTML을 건드리지 않는다.
   3) 키 입력 직후에는 브라우저의 native editing을 그대로 끝내게 한다.
   4) 페이지 카드는 requestAnimationFrame 한 번으로만 재배치한다.
   5) 페이지 경계에는 실제 DOM 경계가 없으므로 Backspace/Delete가
      페이지를 넘어갈 때 별도 병합 코드를 실행하지 않는다.
   ========================================================= */

let layoutFrame = 0;
let layoutAfterInput = false;

function scheduleVisualLayout() {
  if (layoutFrame) return;
  layoutFrame = requestAnimationFrame(() => {
    layoutFrame = 0;
    syncLayout();
    updateFloatingScrollbar();
  });
}

function captureScrollState() {
  return {
    top: viewport.scrollTop,
    left: viewport.scrollLeft
  };
}

function restoreScrollState(state) {
  if (!state) return;
  // 브라우저의 native scroll anchoring을 방해하지 않도록 같은 frame 안에서
  // 미세한 차이만 보정한다.
  if (Math.abs(viewport.scrollTop - state.top) > 2) {
    viewport.scrollTop = state.top;
  }
  if (Math.abs(viewport.scrollLeft - state.left) > 2) {
    viewport.scrollLeft = state.left;
  }
}

/* 입력 후에는 저장만 하고, 시각적 페이지 카드만 다음 animation frame에서
   한 번 갱신한다. editor 자체의 DOM/selection/caret에는 손대지 않는다. */
editor.addEventListener('input', () => {
  saveModel();
  layoutAfterInput = true;
  scheduleVisualLayout();
});

/* Enter, Backspace, Delete에는 별도 조작을 하지 않는다.
   이것이 페이지 경계에서 커서가 튀는 것을 막는 핵심이다. */
editor.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === 'Backspace' || e.key === 'Delete') {
    // native editing 그대로 통과
    return;
  }
});

/* 붙여넣기도 editor의 native selection을 유지한 채 한 번만 삽입한다. */
editor.addEventListener('paste', (e) => {
  e.preventDefault();

  const text = (e.clipboardData || window.clipboardData).getData('text/plain');
  if (!text) return;

  pushHistory();

  const formatted = text
    .replace(/\r\n/g, '<br>')
    .replace(/\r/g, '<br>')
    .replace(/\n/g, '<br>');

  document.execCommand('insertHTML', false, formatted);

  saveModel();
  scheduleVisualLayout();
  showToast('📋 붙여넣기가 완료되었습니다');
});

function deletePageAt(pageIdx) {
  if (pageTitles.length <= 1) {
    showToast('⚠️ 마지막 남은 페이지는 삭제할 수 없습니다');
    return;
  }
  pushHistory();
  const contentHeight = getContentHeight();
  const startLineRatio = pageIdx / pageTitles.length;
  const endLineRatio = (pageIdx + 1) / pageTitles.length;

  const lines = editor.innerHTML.split(/<br\s*[\/]?>/gi);
  const startIdx = Math.floor(lines.length * startLineRatio);
  const endIdx = Math.floor(lines.length * endLineRatio);

  lines.splice(startIdx, Math.max(1, endIdx - startIdx));
  editor.innerHTML = lines.join('<br>');
  pageTitles.splice(pageIdx, 1);

  saveModel();
  syncLayout();
  showToast('🗑️ 페이지가 삭제되었습니다');
}

function addNewPageBreak() {
  pushHistory();
  editor.focus();
  const sel = window.getSelection();
  const range = document.createRange();
  range.selectNodeContents(editor);
  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);

  document.execCommand('insertHTML', false, '<br><br><br>');
  saveModel();
  syncLayout();
  showToast('📄 새 페이지 영역이 추가되었습니다');
}

/* 서식 및 툴바 상태 제어 */
let formatSelectionRange = null;

function rememberFormatSelection() {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return;
  const r = sel.getRangeAt(0);
  if (editor.contains(r.commonAncestorContainer) && !r.collapsed) {
    formatSelectionRange = r.cloneRange();
  }
}

function restoreFormatSelection() {
  if (!formatSelectionRange) return false;
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(formatSelectionRange.cloneRange());
  return true;
}

function applyFormatCommand(cmd, val = null) {
  restoreFormatSelection();
  document.execCommand(cmd, false, val);
  saveModel();
  syncLayout();
}

document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return;
  const r = sel.getRangeAt(0);
  if (editor.contains(r.commonAncestorContainer) && !r.collapsed) {
    formatSelectionRange = r.cloneRange();
  }
});

function toggleBold() {
  pushHistory();
  if (formatSelectionRange && !formatSelectionRange.collapsed) {
    applyFormatCommand('bold');
  } else {
    globalIsBold = !globalIsBold;
    editor.style.fontWeight = globalIsBold ? 'bold' : 'normal';
    showToast(globalIsBold ? '전체 볼드체 적용' : '전체 볼드체 해제');
    saveModel();
  }
}

function toggleItalic() {
  pushHistory();
  if (formatSelectionRange && !formatSelectionRange.collapsed) {
    applyFormatCommand('italic');
  } else {
    globalIsItalic = !globalIsItalic;
    editor.style.fontStyle = globalIsItalic ? 'italic' : 'normal';
    showToast(globalIsItalic ? '전체 이탤릭체 적용' : '전체 이탤릭체 해제');
    saveModel();
  }
}

function adjustLetterSpacing(delta) {
  pushHistory();
  globalLetterSpacing = parseFloat((globalLetterSpacing + delta).toFixed(1));
  editor.style.letterSpacing = `${globalLetterSpacing}px`;
  showToast(`자간: ${globalLetterSpacing}px`);
  saveModel();
  syncLayout();
}

function adjustLineHeight(delta) {
  pushHistory();
  globalLineHeight = parseFloat(Math.max(0.8, globalLineHeight + delta).toFixed(2));
  editor.style.lineHeight = `${globalLineHeight}`;
  showToast(`줄간격: ${globalLineHeight}`);
  saveModel();
  syncLayout();
}

function cycleFontFamily() {
  currentFontIndex = (currentFontIndex + 1) % FONT_LIST.length;
  localStorage.setItem('yslide_note_font_idx', currentFontIndex);
  document.documentElement.style.setProperty('--active-font', FONT_LIST[currentFontIndex].family);
  btnFontCycle.innerText = FONT_LIST[currentFontIndex].name;
  editor.style.fontFamily = FONT_LIST[currentFontIndex].family;
  showToast(`글꼴: ${FONT_LIST[currentFontIndex].name}`);
  syncLayout();
}

function cycleTextAlign() {
  currentTextAlignIndex = (currentTextAlignIndex + 1) % ALIGN_MODES.length;
  const mode = ALIGN_MODES[currentTextAlignIndex];

  if (mode === 'left') {
    iconAlign.innerHTML = '<line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="15" y2="12"></line><line x1="3" y1="18" x2="18" y2="18"></line>';
  } else if (mode === 'center') {
    iconAlign.innerHTML = '<line x1="3" y1="6" x2="21" y2="6"></line><line x1="6" y1="12" x2="18" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line>';
  } else {
    iconAlign.innerHTML = '<line x1="3" y1="6" x2="21" y2="6"></line><line x1="9" y1="12" x2="21" y2="12"></line><line x1="6" y1="18" x2="21" y2="18"></line>';
  }

  const sel = window.getSelection();
  const hasSelection = sel && sel.rangeCount && !sel.isCollapsed &&
                       editor.contains(sel.getRangeAt(0).commonAncestorContainer);

  if (hasSelection) {
    pushHistory();

    // Restore the live selection immediately before execCommand. Do not call
    // syncLayout here: it can move the visual scroll position while the user
    // is still holding the selection.
    const range = sel.getRangeAt(0).cloneRange();
    document.execCommand(
      mode === 'left' ? 'justifyLeft' :
      mode === 'center' ? 'justifyCenter' : 'justifyRight',
      false,
      null
    );

    // Selection is restored by the browser in most engines; explicitly restore
    // the exact range when possible.
    try {
      sel.removeAllRanges();
      sel.addRange(range);
    } catch (_) {}

    saveModel();
    scheduleVisualLayout();
    showToast(`${ALIGN_NAMES[currentTextAlignIndex]} 적용`);
    return;
  }

  // No selection: preserve the existing page/document behavior.
  pushHistory();
  editor.style.textAlign = mode;
  saveModel();
  scheduleVisualLayout();
  showToast(`${ALIGN_NAMES[currentTextAlignIndex]} 적용`);
}
function changeFontSize(delta) {
  currentFontSize = Math.min(48, Math.max(16, currentFontSize + delta));
  document.getElementById('size-display').innerText = currentFontSize;
  editor.style.fontSize = `${currentFontSize}px`;
  syncLayout();
}

function selectColor(color, el) {
  activeColor = color;
  document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
  el?.classList.add('selected');

  if (formatSelectionRange && !formatSelectionRange.collapsed && !isContinuousMode) {
    pushHistory();
    applyFormatCommand('foreColor', color);
  }
}

/* 연속 터치 채색 기능 */
editor.addEventListener('touchstart', e => {
  if (isContinuousMode) {
    pushHistory();
    isPainting = true;
    paintAt(e.touches[0].clientX, e.touches[0].clientY);
    e.preventDefault();
  }
}, { passive: false });

editor.addEventListener('touchmove', e => {
  if (isContinuousMode && isPainting) {
    paintAt(e.touches[0].clientX, e.touches[0].clientY);
    e.preventDefault();
  }
}, { passive: false });

editor.addEventListener('mousedown', e => {
  if (isContinuousMode) {
    pushHistory();
    isPainting = true;
    paintAt(e.clientX, e.clientY);
    e.preventDefault();
  }
});

editor.addEventListener('mousemove', e => {
  if (isContinuousMode && isPainting) {
    paintAt(e.clientX, e.clientY);
  }
});

window.addEventListener('mouseup', () => { isPainting = false; lastPaintedKey = ''; });
window.addEventListener('touchend', () => { isPainting = false; lastPaintedKey = ''; });

function paintAt(x, y) {
  let r = document.caretRangeFromPoint ? document.caretRangeFromPoint(x, y) : null;
  if (!r) return;
  let n = r.startContainer;
  if (n.nodeType !== Node.TEXT_NODE && n.childNodes.length > 0) {
    n = n.childNodes[r.startOffset] || n.firstChild;
    while (n && n.nodeType !== Node.TEXT_NODE && n.firstChild) n = n.firstChild;
  }
  if (n && n.nodeType === Node.TEXT_NODE) {
    const txt = n.textContent;
    const off = r.startOffset;
    let a = Math.min(off, txt.length > 0 ? txt.length - 1 : 0);
    while (a > 0 && !/\s/.test(txt[a - 1])) a--;
    let b = off;
    while (b < txt.length && !/\s/.test(txt[b])) b++;
    if (a < b) {
      const key = `${n.textContent}_${a}_${b}`;
      if (key === lastPaintedKey) return;
      lastPaintedKey = key;
      const wr = document.createRange();
      wr.setStart(n, a);
      wr.setEnd(n, b);
      const s = window.getSelection();
      s.removeAllRanges();
      s.addRange(wr);
      document.execCommand('foreColor', false, activeColor);
      s.removeAllRanges();
      saveModel();
    }
  }
}

function toggleContinuousMode() {
  isContinuousMode = !isContinuousMode;
  document.getElementById('btn-continuous').classList.toggle('active', isContinuousMode);
  document.body.classList.toggle('paint-mode', isContinuousMode);
  showToast(isContinuousMode ? '🎨 연속 채색 모드 ON' : '⌨️ 일반 텍스트 모드 ON');
}

function toggleBatchMode() {
  isBatchMode = !isBatchMode;
  btnBatchMode.classList.toggle('active', isBatchMode);
  showToast(isBatchMode ? '🌐 일괄 적용 모드 ON' : '📄 단일 적용 모드 ON');
}

function toggleViewMode() {
  viewMode = viewMode === 'scroll' ? 'page' : 'scroll';
  showToast(viewMode === 'scroll' ? '📜 세로 스크롤 모드' : '📄 페이지 모드');
}

/* 10px 플로팅 스크롤바 */
function updateFloatingScrollbar() {
  if (!scrollbarThumb) return;
  const sh = viewport.scrollHeight, ch = viewport.clientHeight;
  if (sh <= ch + 10) {
    scrollbarThumb.classList.remove('visible');
    return;
  }
  const th = Math.max(36, (ch / sh) * scrollbarTrack.clientHeight);
  const max = sh - ch;
  const top = (viewport.scrollTop / max) * (scrollbarTrack.clientHeight - th);
  scrollbarThumb.style.height = `${th}px`;
  scrollbarThumb.style.transform = `translateY(${top}px)`;
  scrollbarThumb.classList.add('visible');

  clearTimeout(window._sf);
  window._sf = setTimeout(() => {
    if (!isDrag) scrollbarThumb.classList.remove('visible');
  }, 1400);
}

viewport.addEventListener('scroll', updateFloatingScrollbar, { passive: true });

let isDrag = false, startY = 0, startScroll = 0;
scrollbarThumb.addEventListener('mousedown', e => {
  isDrag = true;
  startY = e.clientY;
  startScroll = viewport.scrollTop;
  scrollbarThumb.classList.add('active', 'visible');
  document.body.style.userSelect = 'none';
  e.preventDefault();
});
window.addEventListener('mousemove', e => {
  if (!isDrag) return;
  const trackH = scrollbarTrack.clientHeight - scrollbarThumb.clientHeight;
  const scrollH = viewport.scrollHeight - viewport.clientHeight;
  if (trackH > 0) {
    viewport.scrollTop = startScroll + ((e.clientY - startY) / trackH) * scrollH;
  }
});
window.addEventListener('mouseup', () => {
  if (isDrag) {
    isDrag = false;
    scrollbarThumb.classList.remove('active');
    document.body.style.userSelect = '';
  }
});

/* 데이터 저장 및 관리 */
function saveModel() {
  try {
    localStorage.setItem('yslide_note_v70', JSON.stringify({
      html: editor.innerHTML,
      titles: pageTitles
    }));
  } catch (e) {}
}

function pushHistory() {
  const st = JSON.stringify({ html: editor.innerHTML, titles: pageTitles });
  if (!undoStack.length || undoStack[undoStack.length - 1] !== st) {
    undoStack.push(st);
    if (undoStack.length > MAX_HISTORY) undoStack.shift();
    redoStack = [];
  }
}

function undo() {
  if (undoStack.length <= 1) {
    showToast('⚠️ 더 이상 되돌릴 작업이 없습니다');
    return;
  }
  const cur = undoStack.pop();
  redoStack.push(cur);
  const prev = JSON.parse(undoStack[undoStack.length - 1]);
  editor.innerHTML = prev.html || '';
  pageTitles = prev.titles || [];
  syncLayout();
  saveModel();
  showToast('↶ 되돌리기');
}

function redo() {
  if (!redoStack.length) {
    showToast('⚠️ 다시 실행할 작업이 없습니다');
    return;
  }
  const n = redoStack.pop();
  undoStack.push(n);
  const next = JSON.parse(n);
  editor.innerHTML = next.html || '';
  pageTitles = next.titles || [];
  syncLayout();
  saveModel();
  showToast('↷ 다시 실행');
}

function saveNoteData() {
  saveModel();
  const now = new Date();
  const ds = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}_${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}`;
  const blob = new Blob([JSON.stringify({ html: editor.innerHTML, titles: pageTitles }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Yslide_${ds}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  showToast('💾 파일로 저장되었습니다');
}

function handleFileImport(files) {
  if (!files?.length) return;
  const reader = new FileReader();
  reader.onload = e => {
    pushHistory();
    try {
      const x = JSON.parse(e.target.result);
      if (x.html) {
        editor.innerHTML = x.html;
        pageTitles = x.titles || [];
      } else if (Array.isArray(x)) {
        editor.innerHTML = x.map(p => p.html || '').join('<br><br>');
        pageTitles = x.map(p => p.title || '');
      }
    } catch {
      editor.innerHTML = String(e.target.result).replace(/\r\n/g, '<br>').replace(/\n/g, '<br>');
      pageTitles = [];
    }
    syncLayout();
    saveModel();
    showToast('📂 파일을 성공적으로 불러왔습니다');
  };
  reader.readAsText(files[0]);
}

async function shareNoteContent() {
  const text = editor.innerText.trim();
  if (!text) return showToast('⚠️ 공유할 내용이 없습니다');
  if (navigator.share) {
    try {
      await navigator.share({ title: 'Yslide 원고 공유', text });
      showToast('📤 공유 완료');
    } catch (e) {}
  } else {
    navigator.clipboard?.writeText(text).then(() => showToast('📋 클립보드에 복사되었습니다'));
  }
}

function printNoteDocument() {
  saveModel();
  const printArea = document.getElementById('print-area');
  printArea.innerHTML = '';
  const lines = editor.innerHTML.split(/<br\s*[\/]?>/gi);
  const chunkSize = Math.max(10, Math.ceil(lines.length / Math.max(1, pageTitles.length)));

  for (let i = 0; i < pageTitles.length; i++) {
    const chunk = lines.slice(i * chunkSize, (i + 1) * chunkSize).join('<br>');
    const sheet = document.createElement('div');
    sheet.className = 'print-page-sheet';
    sheet.innerHTML = `
      <div class="print-page-header">
        <span>[ PAGE ${i + 1} / ${pageTitles.length} ]</span>
        <span>${pageTitles[i] || ''}</span>
      </div>
      <div>${chunk}</div>
    `;
    printArea.appendChild(sheet);
  }
  window.print();
}

async function translateSelectedTextWithGemini() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) return showToast('⚠️ 번역할 문장을 먼저 드래그하세요');

  const range = sel.getRangeAt(0);
  const temp = document.createElement('div');
  temp.appendChild(range.cloneContents());
  const originalHtml = temp.innerHTML;

  let key = localStorage.getItem('yslide_gemini_api_key');
  if (!key) {
    key = prompt('Google Gemini API 키를 입력해주세요 (최초 1회 저장):');
    if (!key) return;
    localStorage.setItem('yslide_gemini_api_key', key.trim());
  }

  showToast('🌐 Gemini AI 영문 번역 중...');
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [{
            text: `Translate the provided HTML naturally into dignified, accurate English. Maintain all existing HTML tags intact. Return ONLY the translated raw HTML without markdown.\n\n${originalHtml}`
          }]
        }]
      })
    });
    const data = await res.json();
    let out = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    out = out.replace(/^```html\s*/i, '').replace(/\s*```$/i, '').trim();

    pushHistory();
    range.deleteContents();
    const d = document.createElement('div');
    d.innerHTML = out;
    const f = document.createDocumentFragment();
    while (d.firstChild) f.appendChild(d.firstChild);
    range.insertNode(f);

    saveModel();
    syncLayout();
    showToast('✨ 영어 번역 완료');
  } catch (e) {
    showToast('⚠️ 번역 실패: API 키 또는 네트워크 상태를 확인하세요');
  }
}

/* 슬라이드 프레젠테이션 */
let currentReaderIndex = 0;
function startFullPresentation(startIndex = 0) {
  readerViewport.innerHTML = '';
  const lines = editor.innerHTML.split(/<br\s*[\/]?>/gi);
  const chunkSize = Math.max(8, Math.ceil(lines.length / Math.max(1, pageTitles.length)));

  for (let i = 0; i < Math.max(1, pageTitles.length); i++) {
    const chunk = lines.slice(i * chunkSize, (i + 1) * chunkSize).join('<br>');
    const sheet = document.createElement('div');
    sheet.className = `slide-sheet ${i === startIndex ? 'active' : ''}`;
    sheet.style.fontSize = `${currentFontSize}px`;
    const title = pageTitles[i] ? `<div class="slide-title-header">${pageTitles[i]}</div>` : '';
    sheet.innerHTML = title + chunk;
    readerViewport.appendChild(sheet);
  }

  currentReaderIndex = startIndex;
  document.getElementById('reader-curr').innerText = currentReaderIndex + 1;
  document.getElementById('reader-total').innerText = Math.max(1, pageTitles.length);
  document.getElementById('reader-container').style.display = 'block';

  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
}

function previewCurrentViewPage() {
  const cardH = getCardHeight() + 28;
  const pageIdx = Math.floor(viewport.scrollTop / cardH);
  startFullPresentation(Math.min(pageTitles.length - 1, Math.max(0, pageIdx)));
}

function nextSlide() {
  const s = document.querySelectorAll('.slide-sheet');
  if (currentReaderIndex < s.length - 1) {
    s[currentReaderIndex].classList.remove('active');
    s[++currentReaderIndex].classList.add('active');
    document.getElementById('reader-curr').innerText = currentReaderIndex + 1;
  }
}

function prevSlide() {
  const s = document.querySelectorAll('.slide-sheet');
  if (currentReaderIndex > 0) {
    s[currentReaderIndex].classList.remove('active');
    s[--currentReaderIndex].classList.add('active');
    document.getElementById('reader-curr').innerText = currentReaderIndex + 1;
  }
}

function exitReaderMode() {
  document.getElementById('reader-container').style.display = 'none';
  if (document.fullscreenElement && document.exitFullscreen) {
    document.exitFullscreen().catch(() => {});
  }
}

window.addEventListener('resize', () => {
  scheduleVisualLayout();
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

function init() {
  try {
    const f = localStorage.getItem('yslide_note_font_idx');
    if (f !== null) currentFontIndex = +f % FONT_LIST.length;
    document.documentElement.style.setProperty('--active-font', FONT_LIST[currentFontIndex].family);
    btnFontCycle.innerText = FONT_LIST[currentFontIndex].name;

    const saved = localStorage.getItem('yslide_note_v70');
    if (saved) {
      const x = JSON.parse(saved);
      editor.innerHTML = x.html || '';
      pageTitles = x.titles || [];
    }
  } catch (e) {}

  pushHistory();
  syncLayout();
}

init();
</script>
