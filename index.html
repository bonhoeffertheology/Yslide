<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yslide Note</title>

<!-- PWA 메타 태그 및 아이콘 설정 -->
<meta name="theme-color" content="#181818">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yslide">
<link rel="apple-touch-icon" href="https://api.iconify.design/fluent-emoji:memo.svg">
<link id="manifest-link" rel="manifest">

<!-- KoPubWorld 및 Pretendard CDN 로드 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-kopubworld@1.0.0/kopubworld.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

<style>
:root {
  --bg-main: #0a0a0a;
  --panel-bg: #181818;
  --border-color: #333333;
  --page-bg: #141414;
  --page-border: #444444;
  --text-color: #ffffff;
  --accent: #38bdf8;
  --toolbar-height: 96px;
  --page-width: min(820px, 92vw);
  --page-card-height: 80vh;
  --header-height: 42px;
  --page-gap: 28px;
  --active-font: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
  --ui-font: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  background: var(--bg-main);
  color: var(--text-color);
  font-family: var(--ui-font);
  overflow: hidden;
}

/* 상단 2단 고정 툴바 */
#header-toolbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--toolbar-height);
  background: var(--panel-bg);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 16px;
  z-index: 1000;
  user-select: none;
  gap: 6px;
}

.toolbar-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  height: 40px;
  overflow-x: auto;
  white-space: nowrap;
  gap: 8px;
}
.toolbar-row::-webkit-scrollbar { display: none; }

.toolbar-row-top {
  justify-content: flex-start;
  border-bottom: 1px solid #282828;
  padding-bottom: 4px;
  height: 38px;
  gap: 8px;
}

.tool-group {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

button {
  height: 32px;
  padding: 0 10px;
  background: #262626;
  border: 1px solid #484848;
  border-radius: 6px;
  color: #e5e5e5;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  flex-shrink: 0;
  transition: all 0.15s ease;
  font-family: var(--ui-font);
}
button:hover { background: #333333; }
button:active { transform: scale(0.97); }

.btn-icon {
  width: 32px;
  height: 32px;
  padding: 0;
}

.icon-svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  display: block;
}

.divider {
  width: 1px;
  height: 20px;
  background: var(--border-color);
  margin: 0 2px;
  flex-shrink: 0;
}

#btn-continuous.active, #btn-batch-mode.active {
  background: #ea580c !important;
  border-color: #f97316 !important;
  color: #ffffff !important;
  box-shadow: 0 0 10px rgba(234, 88, 12, 0.6);
}

.color-btn {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid #555555;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.15s ease;
}
.color-btn.selected {
  border-color: #ffffff;
  transform: scale(1.2);
  box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
}
.c-white { background-color: #ffffff; }
.c-red { background-color: #ef4444; }
.c-yellow { background-color: #ffb703; }
.c-blue { background-color: #38bdf8; }
.c-green { background-color: #4ade80; }

.btn-font {
  height: 30px;
  padding: 0 10px;
  font-size: 12px;
  font-weight: bold;
  color: #d1d5db;
  background: #262626;
  border: 1px solid #484848;
  border-radius: 6px;
}

.size-box {
  display: inline-flex;
  align-items: center;
  background: #262626;
  border: 1px solid #484848;
  border-radius: 6px;
  padding: 2px 4px;
  gap: 2px;
  height: 32px;
  flex-shrink: 0;
}
.btn-size-step {
  width: 20px;
  height: 20px;
  padding: 0;
  background: transparent;
  border: none;
  color: #cccccc;
  font-size: 14px;
}
#size-display {
  font-size: 13px;
  font-weight: bold;
  min-width: 20px;
  text-align: center;
  color: #38bdf8;
}
#file-input { display: none; }

/* 뷰포트 레이아웃 */
#main-viewport {
  position: fixed;
  top: var(--toolbar-height);
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-main);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
}
#main-viewport.view-scroll {
  overflow-y: auto;
  overflow-x: hidden;
  padding: 24px 16px 140px;
}
#main-viewport.view-scroll::-webkit-scrollbar { display: none; }

#main-viewport.view-page {
  overflow-x: auto;
  overflow-y: hidden;
  display: flex;
  align-items: center;
  padding: 0;
  scroll-snap-type: x mandatory;
}
#main-viewport.view-page::-webkit-scrollbar { display: none; }

/* 단일 편집 문서 컨테이너 */
#document-editor {
  width: 100%;
  min-height: 100%;
  outline: none;
  caret-color: #ffffff;
  position: relative;
}
.view-scroll #document-editor {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--page-gap);
  padding-bottom: 40px;
}
.view-page #document-editor {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 0;
  min-width: max-content;
  height: 100%;
}

.page-lens-wrapper {
  flex: 0 0 100vw;
  width: 100vw;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  scroll-snap-align: center;
  scroll-snap-stop: always;
  padding: 12px;
}

.note-page-card {
  width: var(--page-width);
  max-width: 820px;
  height: var(--page-card-height);
  min-height: 460px;
  background: var(--page-bg);
  border: 2px solid var(--page-border);
  border-radius: 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.95), 0 0 0 1px rgba(255,255,255,0.05);
  position: relative;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
}

/* 💡 핵심: 페이지 헤더는 contenteditable 선택/포커스에서 완전히 배제 */
.page-header {
  height: var(--header-height);
  background: #1a1a1a;
  border-bottom: 1px solid #333333;
  display: grid;
  grid-template-columns: 110px 1fr 60px;
  align-items: center;
  padding: 0 12px 0 16px;
  font-size: 13px;
  color: #888888;
  flex-shrink: 0;
  box-sizing: border-box;
  z-index: 20;
  user-select: none;
  -webkit-user-select: none;
}

.page-badge {
  font-weight: bold;
  user-select: none;
  cursor: default;
}

.page-title-input {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: #ffffff;
  font-size: 15px;
  font-weight: 600;
  text-align: center;
  font-family: var(--ui-font);
  padding: 4px 8px;
  user-select: text;
}
.page-title-input::placeholder { color: #555555; }
.page-title-input:focus { color: #38bdf8; }

.btn-page-delete {
  width: 28px;
  height: 28px;
  background: #262626;
  border: 1px solid #484848;
  border-radius: 6px;
  color: #e5e5e5;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  justify-self: end;
  transition: all 0.15s ease;
}
.btn-page-delete:hover {
  background: #333333;
  color: #ef4444;
}

/* 각 페이지 본문 슬라이스 */
.page-content {
  flex: 1;
  width: 100%;
  height: calc(100% - var(--header-height));
  padding: 24px 36px;
  color: #ffffff;
  font-size: 26px;
  line-height: 1.55;
  outline: none;
  white-space: pre-wrap;
  word-break: break-word;
  overflow: hidden;
  cursor: text;
  font-family: var(--active-font);
  box-sizing: border-box;
  overflow-wrap: anywhere;
}

.page-content:empty:before, .page-content.is-empty:before {
  content: "여기를 클릭하여 글을 작성하거나 긴 글을 붙여넣으세요.";
  color: #666666;
  pointer-events: none;
}

body.paint-mode .page-content {
  cursor: crosshair !important;
  user-select: none;
}

#floating-scrollbar-track {
  position: fixed;
  top: calc(var(--toolbar-height) + 12px);
  bottom: 80px;
  right: 6px;
  width: 12px;
  background: transparent;
  z-index: 2000;
  cursor: pointer;
}
#floating-scrollbar-thumb {
  position: absolute;
  top: 0;
  right: 0;
  width: 6px;
  min-height: 32px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.45);
  box-shadow: 0 0 6px rgba(0,0,0,0.5);
  opacity: 0;
  transition: opacity 0.4s ease, background 0.2s;
  touch-action: none;
}
#floating-scrollbar-thumb.visible { opacity: 0.85; }
#floating-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.85); }

#bottom-dock {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(26, 26, 26, 0.95);
  border: 1px solid #444444;
  padding: 6px 18px;
  border-radius: 30px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.8);
  z-index: 1000;
  backdrop-filter: blur(8px);
}
#page-info { font-size: 13px; font-weight: bold; color: #d1d5db; }

/* 슬라이드 뷰어 */
#reader-container {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  background: #000000;
  z-index: 5000;
  user-select: none;
  overflow: hidden;
}
#reader-viewport {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}
.slide-sheet {
  width: var(--page-width);
  max-width: 820px;
  height: var(--page-card-height);
  min-height: 480px;
  background: var(--page-bg);
  border: 1px solid #383838;
  border-radius: 8px;
  padding: 28px 40px;
  color: #ffffff;
  font-size: 26px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
  overflow: hidden;
  display: none;
  box-sizing: border-box;
  font-family: var(--active-font);
}
.slide-sheet.active { display: block; }
.slide-title-header {
  font-size: 20px;
  font-weight: bold;
  color: #38bdf8;
  text-align: center;
  margin-bottom: 20px;
  padding-bottom: 8px;
  border-bottom: 1px solid #333333;
}
.touch-zone {
  position: absolute;
  top: 0; bottom: 0; width: 50%;
  cursor: pointer;
  z-index: 5500;
  -webkit-tap-highlight-color: transparent;
}
#touch-left { left: 0; }
#touch-right { right: 0; }
#exit-reader-btn {
  position: absolute;
  top: 18px; right: 24px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: rgba(40, 40, 40, 0.85);
  border: 1px solid #666666;
  color: #ffffff;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  z-index: 6000;
}
#reader-page-badge {
  position: absolute;
  top: 22px; left: 24px;
  background: rgba(30, 30, 30, 0.85);
  border: 1px solid #444444;
  padding: 6px 14px;
  border-radius: 12px;
  color: #ffb703;
  font-size: 14px;
  font-weight: bold;
  z-index: 6000;
}

#print-area { display: none; }
@media print {
  @page { margin: 15mm; size: auto; }
  html, body {
    position: static !important;
    overflow: visible !important;
    background: #ffffff !important;
    color: #000000 !important;
    height: auto !important;
  }
  #header-toolbar, #main-viewport, #bottom-dock, #reader-container, #toast, #floating-scrollbar-track {
    display: none !important;
  }
  #print-area { display: block !important; width: 100% !important; background: #ffffff !important; }
  .print-page-sheet {
    page-break-after: always !important;
    break-after: page !important;
    padding: 10px 0 20px;
    color: #000000 !important;
    font-size: 18pt !important;
    line-height: 1.6 !important;
    white-space: pre-wrap !important;
    word-break: break-word !important;
    font-family: var(--active-font);
  }
  .print-page-sheet:last-child { page-break-after: avoid !important; break-after: avoid !important; }
  .print-page-header {
    font-size: 12pt;
    font-weight: bold;
    color: #444444;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #dddddd;
    margin-bottom: 15px;
    padding-bottom: 4px;
  }
}

#toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(30, 30, 30, 0.95);
  border: 1px solid #555555;
  color: #38bdf8;
  padding: 8px 18px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: bold;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 9000;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- 상단 2단 툴바 -->
<div id="header-toolbar">
  <div class="toolbar-row toolbar-row-top">
    <div class="tool-group">
      <!-- 자간 좁게 -->
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLetterSpacing(-0.5)" title="자간 좁게">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <line x1="4" y1="12" x2="10" y2="12"></line>
          <polyline points="7 9 10 12 7 15"></polyline>
          <line x1="20" y1="12" x2="14" y2="12"></line>
          <polyline points="17 9 14 12 17 15"></polyline>
        </svg>
      </button>
      <!-- 자간 넓게 -->
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLetterSpacing(0.5)" title="자간 넓게">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <line x1="10" y1="12" x2="4" y2="12"></line>
          <polyline points="7 9 4 12 7 15"></polyline>
          <line x1="14" y1="12" x2="20" y2="12"></line>
          <polyline points="17 9 20 12 17 15"></polyline>
        </svg>
      </button>

      <div class="divider"></div>

      <!-- 줄간격 좁게 -->
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLineHeight(-0.1)" title="줄간격 좁게">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <polyline points="9 6 12 9 15 6"></polyline>
          <line x1="12" y1="2" x2="12" y2="9"></line>
          <polyline points="9 18 12 15 15 18"></polyline>
          <line x1="12" y1="22" x2="12" y2="15"></line>
        </svg>
      </button>
      <!-- 줄간격 넓게 -->
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLineHeight(0.1)" title="줄간격 넓게">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <polyline points="8 6 12 2 16 6"></polyline>
          <line x1="12" y1="2" x2="12" y2="10"></line>
          <polyline points="8 18 12 22 16 18"></polyline>
          <line x1="12" y1="22" x2="12" y2="14"></line>
        </svg>
      </button>

      <div class="divider"></div>

      <button id="btn-font-cycle" class="btn-font" onclick="cycleFontFamily()" title="글꼴 변경">기본</button>

      <!-- 볼드체 -->
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="toggleBold()" title="볼드체">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
          <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
        </svg>
      </button>

      <!-- 이탤릭체 -->
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="toggleItalic()" title="이탤릭체">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <line x1="19" y1="4" x2="10" y2="4"></line>
          <line x1="14" y1="20" x2="5" y2="20"></line>
          <line x1="15" y1="4" x2="9" y2="20"></line>
        </svg>
      </button>

      <!-- 정렬 변경 -->
      <button id="btn-align-cycle" class="btn-icon" onmousedown="event.preventDefault()" onclick="cycleTextAlign()" title="정렬 변경">
        <svg id="icon-align" class="icon-svg" viewBox="0 0 24 24">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="15" y2="12"></line>
          <line x1="3" y1="18" x2="18" y2="18"></line>
        </svg>
      </button>

      <!-- 일괄 적용 -->
      <button id="btn-batch-mode" class="btn-icon" onmousedown="event.preventDefault()" onclick="toggleBatchMode()" title="모든 페이지 일괄 서식 적용 모드">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
      </button>

      <div class="divider"></div>

      <!-- 뷰 모드 전환 -->
      <button id="btn-view-mode" class="btn-icon" onclick="toggleViewMode()" title="스크롤 / 페이지 모드 전환">
        <svg id="icon-view-mode" class="icon-svg" viewBox="0 0 24 24">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
      </button>

      <div class="divider"></div>

      <!-- 앱 설치 -->
      <button id="btn-install-app" class="btn-icon" onclick="promptInstallApp()" style="display:none; background:#0284c7; border-color:#38bdf8;" title="앱 설치">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="toolbar-row">
    <div class="tool-group">
      <!-- 파일 불러오기 -->
      <button class="btn-icon" onclick="document.getElementById('file-input').click()" title="파일 불러오기 (.txt, .json)">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path>
        </svg>
      </button>
      <input type="file" id="file-input" accept=".txt,.json" onchange="handleFileImport(this.files)">

      <!-- 저장 -->
      <button class="btn-icon" onclick="saveNoteData()" title="저장">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
      </button>

      <!-- 텍스트 공유 -->
      <button class="btn-icon" onclick="shareNoteContent()" title="텍스트 공유">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
      </button>

      <!-- 문서 인쇄 -->
      <button class="btn-icon" onclick="printNoteDocument()" title="문서 인쇄">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <polyline points="6 9 6 2 18 2 18 9"></polyline>

<!-- 메인 에디터 뷰포트 -->

  <div id="reader-page-badge"><span id="reader-curr">1</span> / <span id="reader-total">1</span></div>
</div>

<!-- 인쇄 전용 컨테이너 -->
<div id="print-area"></div>
<div id="toast"></div>

<script>
/* Yslide Note - 통합 문서 모델 V61 */
const PLACEHOLDER_TEXT = '여기를 클릭하여 글을 작성하거나 긴 글을 붙여넣으세요.';
const FONT_LIST = [
  { name: '기본', family: "-apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', sans-serif" },
  { name: 'KoPub 돋움', family: "'KoPubWorld Dotum', sans-serif" },
  { name: 'KoPub 바탕', family: "'KoPubWorld Batang', serif" }
];
const ALIGN_MODES = ['left', 'center', 'right'];
const ALIGN_NAMES = ['좌측 정렬', '가운데 정렬', '우측 정렬'];

let currentFontIndex = 0, activeColor = '#ef4444', isContinuousMode = false, isBatchMode = false, isPainting = false, lastPaintedKey = '';
let currentFontSize = 26, globalLetterSpacing = 0, globalLineHeight = 1.55, globalIsBold = false, globalIsItalic = false, currentTextAlignIndex = 0;
let viewMode = 'scroll', pageMeta = [], documentHTML = '', undoStack = [], redoStack = [], MAX_HISTORY = 40;
let isReflowing = false, reflowTimer = null, currentReaderIndex = 0, isReaderOpen = false, toastTimer = null;

const viewport = document.getElementById('main-viewport');
const readerViewport = document.getElementById('reader-viewport');
const btnFontCycle = document.getElementById('btn-font-cycle'), btnBatchMode = document.getElementById('btn-batch-mode'), btnViewMode = document.getElementById('btn-view-mode');
const iconViewMode = document.getElementById('icon-view-mode'), iconAlign = document.getElementById('icon-align');
const scrollbarThumb = document.getElementById('floating-scrollbar-thumb'), scrollbarTrack = document.getElementById('floating-scrollbar-track');

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
function getDynamicAvailableHeight() { return Math.max(300, window.innerHeight * 0.8 - 42 - 48); }
function getDynamicCardWidth() { return Math.min(820, window.innerWidth * 0.92); }

function getMeasureBox() {
  let b = document.getElementById('yslide-measure-box');
  if (!b) {
    b = document.createElement('div');
    b.id = 'yslide-measure-box';
    b.style.cssText = 'position:fixed;left:-100000px;top:0;visibility:hidden;pointer-events:none;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;box-sizing:border-box;';
    document.body.appendChild(b);
  }
  b.style.width = (getDynamicCardWidth() - 72) + 'px';
  b.style.fontSize = currentFontSize + 'px';
  b.style.fontFamily = FONT_LIST[currentFontIndex].family;
  b.style.letterSpacing = globalLetterSpacing + 'px';
  b.style.lineHeight = globalLineHeight;
  b.style.textAlign = ALIGN_MODES[currentTextAlignIndex];
  return b;
}

/* 💡 안정적인 단락 단위 분할 엔진: 엔터/백스페이스 서식이 깨지지 않도록 DOM 블록 매핑 */
function paginateDocument() {
  if (!documentHTML || !documentHTML.trim()) return [''];
  
  const temp = document.createElement('div');
  temp.innerHTML = documentHTML;
  
  // 루트 자식 노드들을 단락/블록 단위로 수집
  const blocks = [];
  temp.childNodes.forEach(child => {
    if (child.nodeType === Node.TEXT_NODE && !child.textContent) return;
    blocks.push(child.cloneNode(true));
  });

  if (!blocks.length) return [''];

  const box = getMeasureBox();
  const maxHeight = getDynamicAvailableHeight();
  const pages = [];
  let currentPage = document.createElement('div');

  for (let i = 0; i < blocks.length; i++) {
    const block = blocks[i];
    currentPage.appendChild(block);
    box.innerHTML = currentPage.innerHTML;

    if (box.offsetHeight > maxHeight && currentPage.childNodes.length > 1) {
      currentPage.removeChild(block);
      pages.push(currentPage.innerHTML);
      currentPage = document.createElement('div');
      currentPage.appendChild(block);
    }
  }

  if (currentPage.childNodes.length > 0) {
    pages.push(currentPage.innerHTML);
  }

  return pages.length ? pages : [''];
}

function captureGlobalCaret() {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return null;
  const range = sel.getRangeAt(0);
  const root = document.getElementById('document-editor');
  if (!root || !root.contains(range.startContainer)) return null;

  let offset = 0;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
  let node;
  while ((node = walker.nextNode())) {
    if (node === range.startContainer) {
      return offset + range.startOffset;
    }
    offset += node.textContent.length;
  }
  return offset;
}

function restoreGlobalCaret(targetOffset) {
  if (targetOffset === null) return;
  const root = document.getElementById('document-editor');
  if (!root) return;

  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
  let node, accumulated = 0;

  while ((node = walker.nextNode())) {
    const len = node.textContent.length;
    if (accumulated + len >= targetOffset) {
      const range = document.createRange();
      range.setStart(node, Math.min(targetOffset - accumulated, len));
      range.collapse(true);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      return;
    }
    accumulated += len;
  }

  // 끝으로 이동
  const allContents = root.querySelectorAll('.page-content');
  const last = allContents[allContents.length - 1];
  if (last) {
    const range = document.createRange();
    range.selectNodeContents(last);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
}

function renderPages(savedCaret = null) {
  if (isReflowing) return;
  isReflowing = true;

  const oldScrollTop = viewport.scrollTop;
  const oldScrollLeft = viewport.scrollLeft;
  const pages = paginateDocument();

  while (pageMeta.length < pages.length) pageMeta.push({ title: '', align: 'left' });
  if (pageMeta.length > pages.length) pageMeta = pageMeta.slice(0, pages.length);

  viewport.innerHTML = '';
  const root = document.createElement('div');
  root.id = 'document-editor';

  pages.forEach((html, index) => {
    const card = document.createElement('div');
    card.className = 'note-page-card';
    card.dataset.index = index;

    // 💡 헤더는 contenteditable 내부가 아니므로 본문 선택 시 파란색 블록으로 잡히지 않음
    const header = document.createElement('div');
    header.className = 'page-header';

    const badge = document.createElement('span');
    badge.className = 'page-badge';
    badge.textContent = `[ PAGE ${index + 1} ]`;

    const title = document.createElement('input');
    title.className = 'page-title-input';
    title.type = 'text';
    title.placeholder = '제목을 입력하세요';
    title.value = pageMeta[index]?.title || '';
    title.addEventListener('input', e => {
      pageMeta[index].title = e.target.value;
      saveModel();
    });

    const del = document.createElement('button');
    del.className = 'btn-page-delete';
    del.title = '이 페이지 삭제';
    del.innerHTML = `
      <svg class="icon-svg" viewBox="0 0 24 24" style="width:15px;height:15px">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      </svg>
    `;
    del.onclick = e => { e.preventDefault(); deletePage(index); };

    header.append(badge, title, del);
    card.appendChild(header);

    const content = document.createElement('div');
    content.className = 'page-content';
    content.contentEditable = 'true';
    content.spellcheck = false;
    content.innerHTML = html || '';
    content.style.textAlign = pageMeta[index]?.align || 'left';
    content.style.fontSize = currentFontSize + 'px';
    content.style.letterSpacing = globalLetterSpacing + 'px';
    content.style.lineHeight = globalLineHeight;
    content.style.fontWeight = globalIsBold ? 'bold' : 'normal';
    content.style.fontStyle = globalIsItalic ? 'italic' : 'normal';

    bindContentEvents(content, index);

    card.appendChild(content);

    if (viewMode === 'page') {
      const wrap = document.createElement('div');
      wrap.className = 'page-lens-wrapper';
      wrap.appendChild(card);
      root.appendChild(wrap);
    } else {
      root.appendChild(card);
    }
  });

  viewport.appendChild(root);
  updatePageInfo();
  isReflowing = false;

  viewport.scrollTop = oldScrollTop;
  viewport.scrollLeft = oldScrollLeft;
  updateFloatingScrollbar();

  if (savedCaret !== null) {
    requestAnimationFrame(() => restoreGlobalCaret(savedCaret));
  }
}

function serializeAllContent() {
  const contents = document.querySelectorAll('.page-content');
  let fullHtml = '';
  contents.forEach((c, idx) => {
    if (idx > 0 && fullHtml && !fullHtml.endsWith('<br>')) fullHtml += '<br>';
    fullHtml += c.innerHTML;
  });
  return fullHtml;
}

function bindContentEvents(content, index) {
  content.addEventListener('input', () => {
    if (isReflowing) return;
    const caret = captureGlobalCaret();
    documentHTML = serializeAllContent();
    saveModel();

    if (content.scrollHeight > content.clientHeight + 4) {
      if (reflowTimer) clearTimeout(reflowTimer);
      reflowTimer = setTimeout(() => renderPages(caret), 80);
    }
  });

  content.addEventListener('keydown', e => {
    // Ctrl+A: 전체 페이지 본문 일괄 선택
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') {
      e.preventDefault();
      const allContents = document.querySelectorAll('.page-content');
      if (!allContents.length) return;
      const first = allContents[0];
      const last = allContents[allContents.length - 1];

      const range = document.createRange();
      range.setStart(first, 0);
      range.setEnd(last, last.childNodes.length);

      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      return;
    }

    // 엔터 및 백스페이스 시 서식 파괴 방지
    if (e.key === 'Enter') {
      pushHistory();
      setTimeout(() => {
        documentHTML = serializeAllContent();
        saveModel();
        const caret = captureGlobalCaret();
        if (content.scrollHeight > content.clientHeight + 4) {
          renderPages(caret);
        }
      }, 10);
    }

    if (e.key === 'Backspace' || e.key === 'Delete') {
      pushHistory();
      setTimeout(() => {
        documentHTML = serializeAllContent();
        saveModel();
      }, 10);
    }
  });

  content.addEventListener('paste', e => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    if (!text) return;
    pushHistory();
    const formatted = text.replace(/\r\n/g, '<br>').replace(/\n/g, '<br>');
    document.execCommand('insertHTML', false, formatted);
    documentHTML = serializeAllContent();
    saveModel();
    const caret = captureGlobalCaret();
    renderPages(caret);
  });

  attachContinuousEvents(content, index);
}

function deletePage(index) {
  const contents = document.querySelectorAll('.page-content');
  if (contents.length <= 1) {
    showToast('⚠️ 마지막 남은 페이지는 삭제할 수 없습니다');
    return;
  }
  pushHistory();
  if (index > 0) {
    contents[index - 1].innerHTML += contents[index].innerHTML;
  } else {
    contents[1].innerHTML = contents[0].innerHTML + contents[1].innerHTML;
  }
  pageMeta.splice(index, 1);
  documentHTML = serializeAllContent();
  renderPages();
  saveModel();
  showToast('🗑️ 페이지가 삭제되었습니다');
}

function addNewPage() {
  pushHistory();
  documentHTML = serializeAllContent() + '<br><br>';
  pageMeta.push({ title: '', align: 'left' });
  renderPages();
  saveModel();
  setTimeout(() => {
    const cards = document.querySelectorAll('.note-page-card');
    const lastCard = cards[cards.length - 1];
    if (lastCard) {
      lastCard.scrollIntoView({ behavior: 'smooth' });
      const ed = lastCard.querySelector('.page-content');
      if (ed) ed.focus();
    }
  }, 50);
  showToast('📄 새 페이지가 추가되었습니다');
}

/* 서식 및 타이포그래피 */
function toggleBold() {
  pushHistory();
  const sel = window.getSelection();
  if (sel && !sel.isCollapsed && !isBatchMode) {
    document.execCommand('bold', false, null);
  } else {
    globalIsBold = !globalIsBold;
    document.querySelectorAll('.page-content').forEach(c => {
      c.style.fontWeight = globalIsBold ? 'bold' : 'normal';
    });
    showToast(globalIsBold ? '전체 볼드체 적용' : '전체 볼드체 해제');
  }
  documentHTML = serializeAllContent();
  saveModel();
}

function toggleItalic() {
  pushHistory();
  const sel = window.getSelection();
  if (sel && !sel.isCollapsed && !isBatchMode) {
    document.execCommand('italic', false, null);
  } else {
    globalIsItalic = !globalIsItalic;
    document.querySelectorAll('.page-content').forEach(c => {
      c.style.fontStyle = globalIsItalic ? 'italic' : 'normal';
    });
    showToast(globalIsItalic ? '전체 이탤릭체 적용' : '전체 이탤릭체 해제');
  }
  documentHTML = serializeAllContent();
  saveModel();
}

function adjustLetterSpacing(delta) {
  pushHistory();
  globalLetterSpacing = parseFloat((globalLetterSpacing + delta).toFixed(1));
  document.querySelectorAll('.page-content').forEach(c => {
    c.style.letterSpacing = globalLetterSpacing + 'px';
  });
  showToast(`자간: ${globalLetterSpacing}px`);
  documentHTML = serializeAllContent();
  saveModel();
}

function adjustLineHeight(delta) {
  pushHistory();
  globalLineHeight = parseFloat(Math.max(0.8, globalLineHeight + delta).toFixed(2));
  document.querySelectorAll('.page-content').forEach(c => {
    c.style.lineHeight = globalLineHeight;
  });
  showToast(`줄간격: ${globalLineHeight}`);
  documentHTML = serializeAllContent();
  saveModel();
}

function cycleFontFamily() {
  currentFontIndex = (currentFontIndex + 1) % FONT_LIST.length;
  localStorage.setItem('yslide_note_font_idx', currentFontIndex);
  document.documentElement.style.setProperty('--active-font', FONT_LIST[currentFontIndex].family);
  btnFontCycle.innerText = FONT_LIST[currentFontIndex].name;
  document.querySelectorAll('.page-content').forEach(c => {
    c.style.fontFamily = FONT_LIST[currentFontIndex].family;
  });
  showToast(`글꼴: ${FONT_LIST[currentFontIndex].name}`);
}

function cycleTextAlign() {
  pushHistory();
  currentTextAlignIndex = (currentTextAlignIndex + 1) % ALIGN_MODES.length;
  const mode = ALIGN_MODES[currentTextAlignIndex];
  
  if (mode === 'left') {
    iconAlign.innerHTML = '<line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="15" y2="12"></line><line x1="3" y1="18" x2="18" y2="18"></line>';
  } else if (mode === 'center') {
    iconAlign.innerHTML = '<line x1="3" y1="6" x2="21" y2="6"></line><line x1="6" y1="12" x2="18" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line>';
  } else {
    iconAlign.innerHTML = '<line x1="3" y1="6" x2="21" y2="6"></line><line x1="9" y1="12" x2="21" y2="12"></line><line x1="6" y1="18" x2="21" y2="18"></line>';
  }

  if (isBatchMode) {
    document.querySelectorAll('.page-content').forEach(c => c.style.textAlign = mode);
    pageMeta.forEach(p => p.align = mode);
    showToast(`전체 ${ALIGN_NAMES[currentTextAlignIndex]}`);
  } else {
    const idx = getCurrentPageIndex();
    const cur = document.querySelectorAll('.page-content')[idx];
    if (cur) {
      cur.style.textAlign = mode;
      if (pageMeta[idx]) pageMeta[idx].align = mode;
      showToast(`페이지 ${idx + 1}: ${ALIGN_NAMES[currentTextAlignIndex]}`);
    }
  }
  saveModel();
}

function changeFontSize(delta) {
  currentFontSize = Math.min(48, Math.max(16, currentFontSize + delta));
  document.getElementById('size-display').innerText = currentFontSize;
  document.querySelectorAll('.page-content').forEach(c => {
    c.style.fontSize = currentFontSize + 'px';
  });
  renderPages(captureGlobalCaret());
}

function selectColor(color, el) {
  activeColor = color;
  document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
  el?.classList.add('selected');

  const sel = window.getSelection();
  if (sel && !sel.isCollapsed && !isContinuousMode) {
    pushHistory();
    document.execCommand('foreColor', false, color);
    documentHTML = serializeAllContent();
    saveModel();
  }
}

/* 연속 터치 채색 기능 */
function attachContinuousEvents(contentEl, pageIdx) {
  function paintAt(x, y) {
    let r = document.caretRangeFromPoint ? document.caretRangeFromPoint(x, y) : null;
    if (!r) return;

    let n = r.startContainer;
    if (n.nodeType !== Node.TEXT_NODE) {
      if (n.childNodes.length > 0 && r.startOffset < n.childNodes.length) {
        n = n.childNodes[r.startOffset];
        while (n && n.nodeType !== Node.TEXT_NODE && n.firstChild) n = n.firstChild;
      }
    }

    if (n && n.nodeType === Node.TEXT_NODE) {
      const txt = n.textContent;
      const off = r.startOffset;
      let a = Math.min(off, txt.length > 0 ? txt.length - 1 : 0);
      while (a > 0 && !/\s/.test(txt[a - 1])) a--;
      let b = off;
      while (b < txt.length && !/\s/.test(txt[b])) b++;

      if (a < b) {
        const key = `${n.textContent}_${a}_${b}`;
        if (key === lastPaintedKey) return;
        lastPaintedKey = key;

        const wr = document.createRange();
        wr.setStart(n, a);
        wr.setEnd(n, b);

        const s = window.getSelection();
        s.removeAllRanges();
        s.addRange(wr);
        document.execCommand('foreColor', false, activeColor);
        s.removeAllRanges();

        documentHTML = serializeAllContent();
        saveModel();
      }
    }
  }

  contentEl.addEventListener('touchstart', e => {
    if (isContinuousMode) {
      pushHistory();
      isPainting = true;
      paintAt(e.touches[0].clientX, e.touches[0].clientY);
      e.preventDefault();
    }
  }, { passive: false });

  contentEl.addEventListener('touchmove', e => {
    if (isContinuousMode && isPainting) {
      paintAt(e.touches[0].clientX, e.touches[0].clientY);
      e.preventDefault();
    }
  }, { passive: false });

  contentEl.addEventListener('mousedown', e => {
    if (isContinuousMode) {
      pushHistory();
      isPainting = true;
      paintAt(e.clientX, e.clientY);
      e.preventDefault();
    }
  });

  contentEl.addEventListener('mousemove', e => {
    if (isContinuousMode && isPainting) {
      paintAt(e.clientX, e.clientY);
      e.preventDefault();
    }
  });
}

window.addEventListener('mouseup', () => { isPainting = false; lastPaintedKey = ''; });
window.addEventListener('touchend', () => { isPainting = false; lastPaintedKey = ''; });

function toggleContinuousMode() {
  isContinuousMode = !isContinuousMode;
  document.getElementById('btn-continuous').classList.toggle('active', isContinuousMode);
  document.body.classList.toggle('paint-mode', isContinuousMode);
  showToast(isContinuousMode ? '🎨 연속 채색 모드 ON' : '⌨️ 일반 텍스트 모드 ON');
}

function toggleBatchMode() {
  isBatchMode = !isBatchMode;
  btnBatchMode.classList.toggle('active', isBatchMode);
  showToast(isBatchMode ? '🌐 일괄 적용 모드 ON' : '📄 단일 적용 모드 ON');
}

function toggleViewMode() {
  viewMode = viewMode === 'scroll' ? 'page' : 'scroll';
  localStorage.setItem('yslide_note_view_mode', viewMode);
  applyViewModeUI();
  renderPages(captureGlobalCaret());
  showToast(viewMode === 'scroll' ? '📜 세로 스크롤 모드' : '📄 페이지 넘김 모드');
}

function applyViewModeUI() {
  viewport.className = viewMode === 'scroll' ? 'view-scroll' : 'view-page';
  if (iconViewMode) {
    if (viewMode === 'scroll') {
      iconViewMode.innerHTML = '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>';
      btnViewMode.title = '현재: 세로 스크롤 모드';
    } else {
      iconViewMode.innerHTML = '<rect x="4" y="2" width="16" height="20" rx="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="8" y1="10" x2="16" y2="10"></line><line x1="8" y1="14" x2="16" y2="14"></line><line x1="8" y1="18" x2="16" y2="18"></line>';
      btnViewMode.title = '현재: 페이지 넘김 모드';
    }
  }
  updateFloatingScrollbar();
}

function getCurrentPageIndex() {
  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0) {
    let node = sel.anchorNode;
    while (node && node !== document.body) {
      if (node.classList && node.classList.contains('note-page-card')) {
        return parseInt(node.dataset.index, 10) || 0;
      }
      node = node.parentNode;
    }
  }
  return 0;
}

function updatePageInfo() {
  const el = document.getElementById('page-info');
  const count = document.querySelectorAll('.note-page-card').length;
  if (el) el.textContent = `${Math.max(1, count)} 페이지`;
}

function saveModel() {
  try {
    localStorage.setItem('yslide_note_document_v61', JSON.stringify({
      version: 61,
      html: documentHTML,
      pageMeta,
      viewMode
    }));
  } catch (e) {}
}

function pushHistory() {
  const st = JSON.stringify({ html: documentHTML, pageMeta });
  if (!undoStack.length || undoStack[undoStack.length - 1] !== st) {
    undoStack.push(st);
    if (undoStack.length > MAX_HISTORY) undoStack.shift();
    redoStack = [];
  }
}

function undo() {
  if (undoStack.length <= 1) {
    showToast('⚠️ 더 이상 되돌릴 작업이 없습니다');
    return;
  }
  const cur = undoStack.pop();
  redoStack.push(cur);
  const prev = JSON.parse(undoStack[undoStack.length - 1]);
  documentHTML = prev.html || '';
  pageMeta = prev.pageMeta || [];
  renderPages();
  saveModel();
  showToast('↶ 되돌리기');
}

function redo() {
  if (!redoStack.length) {
    showToast('⚠️ 다시 실행할 작업이 없습니다');
    return;
  }
  const n = redoStack.pop();
  undoStack.push(n);
  const next = JSON.parse(n);
  documentHTML = next.html || '';
  pageMeta = next.pageMeta || [];
  renderPages();
  saveModel();
  showToast('↷ 다시 실행');
}

/* 스크롤바 제어 */
function updateFloatingScrollbar() {
  if (!scrollbarThumb || viewMode !== 'scroll') {
    scrollbarThumb?.classList.remove('visible');
    return;
  }
  const sh = viewport.scrollHeight, ch = viewport.clientHeight;
  if (sh <= ch + 10) {
    scrollbarThumb.classList.remove('visible');
    return;
  }
  const th = Math.max(30, (ch / sh) * scrollbarTrack.clientHeight);
  const max = sh - ch;
  const top = (viewport.scrollTop / max) * (scrollbarTrack.clientHeight - th);
  scrollbarThumb.style.height = `${th}px`;
  scrollbarThumb.style.transform = `translateY(${top}px)`;
  scrollbarThumb.classList.add('visible');

  clearTimeout(window._sf);
  window._sf = setTimeout(() => scrollbarThumb.classList.remove('visible'), 1200);
}

viewport.addEventListener('scroll', updateFloatingScrollbar, { passive: true });

let isDrag = false, startY = 0, startScroll = 0;
scrollbarThumb.addEventListener('mousedown', e => {
  isDrag = true;
  startY = e.clientY;
  startScroll = viewport.scrollTop;
  e.preventDefault();
});
window.addEventListener('mousemove', e => {
  if (!isDrag) return;
  const trackH = scrollbarTrack.clientHeight - scrollbarThumb.clientHeight;
  const scrollH = viewport.scrollHeight - viewport.clientHeight;
  if (trackH > 0) {
    viewport.scrollTop = startScroll + ((e.clientY - startY) / trackH) * scrollH;
  }
});
window.addEventListener('mouseup', () => { isDrag = false; });

/* 공유, 파일 및 외부 연동 */
function saveNoteData() {
  documentHTML = serializeAllContent();
  saveModel();
  const now = new Date();
  const ds = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}_${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}`;
  const blob = new Blob([JSON.stringify({ version: 61, html: documentHTML, pageMeta, viewMode }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Yslide_${ds}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  showToast('💾 파일로 저장되었습니다');
}

function handleFileImport(files) {
  if (!files?.length) return;
  const reader = new FileReader();
  reader.onload = e => {
    const raw = e.target.result;
    pushHistory();
    try {
      const x = JSON.parse(raw);
      if (Array.isArray(x)) {
        documentHTML = x.map(p => p.isPlaceholder ? '' : (p.html || '')).filter(Boolean).join('<br><br>');
        pageMeta = x.map(p => ({ title: p.title || '', align: p.align || 'left' }));
      } else {
        documentHTML = x.html || '';
        pageMeta = x.pageMeta || [];
      }
    } catch {
      documentHTML = String(raw).replace(/\r\n/g, '<br>').replace(/\n/g, '<br>');
      pageMeta = [];
    }
    renderPages();
    saveModel();
    showToast('📂 파일을 성공적으로 불러왔습니다');
  };
  reader.readAsText(files[0]);
}

async function shareNoteContent() {
  documentHTML = serializeAllContent();
  const temp = document.createElement('div');
  temp.innerHTML = documentHTML;
  const text = temp.innerText.trim();

  if (!text) return showToast('⚠️ 공유할 내용이 없습니다');

  if (navigator.share) {
    try {
      await navigator.share({ title: 'Yslide 원고 공유', text });
      showToast('📤 공유 완료');
    } catch (e) {}
  } else {
    navigator.clipboard?.writeText(text).then(() => showToast('📋 클립보드에 복사되었습니다'));
  }
}

function printNoteDocument() {
  documentHTML = serializeAllContent();
  saveModel();
  const printArea = document.getElementById('print-area');
  printArea.innerHTML = '';
  const pages = paginateDocument();

  pages.forEach((html, i) => {
    const sheet = document.createElement('div');
    sheet.className = 'print-page-sheet';
    sheet.innerHTML = `
      <div class="print-page-header">
        <span>[ PAGE ${i + 1} / ${pages.length} ]</span>
        <span>${esc(pageMeta[i]?.title || '')}</span>
      </div>
      <div>${html}</div>
    `;
    printArea.appendChild(sheet);
  });
  window.print();
}

async function translateSelectedTextWithGemini() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) return showToast('⚠️ 번역할 문장을 먼저 드래그하세요');

  const range = sel.getRangeAt(0);
  const temp = document.createElement('div');
  temp.appendChild(range.cloneContents());
  const originalHtml = temp.innerHTML;

  let key = localStorage.getItem('yslide_gemini_api_key');
  if (!key) {
    key = prompt('Google Gemini API 키를 입력해주세요 (최초 1회 저장):');
    if (!key) return;
    localStorage.setItem('yslide_gemini_api_key', key.trim());
  }

  showToast('🌐 Gemini AI 영문 번역 중...');
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [{
            text: `Translate the provided HTML naturally into dignified, accurate English. Maintain all existing HTML tags intact. Return ONLY the translated raw HTML without markdown.\n\n${originalHtml}`
          }]
        }]
      })
    });
    const data = await res.json();
    let out = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    out = out.replace(/^```html\s*/i, '').replace(/\s*```$/i, '').trim();

    pushHistory();
    range.deleteContents();
    const d = document.createElement('div');
    d.innerHTML = out;
    const f = document.createDocumentFragment();
    while (d.firstChild) f.appendChild(d.firstChild);
    range.insertNode(f);

    documentHTML = serializeAllContent();
    saveModel();
    renderPages(captureGlobalCaret());
    showToast('✨ 영어 번역 완료');
  } catch (e) {
    showToast('⚠️ 번역 실패: API 키 또는 네트워크 상태를 확인하세요');
  }
}

/* 슬라이드 프리젠테이션 */
function previewCurrentViewPage() {
  const cards = document.querySelectorAll('.note-page-card');
  const viewportCenter = viewport.scrollTop + (viewport.clientHeight / 2);
  let targetIndex = 0;
  cards.forEach((c, idx) => {
    if (c.offsetTop <= viewportCenter) targetIndex = idx;
  });
  startFullPresentation(targetIndex);
}

function startFullPresentation(startIndex = 0) {
  documentHTML = serializeAllContent();
  saveModel();
  readerViewport.innerHTML = '';
  const pages = paginateDocument();

  pages.forEach((html, i) => {
    const sheet = document.createElement('div');
    sheet.className = `slide-sheet ${i === startIndex ? 'active' : ''}`;
    sheet.style.fontSize = `${currentFontSize}px`;
    const title = pageMeta[i]?.title ? `<div class="slide-title-header">${esc(pageMeta[i].title)}</div>` : '';
    sheet.innerHTML = title + html;
    readerViewport.appendChild(sheet);
  });

  currentReaderIndex = Math.min(startIndex, pages.length - 1);
  document.getElementById('reader-curr').innerText = currentReaderIndex + 1;
  document.getElementById('reader-total').innerText = pages.length;
  document.getElementById('reader-container').style.display = 'block';
  isReaderOpen = true;

  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
}

function nextSlide() {
  const s = document.querySelectorAll('.slide-sheet');
  if (currentReaderIndex < s.length - 1) {
    s[currentReaderIndex].classList.remove('active');
    s[++currentReaderIndex].classList.add('active');
    document.getElementById('reader-curr').innerText = currentReaderIndex + 1;
  }
}

function prevSlide() {
  const s = document.querySelectorAll('.slide-sheet');
  if (currentReaderIndex > 0) {
    s[currentReaderIndex].classList.remove('active');
    s[--currentReaderIndex].classList.add('active');
    document.getElementById('reader-curr').innerText = currentReaderIndex + 1;
  }
}

function exitReaderMode() {
  document.getElementById('reader-container').style.display = 'none';
  isReaderOpen = false;
  if (document.fullscreenElement && document.exitFullscreen) {
    document.exitFullscreen().catch(() => {});
  }
}

window.addEventListener('keydown', e => {
  if (isReaderOpen) {
    if (['ArrowRight', 'ArrowDown', ' ', 'PageDown'].includes(e.key)) {
      e.preventDefault();
      nextSlide();
    } else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) {
      e.preventDefault();
      prevSlide();
    } else if (e.key === 'Escape') {
      exitReaderMode();
    }
    return;
  }

  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    e.shiftKey ? redo() : undo();
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
    e.preventDefault();
    redo();
  }
});

function promptInstallApp() {
  if (window.deferredPrompt) {
    window.deferredPrompt.prompt();
    window.deferredPrompt.userChoice.finally(() => window.deferredPrompt = null);
  } else {
    showToast('💡 브라우저 메뉴의 [홈 화면에 추가]를 눌러 설치하세요');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1500);
}

window.addEventListener('resize', () => {
  clearTimeout(reflowTimer);
  reflowTimer = setTimeout(() => renderPages(), 200);
});

window.deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  window.deferredPrompt = e;
  const b = document.getElementById('btn-install-app');
  if (b) b.style.display = 'inline-flex';
});

function init() {
  try {
    const f = localStorage.getItem('yslide_note_font_idx');
    if (f !== null) currentFontIndex = +f % FONT_LIST.length;
    document.documentElement.style.setProperty('--active-font', FONT_LIST[currentFontIndex].family);
    btnFontCycle.innerText = FONT_LIST[currentFontIndex].name;

    const vm = localStorage.getItem('yslide_note_view_mode');
    if (vm) viewMode = vm;

    const saved = localStorage.getItem('yslide_note_document_v61') || localStorage.getItem('yslide_note_document_v60');
    if (saved) {
      const x = JSON.parse(saved);
      documentHTML = x.html || '';
      pageMeta = Array.isArray(x.pageMeta) ? x.pageMeta : [];
      if (x.viewMode) viewMode = x.viewMode;
    } else {
      const old = localStorage.getItem('yslide_note_pages_v53');
      if (old) {
        const arr = JSON.parse(old);
        if (Array.isArray(arr)) {
          documentHTML = arr.map(p => p.isPlaceholder ? '' : (p.html || '')).filter(Boolean).join('<br><br>');
          pageMeta = arr.map(p => ({ title: p.title || '', align: p.align || 'left' }));
        }
      }
    }
  } catch (e) {
    documentHTML = '';
    pageMeta = [];
  }

  applyViewModeUI();
  renderPages();
  pushHistory();
  updateFloatingScrollbar();
}

init();
</script>
