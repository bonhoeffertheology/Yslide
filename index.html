<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>Yslide</title>

<!-- KoPubWorld 및 웹폰트 CDN 로드 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-kopubworld@1.0.0/kopubworld.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

<!-- PWA 설정 및 캐시 무효화 -->
<link rel="manifest" href="manifest.json?v=2026_connected_page_engine_v57">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#1e1e1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yslide">

<style>
  :root {
    --font-size: 30px;
    --line-height: 1.45;
    --top-margin: calc(var(--font-size) * var(--line-height) * 2.2);
    --slide-fixed-height: 740px;
    --color-yellow: #ffb703;
    --content-max-width: 1000px;
    --content-padding-x: 32px;
    --toolbar-height: 96px;
    --ui-font: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    width: 100%;
    height: 100%;
    position: fixed;
    overflow: hidden;
    background-color: #000000;
    color: #f3f4f6;
    font-family: 'KoPubWorld Dotum', 'Pretendard', sans-serif;
  }

  ::selection {
    background-color: rgba(255, 255, 255, 0.38);
    text-shadow: 0 0 3px rgba(0, 0, 0, 0.9);
  }
  ::-moz-selection {
    background-color: rgba(255, 255, 255, 0.38);
    text-shadow: 0 0 3px rgba(0, 0, 0, 0.9);
  }

  /* 상단 2단 고정 툴바 */
  #toolbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: var(--toolbar-height);
    background-color: #1e1e1e;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 16px;
    border-bottom: 1px solid #333;
    z-index: 999999;
    gap: 6px;
    pointer-events: auto;
    font-family: var(--ui-font) !important;
  }

  .toolbar-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: 40px;
    font-family: var(--ui-font) !important;
  }

  .toolbar-row-top {
    justify-content: flex-start;
    gap: 6px;
    border-bottom: 1px solid #292929;
    padding-bottom: 4px;
    height: 38px;
  }

  .btn-group { display: flex; gap: 8px; align-items: center; }
  
  button {
    padding: 0 12px; height: 34px; font-size: 13px; font-weight: bold;
    border: 1px solid #444; border-radius: 6px;
    background-color: #2c2c2c; color: #d1d5db; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; user-select: none;
    transition: all 0.15s ease;
    font-family: var(--ui-font) !important;
  }
  button:active { background-color: #404040; color: #fff; }
  
  .btn-icon { width: 34px; padding: 0; }
  
  .icon-svg {
    width: 17px; height: 17px; fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }

  .btn-format {
    width: 32px;
    height: 28px;
    padding: 0;
    background-color: #282828;
    border: 1px solid #4a4a4a;
    color: #e5e5e5;
    border-radius: 4px;
  }
  .btn-format:active {
    background-color: #3f3f3f;
    color: #38bdf8;
    border-color: #38bdf8;
  }
  
  .btn-height-toggle {
    height: 28px;
    padding: 0 8px;
    font-size: 13px;
    font-weight: bold;
    background-color: #282828;
    border: 1px solid #4a4a4a;
    color: #38bdf8;
    border-radius: 4px;
  }
  .btn-height-toggle:active {
    background-color: #38bdf8;
    color: #000;
  }

  .btn-font-cycle {
    height: 28px;
    padding: 0 10px;
    font-size: 12px;
    font-weight: bold;
    background-color: #282828;
    border: 1px solid #4a4a4a;
    color: #d1d5db;
    border-radius: 4px;
    cursor: pointer;
    user-select: none;
  }
  .btn-font-cycle:active {
    background-color: #3f3f3f;
    color: #38bdf8;
  }

  .btn-view-toggle {
    width: 32px;
    height: 28px;
    padding: 0;
    background-color: #282828;
    border: 1px solid #4a4a4a;
    color: #d1d5db;
    border-radius: 4px;
    cursor: pointer;
    user-select: none;
  }
  .btn-view-toggle:active {
    background-color: #3f3f3f;
    color: #ffffff;
    border-color: #777;
  }

  .format-divider {
    width: 1px;
    height: 16px;
    background: #383838;
    margin: 0 2px;
  }

  #btn-continuous.active {
    background-color: #ea580c; color: #ffffff; border-color: #f97316;
    box-shadow: 0 0 8px rgba(234, 88, 12, 0.6);
  }

  /* 색상 팔레트 */
  .color-btn { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #555; cursor: pointer; position: relative; padding: 0; }
  .color-btn.selected { border-color: #ffffff; transform: scale(1.15); box-shadow: 0 0 6px rgba(255,255,255,0.8); }
  .c-white { background-color: #ffffff; }
  .c-red { background-color: #ef4444; }
  .c-yellow { background-color: var(--color-yellow); }
  .c-blue { background-color: #38bdf8; }
  .c-green { background-color: #4ade80; }

  .size-control {
    display: flex; align-items: center; gap: 4px; margin-left: 4px; background: #222;
    padding: 2px 4px; border-radius: 6px; border: 1px solid #383838;
  }
  .btn-step {
    width: 28px; height: 28px; font-size: 14px; font-weight: bold;
    background: #2c2c2c; border: 1px solid #444; border-radius: 4px; color: #e5e5e5;
  }
  .btn-step:active { background: #444; }
  #size-val {
    font-size: 13px; font-weight: bold; color: #d1d5db; width: 28px; text-align: center;
    font-family: var(--ui-font) !important;
  }

  #file-input { display: none; }

  .btn-play {
    background-color: #2c2c2c; color: #d1d5db; border: 1px solid #444;
    width: 40px; height: 34px; font-size: 15px; border-radius: 6px; padding: 0;
  }
  .btn-play:active { background-color: #404040; color: #fff; }

  /* 편집 스크롤/페이지 뷰포트 */
  #editor-container {
    position: absolute;
    top: var(--toolbar-height);
    bottom: 0;
    left: 0;
    right: 0;
    background-color: #000000;
    display: flex;
    justify-content: center;
    padding: 0;
    z-index: 10;
  }

  /* 1. 세로 스크롤 모드 */
  #editor-container.mode-scroll {
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }
  #editor-container.mode-scroll::-webkit-scrollbar { display: none; }

  /* 2. 가로 페이지 넘김 모드 */
  #editor-container.mode-page {
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: row;
    justify-content: flex-start;
  }
  #editor-container.mode-page::-webkit-scrollbar { display: none; }

  #editor-wrapper {
    position: relative;
    width: 100%;
    max-width: var(--content-max-width);
    min-height: 100%;
    pointer-events: none;
    margin: 0 auto;
  }

  /* 페이지 모드 시 페이징 컨테이너 */
  #editor-pages-wrapper {
    display: none;
    width: 100%;
    height: 100%;
    pointer-events: auto;
  }
  #editor-container.mode-page #editor-wrapper {
    display: none;
  }
  #editor-container.mode-page #editor-pages-wrapper {
    display: flex;
    flex-direction: row;
    height: 100%;
    width: 100%;
  }

  .editor-page-card {
    flex: 0 0 100%;
    width: 100%;
    max-width: var(--content-max-width);
    height: 100%;
    scroll-snap-align: center;
    position: relative;
    padding: 0 16px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    box-sizing: border-box;
  }

  .editor-page-card-header {
    width: 100%;
    text-align: right;
    padding: 6px 16px 2px 0;
    font-size: 12px;
    font-weight: bold;
    color: #777;
    user-select: none;
    font-family: var(--ui-font) !important;
  }

  .editor-page-card-inner {
    width: 100%;
    height: var(--slide-fixed-height);
    overflow: hidden;
    position: relative;
    background-color: #000000;
    border: 1px dashed rgba(255, 255, 255, 0.25);
    border-radius: 8px;
    box-sizing: border-box;
  }

  /* 눈금선 레이어 */
  #slide-indicators-layer {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    pointer-events: none !important;
    user-select: none;
    z-index: 1;
  }

  .slide-boundary {
    position: absolute;
    left: 0;
    right: 0;
    height: 1px;
    border-bottom: 2px dashed rgba(255, 255, 255, 0.35);
    display: flex;
    justify-content: flex-end;
    align-items: center;
    pointer-events: none !important;
  }

  .slide-boundary-badge {
    background-color: #1a1a1a;
    border: 1px solid #666;
    color: #d1d5db;
    font-size: 13px;
    font-weight: bold;
    padding: 2px 10px;
    border-radius: 10px;
    transform: translateY(-50%);
    margin-right: 20px;
    pointer-events: none !important;
    font-family: var(--ui-font) !important;
  }

  /* 단일 통합 에디터 본문 */
  #main-editor {
    position: relative;
    z-index: 2;
    width: 100%;
    min-height: 100%;
    background-color: transparent;
    padding: var(--top-margin) var(--content-padding-x) 24px var(--content-padding-x);
    outline: none;
    font-size: var(--font-size);
    line-height: var(--line-height);
    font-weight: 500;
    word-break: keep-all;
    letter-spacing: normal;
    color: #ffffff;
    white-space: pre-wrap;
    box-sizing: border-box;
    pointer-events: auto;
  }

  #editor-bottom-spacer {
    height: calc(100vh - 140px);
    pointer-events: none;
  }

  body.paint-mode #main-editor {
    cursor: crosshair;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 퀵스크롤러 */
  #quick-scrollbar-track {
    position: fixed;
    top: calc(var(--toolbar-height) + 10px);
    right: 6px;
    bottom: 20px;
    width: 28px;
    z-index: 99998;
    display: flex;
    justify-content: center;
    user-select: none;
    touch-action: none;
    pointer-events: auto;
  }
  #quick-scrollbar-thumb {
    position: absolute;
    top: 0;
    width: 8px;
    height: 60px;
    background: rgba(160, 160, 160, 0.45);
    border: 1px solid rgba(220, 220, 220, 0.6);
    border-radius: 8px;
    cursor: grab;
    box-shadow: 0 0 6px rgba(0,0,0,0.8);
    transition: width 0.1s ease, background 0.1s ease;
  }
  #quick-scrollbar-thumb:active, #quick-scrollbar-track.dragging #quick-scrollbar-thumb {
    width: 16px;
    background: rgba(220, 220, 220, 0.85);
    border-color: #ffffff;
    cursor: grabbing;
  }
  #quick-scroll-badge {
    position: fixed;
    right: 44px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(26, 26, 26, 0.95);
    border: 1px solid #666;
    color: #e5e5e5;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 15px;
    font-weight: bold;
    z-index: 99999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
    box-shadow: 0 4px 16px rgba(0,0,0,0.7);
    font-family: var(--ui-font) !important;
  }
  #quick-scroll-badge.show { opacity: 1; }

  /* 전체화면 슬라이드 뷰포트 */
  #reader-container {
    display: none;
    height: 100vh;
    width: 100vw;
    position: fixed;
    top: 0;
    left: 0;
    background-color: #000000;
    z-index: 10000000;
    user-select: none;
    overflow: hidden;
  }

  #reader-box {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    pointer-events: none;
  }

  #reader-viewport {
    width: 100%;
    max-width: var(--content-max-width);
    height: 100%;
    overflow: hidden !important;
    position: relative;
    box-sizing: border-box;
  }

  .slide-page {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    padding: var(--top-margin) var(--content-padding-x) 24px var(--content-padding-x);
    font-size: var(--font-size);
    line-height: var(--line-height);
    font-weight: 500;
    word-break: keep-all;
    letter-spacing: normal;
    color: #ffffff;
    white-space: pre-wrap;
    box-sizing: border-box;
    display: none;
    overflow: hidden;
  }
  .slide-page.active {
    display: block;
  }

  /* 전체화면 좌/우 반쪽 터치 네비게이션 */
  .touch-zone {
    position: absolute; top: 0; bottom: 0; width: 50%; z-index: 3000;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  #touch-left { left: 0; }
  #touch-right { right: 0; }

  #exit-btn {
    position: absolute; top: 18px; right: 24px;
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(45, 45, 45, 0.75); border: 1px solid #777;
    color: #fff; font-size: 22px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    z-index: 5000; cursor: pointer; padding: 0;
    font-family: var(--ui-font) !important;
  }
  #exit-btn:active { background: rgba(239, 68, 68, 0.9); }

  #page-info {
    position: absolute; top: 18px; left: 24px; font-size: 15px;
    background: rgba(30, 30, 30, 0.75); padding: 5px 14px; border-radius: 12px;
    color: #ffb703; font-weight: bold; z-index: 5000; user-select: none; pointer-events: none;
    border: 1px solid #333;
    font-family: var(--ui-font) !important;
  }

  #toast-msg {
    position: fixed;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(34, 34, 34, 0.92);
    color: #38bdf8;
    border: 1px solid #444;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 99999999;
    font-family: var(--ui-font) !important;
  }
  #toast-msg.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .modal-backdrop {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background-color: rgba(0, 0, 0, 0.85);
    z-index: 20000000;
    justify-content: center;
    align-items: center;
    font-family: var(--ui-font) !important;
  }
  .modal-box {
    width: 90%; max-width: 950px; height: 82vh;
    background-color: #1a1a1a;
    border: 1px solid #383838;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    font-family: var(--ui-font) !important;
  }
  .modal-header {
    padding: 16px 20px;
    background-color: #222;
    border-bottom: 1px solid #333;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header h3 { font-size: 18px; color: #f3f4f6; font-weight: 600; }
  .modal-close {
    background: transparent; border: none; font-size: 20px; color: #888; cursor: pointer; width: 32px; height: 32px; padding: 0;
  }
  .modal-close:active { color: #fff; }
  
  #doc-grid {
    flex: 1;
    padding: 24px;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 18px;
    align-content: start;
  }
  .doc-card {
    background-color: #242424;
    border: 1px solid #383838;
    border-radius: 10px;
    padding: 16px;
    cursor: pointer;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 140px;
    transition: all 0.15s ease;
  }
  .doc-card:active { transform: scale(0.98); border-color: #38bdf8; background-color: #2a2a2a; }
  .doc-title {
    font-size: 16px; font-weight: bold; color: #f3f4f6;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.4;
    margin-bottom: 8px;
  }
  .doc-preview {
    font-size: 13px; color: #9ca3af; line-height: 1.4;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 12px;
  }
  .doc-footer {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: #6b7280; border-top: 1px solid #2e2e2e; padding-top: 8px;
  }
  .doc-del-btn {
    position: absolute; top: 10px; right: 10px;
    width: 22px; height: 22px; background: rgba(0,0,0,0.5);
    border: 1px solid #444; border-radius: 4px; color: #888;
    font-size: 12px; display: inline-flex; align-items: center; justify-content: center;
  }
  .doc-del-btn:active { background: #ef4444; color: #fff; }

  .modal-footer {
    padding: 12px 20px;
    background-color: #222;
    border-top: 1px solid #333;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* 인쇄 스타일 */
  #print-container { display: none; }

  @media print {
    @page { margin: 18mm 15mm; size: auto; }
    html, body {
      position: static !important; overflow: visible !important;
      background-color: #ffffff !important; color: #000000 !important;
      height: auto !important; width: auto !important;
    }
    #toolbar, #editor-container, #reader-container, #storage-modal, #toast-msg, #quick-scrollbar-track, #quick-scroll-badge {
      display: none !important;
    }
    #print-container {
      display: block !important; width: 100% !important; background-color: #ffffff !important;
    }
    .print-slide-page {
      page-break-after: always !important; break-after: page !important;
      position: relative !important; padding: 10px 0 30px 0 !important;
      box-sizing: border-box !important;
    }
    .print-slide-page:last-child {
      page-break-after: avoid !important; break-after: avoid !important;
    }
    .print-slide-header {
      text-align: right; font-size: 11pt; font-weight: bold; color: #777777;
      margin-bottom: 15px; border-bottom: 1px solid #dddddd; padding-bottom: 4px;
      font-family: var(--ui-font) !important;
    }
    .print-slide-body {
      font-size: 18pt !important; line-height: 1.5 !important; font-weight: 500 !important;
      word-break: keep-all !important; color: #000000 !important; white-space: pre-wrap !important;
    }
  }
</style>
</head>
<body>

<div id="toolbar">
  <!-- 1단: 자간(수축: →← / 확장: ←→) / 줄간격(수축/확장) / 눈금(1:86%, 2:72%) / 글꼴 이름 / 흑백 뷰모드 아이콘 -->
  <div class="toolbar-row toolbar-row-top">
    <!-- 1. 자간 좁게: 바깥에서 안쪽으로 모여드는 화살표 (→ ←) -->
    <button class="btn-format" onmousedown="event.preventDefault()" onclick="adjustLetterSpacing(-0.5)" title="자간 좁게">
      <svg class="icon-svg" viewBox="0 0 24 24" style="width: 15px; height: 15px;">
        <line x1="3" y1="12" x2="9" y2="12"></line>
        <polyline points="6 9 9 12 6 15"></polyline>
        <line x1="21" y1="12" x2="15" y2="12"></line>
        <polyline points="18 9 15 12 18 15"></polyline>
      </svg>
    </button>
    <!-- 2. 자간 넓게: 안쪽에서 바깥으로 뻗어나가는 화살표 (← →) -->
    <button class="btn-format" onmousedown="event.preventDefault()" onclick="adjustLetterSpacing(0.5)" title="자간 넓게">
      <svg class="icon-svg" viewBox="0 0 24 24" style="width: 15px; height: 15px;">
        <line x1="9" y1="12" x2="3" y2="12"></line>
        <polyline points="6 9 3 12 6 15"></polyline>
        <line x1="15" y1="12" x2="21" y2="12"></line>
        <polyline points="18 9 21 12 18 15"></polyline>
      </svg>
    </button>

    <div class="format-divider"></div>

    </div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js?v=' + Date.now()).then(reg => {
        reg.update();
      }).catch(() => {});
    });
  }

  const FONT_OPTIONS = [
    { name: "KoPub돋움", family: "'KoPubWorld Dotum', sans-serif" },
    { name: "KoPub바탕", family: "'KoPubWorld Batang', serif" },
    { name: "Pretendard", family: "'Pretendard', sans-serif" },
    { name: "시스템기본", family: "-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" }
  ];
  let currentFontIndex = 0;

  // 1번(기본): 86% / 2번: 72%
  const RATIO_STEPS = [0.86, 0.72];
  const TOOLBAR_HEIGHT = 96;
  let heightStepIndex = 0;
  
  let currentContentStepHeight = 650;
  let currentTopMargin = 87;
  let currentSlideHeight = 740;

  let isReaderMode = false;
  let isContinuousMode = false;
  let isMouseDown = false;
  let lastPaintedKey = "";
  let activeColor = '#ef4444';
  let currentFontSize = 30;
  let totalSlideCount = 1;
  let currentPageIndex = 0;
  let savedSelectionRange = null;

  let editorViewMode = 'scroll';

  const editor = document.getElementById('main-editor');
  const editorContainer = document.getElementById('editor-container');
  const editorPagesWrapper = document.getElementById('editor-pages-wrapper');
  const indicatorsLayer = document.getElementById('slide-indicators-layer');
  const scrollTrack = document.getElementById('quick-scrollbar-track');
  const scrollThumb = document.getElementById('quick-scrollbar-thumb');
  const scrollBadge = document.getElementById('quick-scroll-badge');
  const readerViewport = document.getElementById('reader-viewport');
  const btnSlideHeight = document.getElementById('btn-slide-height');
  const btnFontCycle = document.getElementById('btn-font-cycle');
  const iconViewMode = document.getElementById('icon-view-mode');

  let historyStack = [];
  const MAX_HISTORY = 40;

  function pushHistory() {
    try {
      const current = editor.innerHTML;
      if (historyStack.length === 0 || historyStack[historyStack.length - 1] !== current) {
        historyStack.push(current);
        if (historyStack.length > MAX_HISTORY) historyStack.shift();
      }
    } catch(e){}
  }

  function undoState() {
    try {
      if (historyStack.length > 1) {
        historyStack.pop();
        const prev = historyStack[historyStack.length - 1];
        editor.innerHTML = prev;
        saveEditorContent();
        updateSlideIndicators();
        updateScrollThumbPosition();
        if (editorViewMode === 'page') renderEditorPages();
        showQuickToast("↶ 되돌리기가 적용되었습니다");
      } else if (document.execCommand) {
        document.execCommand('undo', false, null);
        saveEditorContent();
        updateSlideIndicators();
        if (editorViewMode === 'page') renderEditorPages();
      }
    } catch(e){}
  }

  function saveCurrentSelection() {
    try {
      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0 && !sel.isCollapsed) {
        const range = sel.getRangeAt(0);
        if (editor.contains(range.commonAncestorContainer)) {
          savedSelectionRange = range.cloneRange();
        }
      }
    } catch(e){}
  }

  document.addEventListener('selectionchange', () => {
    if (document.activeElement === editor || editor.contains(document.activeElement)) {
      saveCurrentSelection();
    }
  });

  /* 에디터 세로 스크롤 ↔ 가로 페이지 넘김 모드 전환 */
  function toggleEditorViewMode() {
    if (editorViewMode === 'scroll') {
      editorViewMode = 'page';
      editorContainer.classList.remove('mode-scroll');
      editorContainer.classList.add('mode-page');
      if (iconViewMode) {
        iconViewMode.innerHTML = '<rect x="4" y="2" width="16" height="20" rx="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="8" y1="10" x2="16" y2="10"></line><line x1="8" y1="14" x2="16" y2="14"></line><line x1="8" y1="18" x2="16" y2="18"></line>';
      }
      scrollTrack.style.display = 'none';
      renderEditorPages();
      showQuickToast("📄 페이지 넘김 모드 (가로 스와이프)");
    } else {
      editorViewMode = 'scroll';
      editorContainer.classList.remove('mode-page');
      editorContainer.classList.add('mode-scroll');
      if (iconViewMode) {
        iconViewMode.innerHTML = '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>';
      }
      scrollTrack.style.display = 'flex';
      updateSlideIndicators();
      updateScrollThumbPosition();
      showQuickToast("📜 세로 스크롤 모드");
    }
  }

  /* 모든 페이지가 연속적으로 연결되는 실시간 페이지 뷰 렌더링 */
  function renderEditorPages() {
    if (!editorPagesWrapper) return;
    editorPagesWrapper.innerHTML = '';

    const { count } = getAccurateSlideMetrics();
    totalSlideCount = count;

    for (let i = 0; i < totalSlideCount; i++) {
      const pageCard = document.createElement('div');
      pageCard.className = 'editor-page-card';

      const header = document.createElement('div');
      header.className = 'editor-page-card-header';
      header.innerText = `[ ${i + 1} / ${totalSlideCount} ]`;

      const inner = document.createElement('div');
      inner.className = 'editor-page-card-inner';
      
      const pageView = document.createElement('div');
      pageView.contentEditable = "true";
      pageView.spellcheck = false;
      pageView.style.position = 'absolute';
      pageView.style.top = `-${currentContentStepHeight * i}px`;
      pageView.style.left = '0';
      pageView.style.width = '100%';
      pageView.style.minHeight = '100%';
      pageView.style.padding = 'var(--top-margin) var(--content-padding-x) 24px var(--content-padding-x)';
      pageView.style.outline = 'none';
      pageView.style.fontSize = 'var(--font-size)';
      pageView.style.lineHeight = 'var(--line-height)';
      pageView.style.fontWeight = '500';
      pageView.style.wordBreak = 'keep-all';
      pageView.style.whiteSpace = 'pre-wrap';
      pageView.style.color = '#ffffff';
      pageView.innerHTML = editor.innerHTML;

      // 실시간 입력/삭제/붙여넣기 시 모든 페이지와 본문 동기화
      pageView.addEventListener('input', () => {
        editor.innerHTML = pageView.innerHTML;
        onContentModified();
        syncAllPageViews(pageView);
      });

      pageView.addEventListener('paste', handleSmartPaste);

      inner.appendChild(pageView);
      pageCard.appendChild(header);
      pageCard.appendChild(inner);
      editorPagesWrapper.appendChild(pageCard);
    }
  }

  function syncAllPageViews(sourceElement) {
    document.querySelectorAll('.editor-page-card-inner > div').forEach(pv => {
      if (pv !== sourceElement) {
        pv.innerHTML = editor.innerHTML;
      }
    });
  }

  function onContentModified() {
    pushHistory();
    saveEditorContent();
    updateSlideIndicators();
    updateScrollThumbPosition();
  }

  /* 텍스트 노드 분할 스타일 주입 엔진 */
  function applyFontToRange(range, fontFamily) {
    if (!range || range.collapsed) return;

    if (range.startContainer === range.endContainer && range.startContainer.nodeType === Node.TEXT_NODE) {
      const textNode = range.startContainer;
      const span = document.createElement('span');
      span.style.fontFamily = fontFamily;

      const subRange = range.cloneRange();
      const extracted = subRange.extractContents();
      span.appendChild(extracted);
      subRange.insertNode(span);

      const newRange = document.createRange();
      newRange.selectNodeContents(span);
      return newRange;
    }

    const treeWalker = document.createTreeWalker(
      range.commonAncestorContainer,
      NodeFilter.SHOW_TEXT,
      {
        acceptNode: function(node) {
          if (range.intersectsNode(node)) {
            return NodeFilter.FILTER_ACCEPT;
          }
          return NodeFilter.FILTER_REJECT;
        }
      }
    );

    const nodesToWrap = [];
    while (treeWalker.nextNode()) {
      nodesToWrap.push(treeWalker.currentNode);
    }

    if (nodesToWrap.length === 0) return range;

    let firstCreatedSpan = null;
    let lastCreatedSpan = null;

    nodesToWrap.forEach((node) => {
      let start = (node === range.startContainer) ? range.startOffset : 0;
      let end = (node === range.endContainer) ? range.endOffset : node.textContent.length;

      if (start >= end) return;

      const subRange = document.createRange();
      subRange.setStart(node, start);
      subRange.setEnd(node, end);

      const span = document.createElement('span');
      span.style.fontFamily = fontFamily;

      const extracted = subRange.extractContents();
      span.appendChild(extracted);
      subRange.insertNode(span);

      if (!firstCreatedSpan) firstCreatedSpan = span;
      lastCreatedSpan = span;
    });

    const newRange = document.createRange();
    if (firstCreatedSpan && lastCreatedSpan) {
      newRange.setStartBefore(firstCreatedSpan);
      newRange.setEndAfter(lastCreatedSpan);
    }
    return newRange;
  }

  function cycleSelectedFontFamily() {
    const sel = window.getSelection();
    let range = (sel && sel.rangeCount > 0 && !sel.isCollapsed) 
                ? sel.getRangeAt(0) 
                : savedSelectionRange;

    if (!range || range.collapsed) {
      showQuickToast("⚠️ 텍스트를 먼저 드래그하세요");
      return;
    }

    currentFontIndex = (currentFontIndex + 1) % FONT_OPTIONS.length;
    const targetFont = FONT_OPTIONS[currentFontIndex];
    if (btnFontCycle) btnFontCycle.innerText = targetFont.name;

    const currentScroll = editorContainer.scrollTop;
    pushHistory();

    const newRange = applyFontToRange(range, targetFont.family);

    if (newRange) {
      sel.removeAllRanges();
      sel.addRange(newRange);
      savedSelectionRange = newRange.cloneRange();
    }

    if (editorViewMode === 'page') {
      const activeEl = document.activeElement;
      if (activeEl && activeEl.innerHTML) {
        editor.innerHTML = activeEl.innerHTML;
        syncAllPageViews(activeEl);
      }
    }

    editorContainer.scrollTop = currentScroll;
    pushHistory();
    saveEditorContent();
    updateSlideIndicators();
    if (editorViewMode === 'page') renderEditorPages();
    showQuickToast(`글꼴: ${targetFont.name}`);
  }

  async function shareSelectedText() {
    let shareText = '';
    const sel = window.getSelection();
    
    if (sel && !sel.isCollapsed && sel.toString().trim() !== '') {
      shareText = sel.toString().trim();
    } else if (savedSelectionRange && !savedSelectionRange.collapsed) {
      shareText = savedSelectionRange.toString().trim();
    } else {
      shareText = editor.innerText.trim();
    }

    if (!shareText) {
      showQuickToast("⚠️ 공유할 텍스트가 없습니다");
      return;
    }

    const firstLine = shareText.split('\n')[0].substring(0, 30);
    const shareData = {
      title: firstLine || 'Yslide 원고 공유',
      text: shareText
    };

    if (navigator.share) {
      try {
        await navigator.share(shareData);
        showQuickToast("📤 공유가 완료되었습니다");
      } catch (err) {
        if (err.name !== 'AbortError') {
          copyTextFallback(shareText);
        }
      }
    } else {
      copyTextFallback(shareText);
    }
  }

  function copyTextFallback(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        showQuickToast("📋 텍스트가 클립보드에 복사되었습니다");
      }).catch(() => {
        showQuickToast("⚠️ 복사에 실패했습니다");
      });
    } else {
      showQuickToast("📋 공유 기능을 지원하지 않는 브라우저입니다");
    }
  }

  /* 2단계 눈금선 토글 (1: 기본 86% / 2: 72%) */
  function cycleSlideHeightStep() {
    heightStepIndex = (heightStepIndex + 1) % 2;
    applySlideHeightByStep(heightStepIndex, true);
  }

  function applySlideHeightByStep(step, showToast = false) {
    const vh = window.innerHeight || document.documentElement.clientHeight || 1000;
    const availableEditorHeight = Math.max(480, vh - TOOLBAR_HEIGHT);
    const ratio = RATIO_STEPS[step] || 0.86;

    currentSlideHeight = Math.round(availableEditorHeight * ratio);
    currentTopMargin = Math.round(currentFontSize * 1.45 * 2.2);
    currentContentStepHeight = Math.max(280, currentSlideHeight - currentTopMargin);

    if (step === 0) {
      if (btnSlideHeight) btnSlideHeight.innerText = "📏 1";
      if (showToast) showQuickToast(`눈금: 1단계 기본 (${currentSlideHeight}px / 86%)`);
    } else {
      if (btnSlideHeight) btnSlideHeight.innerText = "📏 2";
      if (showToast) showQuickToast(`눈금: 2단계 (${currentSlideHeight}px / 72%)`);
    }

    document.documentElement.style.setProperty('--slide-fixed-height', currentSlideHeight + 'px');
    document.documentElement.style.setProperty('--top-margin', currentTopMargin + 'px');

    try { localStorage.setItem('yslide_height_step', step); } catch(e){}
    updateSlideIndicators();
    updateScrollThumbPosition();
    if (editorViewMode === 'page') renderEditorPages();
  }

  window.addEventListener('resize', () => {
    if (!isReaderMode) {
      applySlideHeightByStep(heightStepIndex, false);
    }
  });

  function adjustLetterSpacing(delta) {
    try {
      const sel = window.getSelection();
      let range = (sel && sel.rangeCount > 0 && !sel.isCollapsed) 
                  ? sel.getRangeAt(0) 
                  : savedSelectionRange;
      if (!range || range.collapsed) {
        showQuickToast("⚠️ 텍스트를 먼저 드래그하세요");
        return;
      }

  function adjustLineHeight(delta) {

  function paintWordAtPoint(x, y) {
    let range;
    if (document.caretRangeFromPoint) {
      range = document.caretRangeFromPoint(x, y);
    } else if (document.caretPositionFromPoint) {
      const pos = document.caretPositionFromPoint(x, y);
      if (pos) {
        range = document.createRange();
        range.setStart(pos.offsetNode, pos.offset);
        range.collapse(true);
      }
    }

    if (!range) return;

    let node = range.startContainer;
    if (node.nodeType !== Node.TEXT_NODE) {
      if (node.childNodes.length > 0 && range.startOffset < node.childNodes.length) {
        node = node.childNodes[range.startOffset];
        while (node && node.nodeType !== Node.TEXT_NODE && node.firstChild) {
          node = node.firstChild;
        }
      }
    }

    if (node && node.nodeType === Node.TEXT_NODE) {
      const text = node.textContent;
      const offset = range.startOffset;

      let start = Math.min(offset, text.length > 0 ? text.length - 1 : 0);
      while (start > 0 && !/\s/.test(text[start - 1])) start--;
      let end = offset;
      while (end < text.length && !/\s/.test(text[end])) end++;

      if (start < end) {
        const currentKey = `${node.textContent}_${start}_${end}`;
        if (lastPaintedKey === currentKey) return;
        lastPaintedKey = currentKey;

        const wordRange = document.createRange();
        wordRange.setStart(node, start);
        wordRange.setEnd(node, end);

        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(wordRange);

        document.execCommand('foreColor', false, activeColor);
        sel.removeAllRanges();

        if (editorViewMode === 'page') {
          const activeEl = document.activeElement;
          if (activeEl && activeEl.innerHTML) {
            editor.innerHTML = activeEl.innerHTML;
            syncAllPageViews(activeEl);
          }
        }
      }
    }
  }

  function rgbToHex(rgb) {
    if (!rgb) return '';
    if (rgb.startsWith('#')) return rgb;
    const match = rgb.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
    if (!match) return rgb;
    const r = parseInt(match[1]).toString(16).padStart(2, '0');
    const g = parseInt(match[2]).toString(16).padStart(2, '0');
    const b = parseInt(match[3]).toString(16).padStart(2, '0');
    return `#${r}${g}${b}`;
  }

  function isDefaultDarkColor(colorStr) {
    if (!colorStr) return true;
    const hex = rgbToHex(colorStr).toLowerCase();
    if (['#000000', '#111111', '#202124', '#222222', '#333333', '#1e1e1e', '#000', '#202020', 'transparent', 'inherit', 'initial'].includes(hex)) return true;
    const match = colorStr.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
    if (match) {
      const r = parseInt(match[1]), g = parseInt(match[2]), b = parseInt(match[3]);
      if (r < 45 && g < 45 && b < 45) return true;
    }
    return false;
  }

  function insertHtmlAtCaret(html) {
    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0) {
      let range = sel.getRangeAt(0);
      range.deleteContents();
      
      const el = document.createElement("div");
      el.innerHTML = html;
      const frag = document.createDocumentFragment();
      let node, lastNode;
      while ((node = el.firstChild)) {
        lastNode = frag.appendChild(node);
      }
      range.insertNode(frag);
      if (lastNode) {
        range = range.cloneRange();
        range.setStartAfter(lastNode);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
      }
    } else {
      editor.innerHTML += html;
    }
  }

  /* 긴 텍스트 붙여넣기 시 모든 페이지와 연결되는 스마트 붙여넣기 */
  function handleSmartPaste(e) {
    e.preventDefault();
    pushHistory();

    const clipboardData = e.clipboardData || window.clipboardData;
    const htmlData = clipboardData ? clipboardData.getData('text/html') : '';
    const textData = clipboardData ? clipboardData.getData('text/plain') : '';

    if (htmlData) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlData, 'text/html');

      doc.querySelectorAll('script, style, meta, link, svg, title').forEach(el => el.remove());

      function processNode(node, inheritedColor = '', inheritedFont = '') {
        if (node.nodeType === Node.TEXT_NODE) {
          const text = node.textContent;
          if (!text) return '';
          let output = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
          if (inheritedColor && !isDefaultDarkColor(inheritedColor)) {
            const hex = rgbToHex(inheritedColor);
            output = `<font color="${hex}">${output}</font>`;
          }
          if (inheritedFont) {
            output = `<span style="font-family:${inheritedFont}">${output}</span>`;
          }
          return output;
        }

        if (node.nodeType === Node.ELEMENT_NODE) {
          const tag = node.tagName.toLowerCase();
          if (tag === 'br') return '<br>';

          let curColor = node.style.color || node.getAttribute('color') || inheritedColor;
          let curFont = node.style.fontFamily || inheritedFont;

          let inner = '';
          node.childNodes.forEach(child => {
            inner += processNode(child, curColor, curFont);
          });

          if (tag === 'p' || tag === 'div' || tag === 'li' || tag === 'tr') {
            return inner + '<br>';
          }
          if (tag === 'b' || tag === 'strong' || node.style.fontWeight >= '600') {
            return `<b>${inner}</b>`;
          }
          if (tag === 'i' || tag === 'em' || node.style.fontStyle === 'italic') {
            return `<i>${inner}</i>`;
          }
          if (tag === 'u' || (node.style.textDecoration && node.style.textDecoration.includes('underline'))) {
            return `<u>${inner}</u>`;
          }
          return inner;
        }
        return '';
      }

      let finalHtml = '';
      doc.body.childNodes.forEach(child => {
        finalHtml += processNode(child, '', '');
      });

      finalHtml = finalHtml.replace(/(<br\s*[\/]?>){3,}/gi, '<br><br>');
      insertHtmlAtCaret(finalHtml);
    } else {
      const formattedText = textData.replace(/\r\n/g, '<br>').replace(/\n/g, '<br>');
      insertHtmlAtCaret(formattedText);
    }

    if (editorViewMode === 'page') {
      const activeEl = document.activeElement;
      if (activeEl && activeEl.innerHTML) {
        editor.innerHTML = activeEl.innerHTML;
        syncAllPageViews(activeEl);
      }
    }

    setTimeout(() => {
      onContentModified();
      if (editorViewMode === 'page') renderEditorPages();
    }, 20);
  }

  async function translateWithGemini() {
    const content = editor.innerHTML.trim();
    const plainText = editor.innerText.trim();

    if (!plainText) {
      showQuickToast("⚠️ 번역할 내용이 없습니다.");
      return;
    }

    let apiKey = localStorage.getItem('yslide_gemini_api_key');
    if (!apiKey) {
      apiKey = prompt("Google Gemini API 키를 입력해주세요 (최초 1회 저장):");
      if (!apiKey || !apiKey.trim()) return;
      localStorage.setItem('yslide_gemini_api_key', apiKey.trim());
    }

    const hasKorean = /[가-힣]/.test(plainText);
    const targetLang = hasKorean ? "English" : "Korean";
    const promptText = `You are a professional sermon and text translator. Translate the provided HTML content directly into natural, dignified, reader-centered ${targetLang}. 
Crucial Rules:
1. Maintain all original HTML tags (like <font color="...">, <span style="...">, <div>, <br>) and their exact styling perfectly.
2. Only translate the human readable text content inside tags.
3. Keep line breaks, paragraph structure, and emphasis intact.
4. Output ONLY the raw translated HTML without any markdown formatting or code block wrappers (\`\`\`html).

HTML Content to Translate:
${content}`;

    showQuickToast(`🌐 Gemini가 ${targetLang}(으)로 번역 중입니다...`);

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptText }] }]
        })
      });

      const resData = await response.json();

      if (resData.error) {
        if (resData.error.code === 400 || resData.error.message.includes("API key")) {
          localStorage.removeItem('yslide_gemini_api_key');
          alert("API 키가 올바르지 않습니다. 다시 확인해주세요.");
        } else {
          alert("번역 오류: " + resData.error.message);
        }
        return;
      }

      let translatedHtml = resData.candidates?.[0]?.content?.parts?.[0]?.text;
      if (translatedHtml) {
        translatedHtml = translatedHtml.replace(/^```html\s*/i, '').replace(/\s*```$/i, '').trim();
        pushHistory();
        editor.innerHTML = translatedHtml;
        pushHistory();
        saveEditorContent();
        updateSlideIndicators();
        updateScrollThumbPosition();
        if (editorViewMode === 'page') renderEditorPages();
        showQuickToast(`✨ ${targetLang}(으)로 번역이 완료되었습니다!`);
      } else {
        showQuickToast("⚠️ 번역 결과를 받지 못했습니다.");
      }
    } catch (err) {
      alert("네트워크 오류로 번역에 실패했습니다: " + err.message);
    }
  }

      try {
        const fileHandle = await window.showSaveFilePicker({
          suggestedName: defaultFilename,
          types: [{
            description: '텍스트 파일 (.txt, .json)',
            accept: { 'text/plain': ['.txt', '.json'] }
          }]
        });
        const writable = await fileHandle.createWritable();
        await writable.write(content);
        await writable.close();
        showQuickToast("💾 파일이 저장되었습니다");
        return;
      } catch (err) {
        if (err.name === 'AbortError') return;
      }
    }

    const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = defaultFilename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(link.href);
    showQuickToast("💾 파일이 저장되었습니다");
  }

  function handleFiles(files) {
    if (!files || files.length === 0) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const raw = e.target.result;
      try {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) {
          editor.innerHTML = parsed.join('<br>');
          pushHistory();
          saveEditorContent();
          updateSlideIndicators();
          updateScrollThumbPosition();
          if (editorViewMode === 'page') renderEditorPages();
          saveDocumentToArchive(editor.innerHTML);
          showQuickToast("📂 파일을 불러왔습니다");
          return;
        }
      } catch (err) {}
      editor.innerHTML = raw.replace(/\n/g, '<br>');
      pushHistory();
      saveEditorContent();
      updateSlideIndicators();
      updateScrollThumbPosition();
      if (editorViewMode === 'page') renderEditorPages();
      saveDocumentToArchive(editor.innerHTML);
      showQuickToast("📂 텍스트를 불러왔습니다");
    };
    reader.readAsText(files[0], 'utf-8');
  }

  function printSermonDocument() {
    if (editor.innerText.trim() === '') {
      showQuickToast("⚠️ 인쇄할 내용이 없습니다.");
      return;
    }

    updateSlideIndicators();
    const printContainer = document.getElementById('print-container');
    printContainer.innerHTML = '';

    const { count } = getAccurateSlideMetrics();

    for (let i = 0; i < count; i++) {
      const pageDiv = document.createElement('div');
      pageDiv.className = 'print-slide-page';

      const headerDiv = document.createElement('div');
      headerDiv.className = 'print-slide-header';
      headerDiv.innerText = `[ ${i + 1} / ${count} ]`;

      const viewWrap = document.createElement('div');
      viewWrap.style.height = `${currentContentStepHeight}px`;
      viewWrap.style.overflow = 'hidden';
      viewWrap.style.position = 'relative';

      const canvasCopy = document.createElement('div');
      canvasCopy.className = 'print-slide-body';
      canvasCopy.innerHTML = editor.innerHTML;
      canvasCopy.style.position = 'absolute';
      canvasCopy.style.top = `-${currentContentStepHeight * i}px`;
      canvasCopy.style.left = '0';
      canvasCopy.style.width = '100%';
      canvasCopy.style.padding = '0 var(--content-padding-x)';

      viewWrap.appendChild(canvasCopy);
      pageDiv.appendChild(headerDiv);
      pageDiv.appendChild(viewWrap);
      printContainer.appendChild(pageDiv);
    }

    window.print();
  }

  /* 전체화면 슬라이드 DOM 생성 엔진 */
  function renderReaderSlides() {
    if (!readerViewport) return;
    readerViewport.innerHTML = '';
    
    const { count } = getAccurateSlideMetrics();
    totalSlideCount = count;

    for (let i = 0; i < totalSlideCount; i++) {
      const slide = document.createElement('div');
      slide.className = `slide-page ${i === currentPageIndex ? 'active' : ''}`;
      slide.id = `slide-page-${i}`;
      
      const innerWrap = document.createElement('div');
      innerWrap.style.position = 'relative';
      innerWrap.style.height = `${currentContentStepHeight}px`;
      innerWrap.style.overflow = 'hidden';
      
      const content = document.createElement('div');
      content.style.position = 'absolute';
      content.style.top = `-${currentContentStepHeight * i}px`;
      content.style.left = '0';
      content.style.width = '100%';
      content.innerHTML = editor.innerHTML;
      
      innerWrap.appendChild(content);
      slide.appendChild(innerWrap);
      readerViewport.appendChild(slide);
    }
  }

  function startSermonMode(targetPageIndex = 0) {
    if (editor.innerText.trim() === '') return;

    currentPageIndex = Math.min(Math.max(0, targetPageIndex), totalSlideCount - 1);
    renderReaderSlides();
    updateReaderUI();

    document.getElementById('reader-container').style.display = 'block';
    isReaderMode = true;

    try {
      const docEl = document.documentElement;
      if (docEl.requestFullscreen) docEl.requestFullscreen().catch(()=>{});
      else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
    } catch(e){}
  }

  function startPreviewCurrentSlide() {
    let currentSlideIndex = 0;
    if (editorViewMode === 'page') {
      const scrollLeft = editorContainer.scrollLeft;
      const width = editorContainer.clientWidth || 1;
      currentSlideIndex = Math.round(scrollLeft / width);
    } else {
      const currentViewY = editorContainer.scrollTop;
      currentSlideIndex = Math.max(0, Math.floor(currentViewY / currentContentStepHeight));
    }
    startSermonMode(currentSlideIndex);
  }

  function exitSermonMode() {
    document.getElementById('reader-container').style.display = 'none';
    isReaderMode = false;

    try {
      if (document.exitFullscreen && document.fullscreenElement) {
        document.exitFullscreen().catch(()=>{});
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    } catch(e){}
  }

  function updateReaderUI() {
    document.querySelectorAll('.slide-page').forEach((el, idx) => {
      if (idx === currentPageIndex) el.classList.add('active');
      else el.classList.remove('active');
    });
    document.getElementById('curr-page').innerText = currentPageIndex + 1;
    document.getElementById('total-page').innerText = totalSlideCount;
  }

  function nextPage() {
    if (currentPageIndex < totalSlideCount - 1) {
      currentPageIndex++;
      updateReaderUI();
    }
  }
  function prevPage() {
    if (currentPageIndex > 0) {
      currentPageIndex--;
      updateReaderUI();
    }
  }

  /* 릿제로 2(LitZero 2) 및 키보드 이벤트 */
  window.addEventListener('keydown', (e) => {
    if (!isReaderMode) return;
    
    const nextKeys = ['ArrowRight', 'ArrowDown', ' ', 'PageDown', 'Enter', 'Space'];
    const prevKeys = ['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'];

    if (nextKeys.includes(e.key)) {
      e.preventDefault();
      nextPage();
    } else if (prevKeys.includes(e.key)) {
      e.preventDefault();
      prevPage();
    } else if (e.key === 'Escape') {
      exitSermonMode();
    }
  });

  // 초기화 함수
  function initApp() {
    try {
      const savedSize = localStorage.getItem('yslide_font_size');
      if (savedSize) {
        currentFontSize = parseInt(savedSize, 10);
      } else {
        currentFontSize = 30;
      }
      applyFontSize(currentFontSize);

      const savedStep = localStorage.getItem('yslide_height_step');
      if (savedStep !== null) {
        heightStepIndex = parseInt(savedStep, 10) % 2;
      } else {
        heightStepIndex = 0; // 기본 1번 모드 (86%)
      }
      applySlideHeightByStep(heightStepIndex, false);

      const saved = localStorage.getItem('yslide_final_v57') || localStorage.getItem('yslide_final_v56') || localStorage.getItem('yslide_final_v55') || localStorage.getItem('yslide_final_v54');
      if (saved) {
        editor.innerHTML = saved;
      }
      pushHistory();
    } catch(e){}
    updateSlideIndicators();
    updateScrollThumbPosition();
  }

  initApp();
</script>
</body>
</html>
