<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yslide Note</title>

<!-- KoPubWorld 및 웹폰트 CDN 로드 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-kopubworld@1.0.0/kopubworld.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

<style>
  :root {
    --bg-main: #0a0a0a;
    --panel-bg: #181818;
    --border-color: #333333;
    --page-bg: #141414;
    --page-border: #444444;
    --text-color: #ffffff;
    --accent: #38bdf8;
    --toolbar-height: 96px;
    --page-width: 820px;
    --page-height: 928px;
    --active-font: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
    --ui-font: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    position: fixed;
    overflow: hidden;
    background-color: var(--bg-main);
    color: var(--text-color);
    font-family: var(--ui-font);
  }

  /* 상단 2단 고정 툴바 */
  #header-toolbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: var(--toolbar-height);
    background-color: var(--panel-bg);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 16px;
    z-index: 1000;
    user-select: none;
    gap: 6px;
  }

  .toolbar-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: 40px;
    overflow-x: auto;
    white-space: nowrap;
    gap: 8px;
  }
  .toolbar-row::-webkit-scrollbar { display: none; }

  .toolbar-row-top {
    justify-content: flex-start;
    border-bottom: 1px solid #282828;
    padding-bottom: 4px;
    height: 38px;
    gap: 8px;
  }

  .tool-group {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  button {
    height: 32px;
    padding: 0 10px;
    background-color: #262626;
    border: 1px solid #484848;
    border-radius: 6px;
    color: #e5e5e5;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    flex-shrink: 0;
    transition: all 0.15s ease;
    font-family: var(--ui-font);
  }
  button:hover { background-color: #333333; }
  button:active { transform: scale(0.97); }

  .btn-icon {
    width: 32px;
    height: 32px;
    padding: 0;
  }
  .icon-svg {
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .divider {
    width: 1px;
    height: 20px;
    background-color: var(--border-color);
    margin: 0 2px;
    flex-shrink: 0;
  }

  #btn-continuous.active {
    background-color: #ea580c !important;
    border-color: #f97316 !important;
    color: #ffffff !important;
    box-shadow: 0 0 10px rgba(234, 88, 12, 0.6);
  }

  /* 색상 팔레트 */
  .color-btn {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid #555555;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.15s ease;
  }
  .color-btn.selected {
    border-color: #ffffff;
    transform: scale(1.2);
    box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
  }
  .c-white { background-color: #ffffff; }
  .c-red { background-color: #ef4444; }
  .c-yellow { background-color: #ffb703; }
  .c-blue { background-color: #38bdf8; }
  .c-green { background-color: #4ade80; }

  .btn-font {
    height: 30px;
    padding: 0 10px;
    font-size: 12px;
    font-weight: bold;
    color: #d1d5db;
    background-color: #262626;
    border: 1px solid #484848;
    border-radius: 6px;
  }

  .size-box {
    display: inline-flex;
    align-items: center;
    background-color: #262626;
    border: 1px solid #484848;
    border-radius: 6px;
    padding: 2px 4px;
    gap: 2px;
    height: 32px;
    flex-shrink: 0;
  }
  .btn-size-step {
    width: 20px;
    height: 20px;
    padding: 0;
    background: transparent;
    border: none;
    color: #cccccc;
    font-size: 14px;
  }
  #size-display {
    font-size: 13px;
    font-weight: bold;
    min-width: 20px;
    text-align: center;
    color: #38bdf8;
  }

  #file-input { display: none; }

  /* 메인 뷰포트 (세로 스크롤 모드) */
  #main-viewport {
    position: absolute;
    top: var(--toolbar-height);
    bottom: 0;
    left: 0;
    right: 0;
    background-color: var(--bg-main);
    display: flex;
    -webkit-overflow-scrolling: touch;
    transition: all 0.2s ease;
  }

  #main-viewport.view-scroll {
    overflow-y: auto;
    overflow-x: hidden;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 120px 16px;
    gap: 36px;
  }
  #main-viewport.view-scroll::-webkit-scrollbar { display: none; }

  /* 메인 뷰포트 (가로 페이지 모드 / 스와이프) */
  #main-viewport.view-page {
    overflow-x: auto;
    overflow-y: hidden;
    flex-direction: row;
    align-items: center;
    scroll-snap-type: x mandatory;
    padding: 0;
    gap: 0;
  }
  #main-viewport.view-page::-webkit-scrollbar { display: none; }

  /* 페이지 모드 시 슬라이드 카드 래퍼 */
  #main-viewport.view-page .page-wrapper {
    flex: 0 0 100vw;
    width: 100vw;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    scroll-snap-align: center;
    scroll-snap-stop: always;
    box-sizing: border-box;
    padding: 16px;
  }

  /* 페이지 시트 카드 */
  .note-page-card {
    width: 100%;
    max-width: var(--page-width);
    height: var(--page-height);
    background-color: var(--page-bg);
    border: 2px solid var(--page-border);
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.05);
    position: relative;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }

  .page-header {
    height: 42px;
    background-color: #1a1a1a;
    border-bottom: 1px solid #333333;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    font-size: 13px;
    font-weight: bold;
    color: #888888;
    user-select: none;
    flex-shrink: 0;
  }

  .page-del-btn {
    background: transparent;
    border: none;
    color: #777777;
    font-size: 13px;
    cursor: pointer;
    padding: 4px 8px;
    height: auto;
  }
  .page-del-btn:hover { color: #ef4444; }

  /* 텍스트 편집 영역 */
  .page-editor {
    flex: 1;
    width: 100%;
    height: calc(100% - 42px);
    padding: 32px 44px;
    color: #ffffff;
    font-size: 26px;
    line-height: 1.55;
    outline: none;
    white-space: pre-wrap;
    word-break: keep-all;
    overflow: hidden;
    cursor: text;
    font-family: var(--active-font);
    box-sizing: border-box;
  }

  .page-editor.is-placeholder {
    color: #666666 !important;
  }

  body.paint-mode .page-editor {
    cursor: crosshair !important;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 하단 고정 독 */
  #bottom-dock {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(26, 26, 26, 0.92);
    border: 1px solid #444444;
    padding: 6px 18px;
    border-radius: 30px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
    z-index: 1000;
    backdrop-filter: blur(8px);
  }
  #page-info { font-size: 13px; font-weight: bold; color: #d1d5db; }

  /* 전체화면 슬라이드 뷰포트 */
  #reader-container {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background-color: #000000;
    z-index: 5000;
    user-select: none;
    overflow: hidden;
  }

  #reader-viewport {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .slide-sheet {
    width: 100%;
    max-width: var(--page-width);
    height: var(--page-height);
    background-color: var(--page-bg);
    border: 1px solid #383838;
    border-radius: 8px;
    padding: 32px 44px;
    color: #ffffff;
    font-size: 26px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: keep-all;
    overflow: hidden;
    display: none;
    box-sizing: border-box;
    font-family: var(--active-font);
  }
  .slide-sheet.active { display: block; }

  .touch-zone {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50%;
    cursor: pointer;
    z-index: 5500;
    -webkit-tap-highlight-color: transparent;
  }
  #touch-left { left: 0; }
  #touch-right { right: 0; }

  #exit-reader-btn {
    position: absolute; top: 18px; right: 24px;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(40, 40, 40, 0.85); border: 1px solid #666666;
    color: #ffffff; font-size: 20px; font-weight: bold;
    cursor: pointer; z-index: 6000;
  }

  #reader-page-badge {
    position: absolute; top: 22px; left: 24px;
    background: rgba(30, 30, 30, 0.85); border: 1px solid #444444;
    padding: 6px 14px; border-radius: 12px;
    color: #ffb703; font-size: 14px; font-weight: bold;
    z-index: 6000;
  }

  /* 인쇄 영역 */
  #print-area { display: none; }

  @media print {
    @page { margin: 15mm; size: auto; }
    html, body {
      position: static !important;
      overflow: visible !important;
      background-color: #ffffff !important;
      color: #000000 !important;
      height: auto !important;
    }
    #header-toolbar, #main-viewport, #bottom-dock, #reader-container, #toast {
      display: none !important;
    }
    #print-area {
      display: block !important;
      width: 100% !important;
      background: #ffffff !important;
    }
    .print-page-sheet {
      page-break-after: always !important;
      break-after: page !important;
      padding: 10px 0 20px 0;
      color: #000000 !important;
      font-size: 18pt !important;
      line-height: 1.6 !important;
      white-space: pre-wrap !important;
      word-break: keep-all !important;
      font-family: var(--active-font);
    }
    .print-page-sheet:last-child {
      page-break-after: avoid !important;
      break-after: avoid !important;
    }
    .print-page-header {
      font-size: 11pt;
      font-weight: bold;
      color: #777;
      text-align: right;
      border-bottom: 1px solid #ddd;
      margin-bottom: 15px;
      padding-bottom: 4px;
    }
  }

  /* 토스트 메시지 */
  #toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(30, 30, 30, 0.95);
    border: 1px solid #555555;
    color: #38bdf8;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 7000;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 페이지 분할 측정용 숨김 컨테이너 */
  #measure-container {
    position: absolute;
    visibility: hidden;
    pointer-events: none;
    top: -99999px;
    left: -99999px;
    width: 820px;
    padding: 32px 44px;
    font-size: 26px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: keep-all;
    box-sizing: border-box;
    font-family: var(--active-font);
  }
</style>
</head>
<body>

<!-- 상단 2단 툴바 -->
<div id="header-toolbar">
  <!-- 1단: 자간, 줄간격, 글꼴, 스크롤/페이지 모드 전환 아이콘 -->
  <div class="toolbar-row toolbar-row-top">
    <div class="tool-group">
      <!-- 자간 좁게 -->
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLetterSpacing(-0.5)" title="자간 좁게">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <line x1="4" y1="12" x2="10" y2="12"></line>
          <polyline points="7 9 10 12 7 15"></polyline>
          <line x1="20" y1="12" x2="14" y2="12"></line>
          <polyline points="17 9 14 12 17 15"></polyline>
        </svg>
      </button>
      <!-- 자간 넓게 -->
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLetterSpacing(0.5)" title="자간 넓게">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <line x1="10" y1="12" x2="4" y2="12"></line>
          <polyline points="7 9 4 12 7 15"></polyline>
          <line x1="14" y1="12" x2="20" y2="12"></line>
          <polyline points="17 9 20 12 17 15"></polyline>
        </svg>
      </button>

      <div class="divider"></div>

      <!-- 줄간격 좁게 -->
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLineHeight(-0.1)" title="줄간격 좁게">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <polyline points="9 6 12 9 15 6"></polyline>
          <line x1="12" y1="2" x2="12" y2="9"></line>
          <polyline points="9 18 12 15 15 18"></polyline>
          <line x1="12" y1="22" x2="12" y2="15"></line>
        </svg>
      </button>
      <!-- 줄간격 넓게 -->
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLineHeight(0.1)" title="줄간격 넓게">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <polyline points="8 6 12 2 16 6"></polyline>
          <line x1="12" y1="2" x2="12" y2="10"></line>
          <polyline points="8 18 12 22 16 18"></polyline>
          <line x1="12" y1="22" x2="12" y2="14"></line>
        </svg>
      </button>

      <div class="divider"></div>

      <!-- 글꼴 순환 선택 (기본 / KoPub 돋움 / KoPub 바탕) -->
      <button id="btn-font-cycle" class="btn-font" onclick="cycleFontFamily()" title="글꼴 변경">기본</button>

      <div class="divider"></div>

      <!-- 스크롤 / 페이지 모드 전환 아이콘 버튼 -->
      <button id="btn-view-mode" class="btn-icon" onclick="toggleViewMode()" title="세로 스크롤 / 가로 페이지 모드 전환">
        <svg id="icon-view-mode" class="icon-svg" viewBox="0 0 24 24">
          <!-- 기본: 스크롤 아이콘 -->
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- 2단: 불러오기, 저장, 공유, 인쇄, 번역, 되돌리기, 다시실행, 색깔, 글씨크기, 미리보기, 전체보기 -->
  <div class="toolbar-row">
    <div class="tool-group">
      <button class="btn-icon" onclick="document.getElementById('file-input').click()" title="파일 불러오기 (.txt, .json)">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path>
        </svg>
      </button>
      <input type="file" id="file-input" accept=".txt,.json" onchange="handleFileImport(this.files)">

      <button class="btn-icon" onclick="saveNoteData()" title="저장">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
      </button>

      <button class="btn-icon" onclick="shareNoteContent()" title="텍스트 공유">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
      </button>

      <button class="btn-icon" onclick="printNoteDocument()" title="문서 인쇄">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <polyline points="6 9 6 2 18 2 18 9"></polyline>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
          <rect x="6" y="14" width="12" height="8"></rect>
        </svg>
      </button>

      <button class="btn-icon" onclick="translateSelectedTextWithGemini()" title="선택 텍스트 영어로 번역 (Gemini AI)">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
      </button>

      <button class="btn-icon" onclick="undo()" title="실행 취소 / 되돌리기 (Ctrl+Z)">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M3 7v6h6"></path>
          <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
        </svg>
      </button>

      <button class="btn-icon" onclick="redo()" title="다시 실행 (Ctrl+Y)">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M21 7v6h-6"></path>
          <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"></path>
        </svg>
      </button>

      <div class="divider"></div>

      <button id="btn-continuous" onclick="toggleContinuousMode()" title="글자를 터치하여 연속으로 색칠">연속</button>
      <div class="color-btn c-white" onmousedown="event.preventDefault()" onclick="selectColor('#ffffff', this)" title="흰색"></div>
      <div class="color-btn c-red selected" onmousedown="event.preventDefault()" onclick="selectColor('#ef4444', this)" title="빨간색"></div>
      <div class="color-btn c-yellow" onmousedown="event.preventDefault()" onclick="selectColor('#ffb703', this)" title="황금 주황"></div>
      <div class="color-btn c-blue" onmousedown="event.preventDefault()" onclick="selectColor('#38bdf8', this)" title="밝은 파랑"></div>
      <div class="color-btn c-green" onmousedown="event.preventDefault()" onclick="selectColor('#4ade80', this)" title="밝은 초록"></div>

      <div class="divider"></div>

      <div class="size-box">
        <button class="btn-size-step" onclick="changeFontSize(-2)">-</button>
        <span id="size-display">26</span>
        <button class="btn-size-step" onclick="changeFontSize(2)">+</button>
      </div>
    </div>

    <div class="tool-group">
      <button class="btn-icon" onclick="startPreviewCurrentPage()" title="현재 페이지 미리보기">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>

      <button class="btn-icon" onclick="startFullPresentation(0)" style="background-color:#0284c7; border-color:#38bdf8; color:#fff;" title="1페이지부터 전체보기">
        <svg class="icon-svg" viewBox="0 0 24 24" style="fill: currentColor; stroke: none;">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- 메인 에디터 뷰포트 -->
<div id="main-viewport" class="view-scroll"></div>

<!-- 하단 고정 독 -->
<div id="bottom-dock">
  <span id="page-info">1 페이지</span>
  <button onclick="addNewPage()">➕ 새 페이지</button>
</div>

<!-- 전체화면 모드 레이어 -->
<div id="reader-container">
  <button id="exit-reader-btn" onclick="exitReaderMode()" title="닫기 (ESC)">✕</button>
  <div class="touch-zone" id="touch-left" onclick="prevSlide()"></div>
  <div class="touch-zone" id="touch-right" onclick="nextSlide()"></div>
  <div id="reader-viewport"></div>
  <div id="reader-page-badge"><span id="reader-curr">1</span> / <span id="reader-total">1</span></div>
</div>

<!-- 인쇄 전용 컨테이너 -->
<div id="print-area"></div>

<!-- 분량 측정용 숨김 컨테이너 -->
<div id="measure-container"></div>

<div id="toast"></div>

<script>
  const PLACEHOLDER_TEXT = "여기를 클릭하여 글을 작성하거나 긴 글을 붙여넣으세요.";

  const FONT_LIST = [
    { name: "기본", family: "-apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', sans-serif" },
    { name: "KoPub 돋움", family: "'KoPubWorld Dotum', sans-serif" },
    { name: "KoPub 바탕", family: "'KoPubWorld Batang', serif" }
  ];
  let currentFontIndex = 0;

  let activeColor = '#ef4444';
  let isContinuousMode = false;
  let isPainting = false;
  let lastPaintedKey = '';
  let currentFontSize = 26;
  let currentReaderIndex = 0;
  let isReaderOpen = false;
  let savedSelectionRange = null;

  let viewMode = 'scroll'; // 'scroll' 또는 'page'

  let pagesData = [];

  let undoStack = [];
  let redoStack = [];
  const MAX_HISTORY = 40;
  let inputDebounceTimer = null;

  const viewport = document.getElementById('main-viewport');
  const readerViewport = document.getElementById('reader-viewport');
  const measureContainer = document.getElementById('measure-container');
  const btnFontCycle = document.getElementById('btn-font-cycle');
  const btnViewMode = document.getElementById('btn-view-mode');
  const iconViewMode = document.getElementById('icon-view-mode');

  function init() {
    const savedFont = localStorage.getItem('yslide_note_font_idx');
    if (savedFont !== null) {
      currentFontIndex = parseInt(savedFont, 10) % FONT_LIST.length;
    }
    applyCurrentFont();

    const savedMode = localStorage.getItem('yslide_note_view_mode');
    if (savedMode) {
      viewMode = savedMode;
    }
    applyViewModeUI();

    const saved = localStorage.getItem('yslide_note_pages_v14');
    if (saved) {
      try {
        pagesData = JSON.parse(saved);
      } catch (e) {
        pagesData = [{ html: PLACEHOLDER_TEXT, isPlaceholder: true }];
      }
    } else {
      pagesData = [{ html: PLACEHOLDER_TEXT, isPlaceholder: true }];
    }

    pushHistory();
    renderPages();
    updateFontSize();
  }

  function toggleViewMode() {
    viewMode = viewMode === 'scroll' ? 'page' : 'scroll';
    localStorage.setItem('yslide_note_view_mode', viewMode);
    applyViewModeUI();
    renderPages();
    showToast(viewMode === 'scroll' ? '📜 세로 스크롤 모드' : '📄 가로 페이지 넘김 모드 (스와이프)');
  }

  function applyViewModeUI() {
    viewport.className = viewMode === 'scroll' ? 'view-scroll' : 'view-page';
    if (iconViewMode) {
      if (viewMode === 'scroll') {
        // 스크롤 모드 아이콘 (책/스크롤 형태)
        iconViewMode.innerHTML = '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>';
        btnViewMode.title = "현재: 세로 스크롤 모드 (클릭 시 가로 페이지 모드)";
      } else {
        // 페이지 모드 아이콘 (단일 페이지 분할 형태)
        iconViewMode.innerHTML = '<rect x="4" y="2" width="16" height="20" rx="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="8" y1="10" x2="16" y2="10"></line><line x1="8" y1="14" x2="16" y2="14"></line><line x1="8" y1="18" x2="16" y2="18"></line>';
        btnViewMode.title = "현재: 가로 페이지 넘김 모드 (클릭 시 세로 스크롤 모드)";
      }
    }
  }

  function pushHistory() {
    const stateStr = JSON.stringify(pagesData);
    if (undoStack.length === 0 || undoStack[undoStack.length - 1] !== stateStr) {
      undoStack.push(stateStr);
      if (undoStack.length > MAX_HISTORY) undoStack.shift();
      redoStack = [];
    }
  }

  function undo() {
    if (undoStack.length > 1) {
      const currentState = undoStack.pop();
      redoStack.push(currentState);
      const prevState = undoStack[undoStack.length - 1];
      pagesData = JSON.parse(prevState);
      renderPages();
      saveToLocalStorageSilent();
      showToast('↶ 실행 취소(되돌리기)');
    } else {
      showToast('⚠️ 더 이상 되돌릴 작업이 없습니다');
    }
  }

  function redo() {
    if (redoStack.length > 0) {
      const nextState = redoStack.pop();
      undoStack.push(nextState);
      pagesData = JSON.parse(nextState);
      renderPages();
      saveToLocalStorageSilent();
      showToast('↷ 다시 실행');
    } else {
      showToast('⚠️ 다시 실행할 작업이 없습니다');
    }
  }

  function cycleFontFamily() {
    currentFontIndex = (currentFontIndex + 1) % FONT_LIST.length;
    localStorage.setItem('yslide_note_font_idx', currentFontIndex);
    applyCurrentFont();
    showToast(`글꼴: ${FONT_LIST[currentFontIndex].name}`);
  }

  function applyCurrentFont() {
    const current = FONT_LIST[currentFontIndex];
    document.documentElement.style.setProperty('--active-font', current.family);
    if (btnFontCycle) btnFontCycle.innerText = current.name;
  }

  function renderPages() {
    viewport.innerHTML = '';
    pagesData.forEach((page, index) => {
      const card = document.createElement('div');
      card.className = 'note-page-card';
      card.dataset.index = index;

      const header = document.createElement('div');
      header.className = 'page-header';
      header.innerHTML = `
        <span>[ PAGE ${index + 1} ]</span>
        <button class="page-del-btn" onclick="deletePage(${index})">삭제</button>
      `;

      const editor = document.createElement('div');
      editor.className = 'page-editor';
      editor.contentEditable = 'true';
      editor.spellcheck = false;
      editor.style.fontSize = `${currentFontSize}px`;
      
      if (page.isPlaceholder || (!page.html && page.html !== '')) {
        editor.classList.add('is-placeholder');
        editor.innerHTML = PLACEHOLDER_TEXT;
      } else {
        editor.innerHTML = page.html || '';
      }

      editor.addEventListener('focus', () => {
        if (editor.classList.contains('is-placeholder') || editor.innerHTML.trim() === PLACEHOLDER_TEXT) {
          pushHistory();
          editor.innerHTML = '';
          editor.classList.remove('is-placeholder');
          pagesData[index].isPlaceholder = false;
          pagesData[index].html = '';
          saveToLocalStorageSilent();
        }
      });

      editor.addEventListener('input', () => {
        if (editor.classList.contains('is-placeholder')) {
          editor.classList.remove('is-placeholder');
          pagesData[index].isPlaceholder = false;
        }
        pagesData[index].html = editor.innerHTML;
        saveToLocalStorageSilent();

        if (inputDebounceTimer) clearTimeout(inputDebounceTimer);
        inputDebounceTimer = setTimeout(() => {
          pushHistory();
        }, 500);
      });

      editor.addEventListener('paste', (e) => {
        if (editor.classList.contains('is-placeholder')) {
          editor.classList.remove('is-placeholder');
          pagesData[index].isPlaceholder = false;
        }
        pushHistory();
        handleSmartPaste(e, index);
      });

      attachContinuousEvents(editor, index);

      card.appendChild(header);
      card.appendChild(editor);

      if (viewMode === 'page') {
        const wrapper = document.createElement('div');
        wrapper.className = 'page-wrapper';
        wrapper.appendChild(card);
        viewport.appendChild(wrapper);
      } else {
        viewport.appendChild(card);
      }
    });

    updatePageInfo();
  }

  document.addEventListener('selectionchange', () => {
    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0 && !sel.isCollapsed) {
      const range = sel.getRangeAt(0);
      if (viewport.contains(range.commonAncestorContainer)) {
        savedSelectionRange = range.cloneRange();
      }
    }
  });

  /* 80% 시트 기준 정밀 단어/문자 단위 자동 분할 알고리즘 */
  function paginateText(rawText) {
    measureContainer.style.fontSize = `${currentFontSize}px`;
    measureContainer.style.lineHeight = '1.55';
    measureContainer.style.fontFamily = FONT_LIST[currentFontIndex].family;
    
    // 에디터 내부 가용 높이 (928px - 42px - 64px = 822px)
    const maxAllowedHeight = 822;

    const lines = rawText.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
    let pages = [];
    let currentHtml = '';

    measureContainer.innerHTML = '';

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];

      if (line === '') {
        const testHtml = currentHtml ? `${currentHtml}<br>` : '';
        measureContainer.innerHTML = testHtml || '<br>';
        if (measureContainer.offsetHeight > maxAllowedHeight && currentHtml !== '') {
          pages.push(currentHtml);
          currentHtml = '';
          measureContainer.innerHTML = '';
        } else {
          currentHtml = testHtml;
        }
        continue;
      }

      const testHtml = currentHtml ? `${currentHtml}<br>${line}` : line;
      measureContainer.innerHTML = testHtml;

      if (measureContainer.offsetHeight <= maxAllowedHeight) {
        currentHtml = testHtml;
      } else {
        const words = line.split(' ');
        let tempParagraph = '';

        for (let j = 0; j < words.length; j++) {
          const word = words[j];
          const nextTemp = tempParagraph ? `${tempParagraph} ${word}` : word;
          const candidateHtml = currentHtml 
            ? `${currentHtml}<br>${nextTemp}`
            : nextTemp;

          measureContainer.innerHTML = candidateHtml;

          if (measureContainer.offsetHeight <= maxAllowedHeight) {
            tempParagraph = nextTemp;
          } else {
            if (currentHtml !== '') {
              pages.push(currentHtml);
              currentHtml = tempParagraph ? `${tempParagraph}` : '';
              tempParagraph = word;
              measureContainer.innerHTML = tempParagraph;
            } else {
              if (tempParagraph) pages.push(tempParagraph);
              tempParagraph = word;
            }
          }
        }

        if (tempParagraph) {
          currentHtml = currentHtml ? `${currentHtml}<br>${tempParagraph}` : tempParagraph;
        }
      }
    }

    if (currentHtml && currentHtml.trim() !== '') {
      pages.push(currentHtml);
    }

    return pages.length > 0 ? pages : [''];
  }

  function handleSmartPaste(e, startIndex) {
    e.preventDefault();
    const clipboardData = e.clipboardData || window.clipboardData;
    const text = clipboardData ? clipboardData.getData('text/plain') : '';
    if (!text) return;

    const pagesCreated = paginateText(text);

    pagesData[startIndex].html = pagesCreated[0];
    pagesData[startIndex].isPlaceholder = false;

    if (pagesCreated.length > 1) {
      const restPages = pagesCreated.slice(1).map(content => ({ html: content, isPlaceholder: false }));
      pagesData.splice(startIndex + 1, 0, ...restPages);
    }

    renderPages();
    pushHistory();
    saveToLocalStorageSilent();
    showToast(`📄 텍스트 분량에 맞게 총 ${pagesCreated.length}개 페이지로 분할되었습니다`);
  }

  async function translateSelectedTextWithGemini() {
    let targetRange = null;
    const sel = window.getSelection();

    if (sel && sel.rangeCount > 0 && !sel.isCollapsed) {
      targetRange = sel.getRangeAt(0);
    } else if (savedSelectionRange && !savedSelectionRange.collapsed) {
      targetRange = savedSelectionRange;
    }

    if (!targetRange || targetRange.collapsed) {
      showToast('⚠️ 번역할 텍스트를 먼저 드래그하여 선택하세요');
      return;
    }

    const tempDiv = document.createElement('div');
    tempDiv.appendChild(targetRange.cloneContents());
    const originalHtml = tempDiv.innerHTML.trim();
    const originalText = tempDiv.innerText.trim();

    if (!originalText) {
      showToast('⚠️ 번역할 내용이 없습니다');
      return;
    }

    let apiKey = localStorage.getItem('yslide_gemini_api_key');
    if (!apiKey) {
      apiKey = prompt("Google Gemini API 키를 입력해주세요 (최초 1회 저장):");
      if (!apiKey || !apiKey.trim()) return;
      localStorage.setItem('yslide_gemini_api_key', apiKey.trim());
    }

    const promptText = `Translate the provided HTML text naturally into dignified, accurate English.
Rules:
1. Maintain all existing HTML tags (<font>, <span>, <b>, <i>, <br>) and color styles intact.
2. Only translate the human readable text content.
3. Return ONLY the translated raw HTML without any markdown formatting or code block wrappers (\`\`\`html).

HTML to Translate:
${originalHtml}`;

    showToast('🌐 Gemini가 영어로 번역 중입니다...');

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptText }] }]
        })
      });

      const resData = await response.json();

      if (resData.error) {
        if (resData.error.code === 400 || resData.error.message.includes("API key")) {
          localStorage.removeItem('yslide_gemini_api_key');
          alert("API 키가 올바르지 않습니다. 다시 확인해주세요.");
        } else {
          alert("번역 오류: " + resData.error.message);
        }
        return;
      }

      let translatedHtml = resData.candidates?.[0]?.content?.parts?.[0]?.text;
      if (translatedHtml) {
        pushHistory();
        translatedHtml = translatedHtml.replace(/^```html\s*/i, '').replace(/\s*```$/i, '').trim();
        
        targetRange.deleteContents();
        const wrapper = document.createElement('div');
        wrapper.innerHTML = translatedHtml;
        const frag = document.createDocumentFragment();
        let node;
        while ((node = wrapper.firstChild)) {
          frag.appendChild(node);
        }
        targetRange.insertNode(frag);

        saveAllPagesState();
        pushHistory();
        showToast('✨ 영어 번역이 완료되었습니다');
      } else {
        showToast('⚠️ 번역 결과를 받지 못했습니다');
      }
    } catch (err) {
      alert("네트워크 오류로 번역에 실패했습니다: " + err.message);
    }
  }

  function adjustLetterSpacing(delta) {
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || sel.isCollapsed) {
      showToast('⚠️ 텍스트를 먼저 드래그하여 선택하세요');
      return;
    }
    pushHistory();
    const range = sel.getRangeAt(0);
    let targetSpan = null;
    let node = range.commonAncestorContainer;
    if (node.nodeType === Node.TEXT_NODE) node = node.parentNode;

    if (node && node.tagName === 'SPAN' && node.style.letterSpacing) {
      targetSpan = node;
      let cur = parseFloat(targetSpan.style.letterSpacing) || 0;
      targetSpan.style.letterSpacing = `${(cur + delta).toFixed(1)}px`;
    } else {
      targetSpan = document.createElement('span');
      targetSpan.style.letterSpacing = `${delta.toFixed(1)}px`;
      const frag = range.extractContents();
      targetSpan.appendChild(frag);
      range.insertNode(targetSpan);
    }

    const newRange = document.createRange();
    newRange.selectNodeContents(targetSpan);
    sel.removeAllRanges();
    sel.addRange(newRange);
    saveAllPagesState();
    pushHistory();
  }

  function adjustLineHeight(delta) {
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || sel.isCollapsed) {
      showToast('⚠️ 텍스트를 먼저 드래그하여 선택하세요');
      return;
    }
    pushHistory();
    const range = sel.getRangeAt(0);
    let targetSpan = null;
    let node = range.commonAncestorContainer;
    if (node.nodeType === Node.TEXT_NODE) node = node.parentNode;

    if (node && node.tagName === 'SPAN' && node.style.lineHeight) {
      targetSpan = node;
      let cur = parseFloat(targetSpan.style.lineHeight) || 1.55;
      targetSpan.style.lineHeight = `${Math.max(0.8, cur + delta).toFixed(2)}`;
    } else {
      targetSpan = document.createElement('span');
      targetSpan.style.display = 'inline-block';
      let cur = 1.55;
      targetSpan.style.lineHeight = `${Math.max(0.8, cur + delta).toFixed(2)}`;
      const frag = range.extractContents();
      targetSpan.appendChild(frag);
      range.insertNode(targetSpan);
    }

    const newRange = document.createRange();
    newRange.selectNodeContents(targetSpan);
    sel.removeAllRanges();
    sel.addRange(newRange);
    saveAllPagesState();
    pushHistory();
  }

  function attachContinuousEvents(editorEl, pageIdx) {
    function paintAtCoord(clientX, clientY) {
      if (editorEl.classList.contains('is-placeholder')) return;

      let range;
      if (document.caretRangeFromPoint) {
        range = document.caretRangeFromPoint(clientX, clientY);
      } else if (document.caretPositionFromPoint) {
        const pos = document.caretPositionFromPoint(clientX, clientY);
        if (pos) {
          range = document.createRange();
          range.setStart(pos.offsetNode, pos.offset);
          range.collapse(true);
        }
      }

      if (!range) return;
      let node = range.startContainer;

      if (node.nodeType !== Node.TEXT_NODE) {
        if (node.childNodes.length > 0 && range.startOffset < node.childNodes.length) {
          node = node.childNodes[range.startOffset];
          while (node && node.nodeType !== Node.TEXT_NODE && node.firstChild) {
            node = node.firstChild;
          }
        }
      }

      if (node && node.nodeType === Node.TEXT_NODE) {
        const text = node.textContent;
        const offset = range.startOffset;

        let start = Math.min(offset, text.length > 0 ? text.length - 1 : 0);
        while (start > 0 && !/\s/.test(text[start - 1])) start--;
        let end = offset;
        while (end < text.length && !/\s/.test(text[end])) end++;

        if (start < end) {
          const key = `${node.textContent}_${start}_${end}`;
          if (lastPaintedKey === key) return;
          lastPaintedKey = key;

          const wordRange = document.createRange();
          wordRange.setStart(node, start);
          wordRange.setEnd(node, end);

          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(wordRange);

          document.execCommand('foreColor', false, activeColor);
          sel.removeAllRanges();

          pagesData[pageIdx].html = editorEl.innerHTML;
          pagesData[pageIdx].isPlaceholder = false;
          saveToLocalStorageSilent();
        }
      }
    }

    editorEl.addEventListener('touchstart', (e) => {
      if (isContinuousMode) {
        pushHistory();
        isPainting = true;
        paintAtCoord(e.touches[0].clientX, e.touches[0].clientY);
        e.preventDefault();
      }
    }, { passive: false });

    editorEl.addEventListener('touchmove', (e) => {
      if (isContinuousMode && isPainting) {
        paintAtCoord(e.touches[0].clientX, e.touches[0].clientY);
        e.preventDefault();
      }
    }, { passive: false });

    editorEl.addEventListener('mousedown', (e) => {
      if (isContinuousMode) {
        pushHistory();
        isPainting = true;
        paintAtCoord(e.clientX, e.clientY);
        e.preventDefault();
      }
    });

    editorEl.addEventListener('mousemove', (e) => {
      if (isContinuousMode && isPainting) {
        paintAtCoord(e.clientX, e.clientY);
        e.preventDefault();
      }
    });
  }

  window.addEventListener('mouseup', () => {
    if (isPainting) {
      isPainting = false;
      lastPaintedKey = '';
      pushHistory();
    }
  });
  window.addEventListener('touchend', () => {
    if (isPainting) {
      isPainting = false;
      lastPaintedKey = '';
      pushHistory();
    }
  });

  function selectColor(color, el) {
    activeColor = color;
    document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('selected'));
    if (el) el.classList.add('selected');

    if (!isContinuousMode) {
      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0 && !sel.isCollapsed) {
        pushHistory();
        document.execCommand('foreColor', false, color);
        saveAllPagesState();
        pushHistory();
      }
    }
  }

  function toggleContinuousMode() {
    isContinuousMode = !isContinuousMode;
    const btn = document.getElementById('btn-continuous');
    if (isContinuousMode) {
      btn.classList.add('active');
      document.body.classList.add('paint-mode');
      showToast('🎨 연속 채색 모드 (글자를 터치하세요)');
    } else {
      btn.classList.remove('active');
      document.body.classList.remove('paint-mode');
      showToast('⌨️ 일반 텍스트 입력 모드');
    }
  }

  function changeFontSize(delta) {
    currentFontSize = Math.min(48, Math.max(16, currentFontSize + delta));
    updateFontSize();
  }

  function updateFontSize() {
    document.getElementById('size-display').innerText = currentFontSize;
    document.querySelectorAll('.page-editor').forEach(ed => {
      ed.style.fontSize = `${currentFontSize}px`;
    });
  }

  function addNewPage() {
    pushHistory();
    saveAllPagesState();
    pagesData.push({ html: '', isPlaceholder: false });
    renderPages();
    pushHistory();

    setTimeout(() => {
      if (viewMode === 'page') {
        const wrappers = document.querySelectorAll('.page-wrapper');
        const lastWrapper = wrappers[wrappers.length - 1];
        if (lastWrapper) {
          lastWrapper.scrollIntoView({ behavior: 'smooth', inline: 'center' });
          const ed = lastWrapper.querySelector('.page-editor');
          if (ed) ed.focus();
        }
      } else {
        const lastCard = document.querySelector('.note-page-card:last-child');
        if (lastCard) {
          lastCard.scrollIntoView({ behavior: 'smooth' });
          const ed = lastCard.querySelector('.page-editor');
          if (ed) ed.focus();
        }
      }
    }, 50);

    showToast('📄 새 페이지가 추가되었습니다');
  }

  function deletePage(index) {
    if (pagesData.length <= 1) {
      showToast('⚠️ 최소 1개 페이지는 유지되어야 합니다');
      return;
    }
    pushHistory();
    pagesData.splice(index, 1);
    renderPages();
    pushHistory();
    showToast('🗑️ 페이지가 삭제되었습니다');
  }

  function updatePageInfo() {
    document.getElementById('page-info').innerText = `${pagesData.length} 페이지`;
  }

  function saveAllPagesState() {
    document.querySelectorAll('.note-page-card').forEach((card, idx) => {
      const editor = card.querySelector('.page-editor');
      if (editor && pagesData[idx]) {
        if (!editor.classList.contains('is-placeholder')) {
          pagesData[idx].html = editor.innerHTML;
          pagesData[idx].isPlaceholder = false;
        }
      }
    });
    saveToLocalStorageSilent();
  }

  function saveToLocalStorageSilent() {
    try {
      localStorage.setItem('yslide_note_pages_v14', JSON.stringify(pagesData));
    } catch(e) {}
  }

  async function saveNoteData() {
    saveAllPagesState();
    const now = new Date();
    const dateStr = `${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2, '0')}${now.getDate().toString().padStart(2, '0')}_${now.getHours().toString().padStart(2, '0')}${now.getMinutes().toString().padStart(2, '0')}`;
    const filename = `Yslide_${dateStr}.json`;

    const blob = new Blob([JSON.stringify(pagesData, null, 2)], { type: "application/json" });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);

    showToast('💾 파일로 저장되었습니다');
  }

  function handleFileImport(files) {
    if (!files || files.length === 0) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const raw = e.target.result;
      pushHistory();
      try {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) {
          pagesData = parsed;
          renderPages();
          pushHistory();
          saveToLocalStorageSilent();
          showToast('📂 파일을 성공적으로 불러왔습니다');
          return;
        }
      } catch (err) {}

      const pagesCreated = paginateText(raw);
      pagesData = pagesCreated.map(html => ({ html: html, isPlaceholder: false }));
      renderPages();
      pushHistory();
      saveToLocalStorageSilent();
      showToast(`📂 텍스트를 총 ${pagesData.length}개 페이지로 불러왔습니다`);
    };
    reader.readAsText(files[0]);
  }

  async function shareNoteContent() {
    saveAllPagesState();
    let shareText = '';
    const sel = window.getSelection();

    if (sel && !sel.isCollapsed && sel.toString().trim() !== '') {
      shareText = sel.toString().trim();
    } else {
      shareText = pagesData.map((p, idx) => `[PAGE ${idx + 1}]\n` + (p.isPlaceholder ? '' : p.html.replace(/<br\s*[\/]?>/gi, '\n').replace(/<[^>]+>/g, ''))).join('\n\n');
    }

    if (!shareText) {
      showToast('⚠️ 공유할 내용이 없습니다');
      return;
    }

    if (navigator.share) {
      try {
        await navigator.share({ title: 'Yslide 원고 공유', text: shareText });
        showToast('📤 공유 완료');
      } catch (e) {
        if (e.name !== 'AbortError') copyToClipboardFallback(shareText);
      }
    } else {
      copyToClipboardFallback(shareText);
    }
  }

  function copyToClipboardFallback(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('📋 텍스트가 클립보드에 복사되었습니다');
      });
    }
  }

  function printNoteDocument() {
    saveAllPagesState();
    const printArea = document.getElementById('print-area');
    printArea.innerHTML = '';

    pagesData.forEach((page, idx) => {
      const sheet = document.createElement('div');
      sheet.className = 'print-page-sheet';
      sheet.innerHTML = `
        <div class="print-page-header">[ PAGE ${idx + 1} / ${pagesData.length} ]</div>
        <div>${page.isPlaceholder ? '' : (page.html || '')}</div>
      `;
      printArea.appendChild(sheet);
    });

    window.print();
  }

  function startPreviewCurrentPage() {
    saveAllPagesState();
    let targetIndex = 0;

    if (viewMode === 'page') {
      const wrappers = document.querySelectorAll('.page-wrapper');
      const scrollLeft = viewport.scrollLeft + (viewport.clientWidth / 2);
      wrappers.forEach((wrap, idx) => {
        if (wrap.offsetLeft <= scrollLeft) {
          targetIndex = idx;
        }
      });
    } else {
      const cards = document.querySelectorAll('.note-page-card');
      const viewportCenter = viewport.scrollTop + (viewport.clientHeight / 2);
      cards.forEach((card, idx) => {
        if (card.offsetTop <= viewportCenter) {
          targetIndex = idx;
        }
      });
    }

    startFullPresentation(targetIndex);
  }

  function startFullPresentation(index = 0) {
    saveAllPagesState();
    currentReaderIndex = Math.min(Math.max(0, index), pagesData.length - 1);
    renderReaderSlides();
    updateReaderUI();

    document.getElementById('reader-container').style.display = 'block';
    isReaderOpen = true;

    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  }

  function renderReaderSlides() {
    readerViewport.innerHTML = '';
    pagesData.forEach((page, idx) => {
      const sheet = document.createElement('div');
      sheet.className = `slide-sheet ${idx === currentReaderIndex ? 'active' : ''}`;
      sheet.style.fontSize = `${currentFontSize}px`;
      sheet.innerHTML = page.isPlaceholder ? '' : (page.html || '');
      readerViewport.appendChild(sheet);
    });
  }

  function updateReaderUI() {
    document.querySelectorAll('.slide-sheet').forEach((el, idx) => {
      if (idx === currentReaderIndex) el.classList.add('active');
      else el.classList.remove('active');
    });
    document.getElementById('reader-curr').innerText = currentReaderIndex + 1;
    document.getElementById('reader-total').innerText = pagesData.length;
  }

  function nextSlide() {
    if (currentReaderIndex < pagesData.length - 1) {
      currentReaderIndex++;
      updateReaderUI();
    }
  }

  function prevSlide() {
    if (currentReaderIndex > 0) {
      currentReaderIndex--;
      updateReaderUI();
    }
  }

  function exitReaderMode() {
    document.getElementById('reader-container').style.display = 'none';
    isReaderOpen = false;
    if (document.fullscreenElement && document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    }
  }

  window.addEventListener('keydown', (e) => {
    if (isReaderOpen) {
      if (['ArrowRight', 'ArrowDown', ' ', 'PageDown'].includes(e.key)) {
        e.preventDefault();
        nextSlide();
      } else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'Escape') {
        exitReaderMode();
      }
      return;
    }

    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      if (e.shiftKey) {
        e.preventDefault();
        redo();
      } else {
        e.preventDefault();
        undo();
      }
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
      e.preventDefault();
      redo();
    }
  });

  let toastTimer = null;
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1500);
  }

  init();
</script>
</body>
