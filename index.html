<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yslide Note</title>

<!-- PWA 메타 태그 및 아이콘 -->
<meta name="theme-color" content="#181818">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yslide">
<link rel="apple-touch-icon" href="https://api.iconify.design/fluent-emoji:memo.svg">
<link id="manifest-link" rel="manifest">

<!-- 웹 폰트 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-kopubworld@1.0.0/kopubworld.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

<style>
  :root {
    --bg-main: #0a0a0a;
    --panel-bg: #181818;
    --border-color: #333333;
    --page-bg: #141414;
    --page-border: #444444;
    --text-color: #ffffff;
    --accent: #38bdf8;
    --toolbar-height: 96px;
    --page-width: min(820px, 92vw);
    --page-card-height: 80vh;
    --page-gap: 32px;
    --active-font: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
    --ui-font: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background-color: var(--bg-main);
    color: var(--text-color);
    font-family: var(--ui-font);
    overflow: hidden;
  }

  /* 상단 2단 고정 툴바 */
  #header-toolbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: var(--toolbar-height);
    background-color: var(--panel-bg);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 16px;
    z-index: 1000;
    user-select: none;
    gap: 6px;
  }

  .toolbar-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: 40px;
    overflow-x: auto;
    white-space: nowrap;
    gap: 8px;
  }
  .toolbar-row::-webkit-scrollbar { display: none; }

  .toolbar-row-top {
    justify-content: flex-start;
    border-bottom: 1px solid #282828;
    padding-bottom: 4px;
    height: 38px;
    gap: 8px;
  }

  .tool-group {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  button {
    height: 32px;
    padding: 0 10px;
    background-color: #262626;
    border: 1px solid #484848;
    border-radius: 6px;
    color: #e5e5e5;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    flex-shrink: 0;
    transition: all 0.15s ease;
    font-family: var(--ui-font);
  }
  button:hover { background-color: #333333; }
  button:active { transform: scale(0.97); }

  .btn-icon { width: 32px; height: 32px; padding: 0; }
  .icon-svg {
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .divider {
    width: 1px;
    height: 20px;
    background-color: var(--border-color);
    margin: 0 2px;
    flex-shrink: 0;
  }

  .color-btn {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid #555555;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.15s ease;
  }
  .color-btn.selected {
    border-color: #ffffff;
    transform: scale(1.2);
    box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
  }
  .c-white { background-color: #ffffff; }
  .c-red { background-color: #ef4444; }
  .c-yellow { background-color: #ffb703; }
  .c-blue { background-color: #38bdf8; }
  .c-green { background-color: #4ade80; }

  .btn-font {
    height: 30px;
    padding: 0 10px;
    font-size: 12px;
    font-weight: bold;
    color: #d1d5db;
  }

  .size-box {
    display: inline-flex;
    align-items: center;
    background-color: #262626;
    border: 1px solid #484848;
    border-radius: 6px;
    padding: 2px 4px;
    gap: 2px;
    height: 32px;
  }
  .btn-size-step {
    width: 20px;
    height: 20px;
    padding: 0;
    background: transparent;
    border: none;
    color: #cccccc;
    font-size: 14px;
  }
  #size-display {
    font-size: 13px;
    font-weight: bold;
    min-width: 20px;
    text-align: center;
    color: #38bdf8;
  }

  #file-input { display: none; }

  /* 단일 문서 에디터 뷰포트 레이아웃 */
  #main-viewport {
    position: fixed;
    top: var(--toolbar-height);
    bottom: 0;
    left: 0;
    right: 0;
    background-color: var(--bg-main);
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    justify-content: center;
    padding: 30px 16px 140px 16px;
  }

  #document-artboard {
    position: relative;
    width: var(--page-width);
    max-width: 820px;
  }

  /* 뒤에서 페이지 용지 틀을 그려주는 배경 레이어 */
  #page-sheets-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .page-sheet-bg {
    position: absolute;
    width: 100%;
    background-color: var(--page-bg);
    border: 2px solid var(--page-border);
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.95);
    box-sizing: border-box;
  }

  .page-sheet-header {
    height: 42px;
    background-color: #1a1a1a;
    border-bottom: 1px solid #333333;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    font-size: 13px;
    color: #888888;
    font-weight: bold;
  }

  /* 전면의 단일 연속 contenteditable 편집기 */
  #unified-editor {
    position: relative;
    z-index: 2;
    width: 100%;
    min-height: 100%;
    outline: none;
    color: #ffffff;
    font-size: 24px;
    line-height: 1.6;
    font-family: var(--active-font);
    white-space: pre-wrap;
    word-break: break-word;
    cursor: text;
    box-sizing: border-box;
    caret-color: #38bdf8;
  }

  #unified-editor:empty:before {
    content: attr(data-placeholder);
    color: #555555;
    pointer-events: none;
  }

  /* 하단 독 */
  #bottom-dock {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(26, 26, 26, 0.95);
    border: 1px solid #444444;
    padding: 6px 18px;
    border-radius: 30px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
    z-index: 1000;
    backdrop-filter: blur(8px);
  }
  #page-info { font-size: 13px; font-weight: bold; color: #d1d5db; }

  /* 전체화면 슬라이드 뷰어 */
  #reader-container {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background-color: #000000;
    z-index: 5000;
    user-select: none;
  }
  #reader-viewport {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .slide-sheet {
    width: var(--page-width);
    max-width: 820px;
    height: var(--page-card-height);
    background-color: var(--page-bg);
    border: 1px solid #383838;
    border-radius: 8px;
    padding: 32px 40px;
    color: #ffffff;
    font-size: 26px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    box-sizing: border-box;
    display: none;
    overflow: hidden;
  }
  .slide-sheet.active { display: block; }
  .touch-zone {
    position: absolute;
    top: 0; bottom: 0; width: 50%;
    cursor: pointer;
    z-index: 5500;
  }
  #touch-left { left: 0; }
  #touch-right { right: 0; }
  #exit-reader-btn {
    position: absolute; top: 18px; right: 24px;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(40, 40, 40, 0.85); border: 1px solid #666666;
    color: #ffffff; font-size: 20px; font-weight: bold;
    cursor: pointer; z-index: 6000;
  }
  #reader-page-badge {
    position: absolute; top: 22px; left: 24px;
    background: rgba(30, 30, 30, 0.85); border: 1px solid #444444;
    padding: 6px 14px; border-radius: 12px;
    color: #ffb703; font-size: 14px; font-weight: bold;
    z-index: 6000;
  }

  /* 인쇄 영역 */
  #print-area { display: none; }
  @media print {
    @page { margin: 15mm; }
    body { background: #fff !important; color: #000 !important; }
    #header-toolbar, #main-viewport, #bottom-dock, #reader-container { display: none !important; }
    #print-area { display: block !important; }
    .print-page {
      page-break-after: always;
      color: #000 !important;
      font-size: 16pt;
      line-height: 1.6;
      white-space: pre-wrap;
    }
  }

  #toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(30, 30, 30, 0.95);
    border: 1px solid #555555;
    color: #38bdf8;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 9000;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- 상단 고정 툴바 -->
<div id="header-toolbar">
  <div class="toolbar-row toolbar-row-top">
    <div class="tool-group">
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLetterSpacing(-0.5)" title="자간 좁게">
        <svg class="icon-svg" viewBox="0 0 24 24"><line x1="4" y1="12" x2="10" y2="12"></line><polyline points="7 9 10 12 7 15"></polyline><line x1="20" y1="12" x2="14" y2="12"></line><polyline points="17 9 14 12 17 15"></polyline></svg>
      </button>
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLetterSpacing(0.5)" title="자간 넓게">
        <svg class="icon-svg" viewBox="0 0 24 24"><line x1="10" y1="12" x2="4" y2="12"></line><polyline points="7 9 4 12 7 15"></polyline><line x1="14" y1="12" x2="20" y2="12"></line><polyline points="17 9 20 12 17 15"></polyline></svg>
      </button>
      <div class="divider"></div>
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLineHeight(-0.1)" title="줄간격 좁게">
        <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="9 6 12 9 15 6"></polyline><line x1="12" y1="2" x2="12" y2="9"></line><polyline points="9 18 12 15 15 18"></polyline><line x1="12" y1="22" x2="12" y2="15"></line></svg>
      </button>
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLineHeight(0.1)" title="줄간격 넓게">
        <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="8 6 12 2 16 6"></polyline><line x1="12" y1="2" x2="12" y2="10"></line><polyline points="8 18 12 22 16 18"></polyline><line x1="12" y1="22" x2="12" y2="14"></line></svg>
      </button>
      <div class="divider"></div>
      <button id="btn-font-cycle" class="btn-font" onclick="cycleFontFamily()" title="글꼴 변경">기본</button>
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="formatDoc('bold')" title="볼드체">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path></svg>
      </button>
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="formatDoc('italic')" title="이탤릭체">
        <svg class="icon-svg" viewBox="0 0 24 24"><line x1="19" y1="4" x2="10" y2="4"></line><line x1="14" y1="20" x2="5" y2="20"></line><line x1="15" y1="4" x2="9" y2="20"></line></svg>
      </button>
      <button id="btn-align-cycle" class="btn-icon" onmousedown="event.preventDefault()" onclick="cycleTextAlign()" title="정렬 순환">
        <svg id="icon-align" class="icon-svg" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="15" y2="12"></line><line x1="3" y1="18" x2="18" y2="18"></line></svg>
      </button>
    </div>
  </div>

  <div class="toolbar-row">
    <div class="tool-group">
      <button class="btn-icon" onclick="document.getElementById('file-input').click()" title="파일 불러오기">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path></svg>
      </button>
      <input type="file" id="file-input" accept=".txt,.json" onchange="handleFileImport(this.files)">

      <button class="btn-icon" onclick="saveDocument()" title="저장">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
      </button>

      <button class="btn-icon" onclick="shareDocument()" title="문서 전체 공유">
        <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
      </button>

      <button class="btn-icon" onclick="printDocument()" title="문서 인쇄">
        <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
      </button>

      <button class="btn-icon" onclick="translateSelectionWithGemini()" title="선택 영역 영어 번역 (Gemini AI)">
        <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
      </button>

      <button class="btn-icon" onclick="execUndo()" title="실행 취소">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
      </button>
      <button class="btn-icon" onclick="execRedo()" title="다시 실행">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"></path></svg>
      </button>

      <div class="divider"></div>

      <div class="color-btn c-white" onmousedown="event.preventDefault()" onclick="applyTextColor('#ffffff', this)" title="흰색"></div>
      <div class="color-btn c-red selected" onmousedown="event.preventDefault()" onclick="applyTextColor('#ef4444', this)" title="빨강"></div>
      <div class="color-btn c-yellow" onmousedown="event.preventDefault()" onclick="applyTextColor('#ffb703', this)" title="황금"></div>
      <div class="color-btn c-blue" onmousedown="event.preventDefault()" onclick="applyTextColor('#38bdf8', this)" title="파랑"></div>
      <div class="color-btn c-green" onmousedown="event.preventDefault()" onclick="applyTextColor('#4ade80', this)" title="초록"></div>

      <div class="divider"></div>

      <div class="size-box">
        <button class="btn-size-step" onclick="changeFontSize(-2)">-</button>
        <span id="size-display">24</span>
        <button class="btn-size-step" onclick="changeFontSize(2)">+</button>
      </div>
    </div>

    <div class="tool-group">
      <button class="btn-icon" onclick="startPresentation()" title="프레젠테이션 시작">
        <svg class="icon-svg" viewBox="0 0 24 24" style="fill: currentColor; stroke: none;"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      </button>
    </div>
  </div>
</div>

<!-- 메인 에디터 (하나의 연속된 단일 캔버스/에디터) -->
<div id="main-viewport">
  <div id="document-artboard">
    <!-- 페이지 시각적 틀을 동적으로 생성하는 배경 레이어 -->
    <div id="page-sheets-layer"></div>

    <!-- 하나의 단일 연속 문서 모델 편집기 -->
    <div id="unified-editor" contenteditable="true" spellcheck="false" data-placeholder="여기를 클릭하여 글을 작성하거나 긴 원고를 붙여넣으세요."></div>
  </div>
</div>

<!-- 하단 독 -->
<div id="bottom-dock">
  <span id="page-info">1 페이지</span>
  <button onclick="insertPageBreak()">➕ 페이지 구분선 삽입</button>
</div>

<!-- 슬라이드 쇼 뷰어 -->
<div id="reader-container">
  <button id="exit-reader-btn" onclick="exitReaderMode()">✕</button>
  <div class="touch-zone" id="touch-left" onclick="prevSlide()"></div>
  <div class="touch-zone" id="touch-right" onclick="nextSlide()"></div>
  <div id="reader-viewport"></div>
  <div id="reader-page-badge"><span id="reader-curr">1</span> / <span id="reader-total">1</span></div>
</div>

<div id="print-area"></div>
<div id="toast"></div>

<script>
  /* 폰트 및 설정 */
  const FONT_LIST = [
    { name: "기본", family: "-apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', sans-serif" },
    { name: "KoPub 돋움", family: "'KoPubWorld Dotum', sans-serif" },
    { name: "KoPub 바탕", family: "'KoPubWorld Batang', serif" }
  ];
  let currentFontIndex = 0;
  let activeColor = '#ef4444';
  let currentFontSize = 24;
  let currentLetterSpacing = 0;
  let currentLineHeight = 1.6;

  const editor = document.getElementById('unified-editor');
  const pageSheetsLayer = document.getElementById('page-sheets-layer');
  const pageInfo = document.getElementById('page-info');

  /* 레이아웃 치수 상수 */
  const HEADER_HEIGHT = 42;
  const PADDING_TOP = 24;
  const PADDING_BOTTOM = 32;
  const PAGE_GAP = 32;

  function getPageCardHeight() {
    return Math.max(460, window.innerHeight * 0.80);
  }

  function getContentAreaHeight() {
    return getPageCardHeight() - HEADER_HEIGHT - PADDING_TOP - PADDING_BOTTOM;
  }

  /* 삼성노트 방식의 Layout Engine: 단일 에디터 높이에 맞춰 시각적 페이지 카드 갱신 */
  let layoutTimer = null;
  function updateLayout() {
    const totalHeight = editor.offsetHeight;
    const contentH = getContentAreaHeight();
    const pageCardH = getPageCardHeight();

    // 전체 높이에 따라 필요한 페이지 수 계산
    const pageCount = Math.max(1, Math.ceil(totalHeight / contentH));

    pageSheetsLayer.innerHTML = '';
    for (let i = 0; i < pageCount; i++) {
      const sheet = document.createElement('div');
      sheet.className = 'page-sheet-bg';
      sheet.style.height = `${pageCardH}px`;
      sheet.style.top = `${i * (pageCardH + PAGE_GAP)}px`;

      const header = document.createElement('div');
      header.className = 'page-sheet-header';
      header.innerHTML = `<span>[ PAGE ${i + 1} ]</span><span>Yslide Document</span>`;

      sheet.appendChild(header);
      pageSheetsLayer.appendChild(sheet);
    }

    // 에디터 패딩 및 전체 높이 동기화
    editor.style.paddingTop = `${PADDING_TOP + HEADER_HEIGHT}px`;
    editor.style.paddingBottom = `${PADDING_BOTTOM}px`;
    editor.style.paddingLeft = '36px';
    editor.style.paddingRight = '36px';
    
    // 전체 artboard 높이 보정
    const totalArtboardHeight = pageCount * pageCardH + (pageCount - 1) * PAGE_GAP;
    document.getElementById('document-artboard').style.minHeight = `${totalArtboardHeight}px`;

    pageInfo.innerText = `${pageCount} 페이지`;
  }

  editor.addEventListener('input', () => {
    if (layoutTimer) clearTimeout(layoutTimer);
    layoutTimer = setTimeout(() => {
      updateLayout();
      saveToStorageSilent();
    }, 50);
  });

  window.addEventListener('resize', () => {
    updateLayout();
  });

  /* 서식 지정 */
  function formatDoc(cmd, value = null) {
    document.execCommand(cmd, false, value);
    editor.focus();
  }

  function applyTextColor(color, el) {
    activeColor = color;
    document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('selected'));
    if (el) el.classList.add('selected');
    formatDoc('foreColor', color);
  }

  function adjustLetterSpacing(delta) {
    currentLetterSpacing = parseFloat((currentLetterSpacing + delta).toFixed(1));
    editor.style.letterSpacing = `${currentLetterSpacing}px`;
    showToast(`자간: ${currentLetterSpacing}px`);
    updateLayout();
  }

  function adjustLineHeight(delta) {
    currentLineHeight = parseFloat(Math.max(1.0, currentLineHeight + delta).toFixed(2));
    editor.style.lineHeight = `${currentLineHeight}`;
    showToast(`줄간격: ${currentLineHeight}`);
    updateLayout();
  }

  function changeFontSize(delta) {
    currentFontSize = Math.min(48, Math.max(14, currentFontSize + delta));
    document.getElementById('size-display').innerText = currentFontSize;
    editor.style.fontSize = `${currentFontSize}px`;
    updateLayout();
  }

  function cycleFontFamily() {
    currentFontIndex = (currentFontIndex + 1) % FONT_LIST.length;
    const font = FONT_LIST[currentFontIndex];
    document.documentElement.style.setProperty('--active-font', font.family);
    document.getElementById('btn-font-cycle').innerText = font.name;
    showToast(`글꼴: ${font.name}`);
    updateLayout();
  }

  let alignIndex = 0;
  const ALIGN_MODES = ['left', 'center', 'right'];
  function cycleTextAlign() {
    alignIndex = (alignIndex + 1) % ALIGN_MODES.length;
    const mode = ALIGN_MODES[alignIndex];
    editor.style.textAlign = mode;
    showToast(`정렬: ${mode}`);
  }

  function execUndo() { document.execCommand('undo'); updateLayout(); }
  function execRedo() { document.execCommand('redo'); updateLayout(); }

  function insertPageBreak() {
    formatDoc('insertParagraph');
    formatDoc('insertHTML', '<div style="page-break-after: always; height: 16px; border-bottom: 2px dashed #444; margin: 24px 0;"></div>');
    updateLayout();
    showToast('페이지 구분선이 추가되었습니다');
  }

  /* 데이터 저장 및 로드 */
  function saveToStorageSilent() {
    localStorage.setItem('yslide_unified_doc', editor.innerHTML);
  }

  function saveDocument() {
    const html = editor.innerHTML;
    const blob = new Blob([html], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `Yslide_Document_${new Date().toISOString().slice(0,10)}.html`;
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('💾 문서가 저장되었습니다');
  }

  function handleFileImport(files) {
    if (!files || files.length === 0) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      editor.innerHTML = e.target.result;
      updateLayout();
      saveToStorageSilent();
      showToast('📂 파일을 불러왔습니다');
    };
    reader.readAsText(files[0]);
  }

  async function shareDocument() {
    const text = editor.innerText.trim();
    if (!text) return showToast('⚠️ 공유할 내용이 없습니다');
    if (navigator.share) {
      try {
        await navigator.share({ title: 'Yslide Document', text });
        showToast('📤 공유 완료');
      } catch (err) {}
    } else {
      navigator.clipboard.writeText(text);
      showToast('📋 클립보드에 복사되었습니다');
    }
  }

  function printDocument() {
    const printArea = document.getElementById('print-area');
    printArea.innerHTML = editor.innerHTML;
    window.print();
  }

  /* Gemini 번역 연동 */
  async function translateSelectionWithGemini() {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed) return showToast('⚠️ 번역할 문장을 마우스나 터치로 먼저 드래그하세요');

    const range = sel.getRangeAt(0);
    const container = document.createElement('div');
    container.appendChild(range.cloneContents());
    const originalHtml = container.innerHTML.trim();

    let apiKey = localStorage.getItem('yslide_gemini_api_key');
    if (!apiKey) {
      apiKey = prompt("Google Gemini API 키를 입력하세요:");
      if (!apiKey) return;
      localStorage.setItem('yslide_gemini_api_key', apiKey.trim());
    }

    showToast('🌐 Gemini AI 영문 번역 중...');
    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{
            parts: [{
              text: `Translate this text to natural English, keeping HTML markup:\n${originalHtml}`
            }]
          }]
        })
      });
      const data = await res.json();
      let translated = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if (translated) {
        translated = translated.replace(/^```html\s*/i, '').replace(/\s*```$/i, '').trim();
        document.execCommand('insertHTML', false, translated);
        updateLayout();
        showToast('✨ 번역 완료');
      }
    } catch (e) {
      showToast('⚠️ 번역 실패: API 키를 확인하세요');
    }
  }

  /* 전체화면 슬라이드 뷰어 */
  let currentSlide = 0;
  let slideChunks = [];
  function startPresentation() {
    const paragraphs = editor.innerHTML.split(/<div style="page-break[^>]*><\/div>|<br\s*[\/]?>\s*<br\s*[\/]?>/gi);
    slideChunks = paragraphs.filter(p => p.trim() !== '');
    if (slideChunks.length === 0) slideChunks = [editor.innerHTML || '내용이 없습니다'];

    const container = document.getElementById('reader-viewport');
    container.innerHTML = '';
    slideChunks.forEach((chunk, i) => {
      const slide = document.createElement('div');
      slide.className = `slide-sheet ${i === 0 ? 'active' : ''}`;
      slide.innerHTML = chunk;
      container.appendChild(slide);
    });

    currentSlide = 0;
    document.getElementById('reader-curr').innerText = '1';
    document.getElementById('reader-total').innerText = slideChunks.length;
    document.getElementById('reader-container').style.display = 'block';
  }

  function nextSlide() {
    const slides = document.querySelectorAll('.slide-sheet');
    if (currentSlide < slides.length - 1) {
      slides[currentSlide].classList.remove('active');
      currentSlide++;
      slides[currentSlide].classList.add('active');
      document.getElementById('reader-curr').innerText = currentSlide + 1;
    }
  }

  function prevSlide() {
    const slides = document.querySelectorAll('.slide-sheet');
    if (currentSlide > 0) {
      slides[currentSlide].classList.remove('active');
      currentSlide--;
      slides[currentSlide].classList.add('active');
      document.getElementById('reader-curr').innerText = currentSlide + 1;
    }
  }

  function exitReaderMode() {
    document.getElementById('reader-container').style.display = 'none';
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1500);
  }

  // 초기 실행
  const savedDoc = localStorage.getItem('yslide_unified_doc');
  if (savedDoc) editor.innerHTML = savedDoc;
  updateLayout();
</script>
</body>
</html>
