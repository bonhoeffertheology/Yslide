<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yslide Note</title>

<!-- PWA 메타 태그 및 아이콘 설정 -->
<meta name="theme-color" content="#181818">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yslide">

<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">

<!-- KoPubWorld 및 Pretendard CDN 로드 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-kopubworld@1.0.0/kopubworld.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

<style>
:root {
  --bg-main: #0a0a0a;
  --panel-bg: #181818;
  --border-color: #333333;
  --page-bg: #141414;
  --page-border: #444444;
  --text-color: #ffffff;
  --accent: #38bdf8;
  --toolbar-height: 96px;
  --page-width: min(820px, 92vw);
  --page-card-height: 80vh;
  --header-height: 42px;
  --page-gap: 28px;
  --active-font: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
  --ui-font: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  background: var(--bg-main);
  color: var(--text-color);
  font-family: var(--ui-font);
  overflow: hidden;
}

/* 상단 2단 고정 툴바 */
#header-toolbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--toolbar-height);
  background: var(--panel-bg);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 16px;
  z-index: 1000;
  user-select: none;
  gap: 6px;
}

.toolbar-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  height: 40px;
  overflow-x: auto;
  white-space: nowrap;
  gap: 8px;
}
.toolbar-row::-webkit-scrollbar { display: none; }

.toolbar-row-top {
  justify-content: flex-start;
  border-bottom: 1px solid #282828;
  padding-bottom: 4px;
  height: 38px;
  gap: 8px;
}

.tool-group {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

button {
  height: 32px;
  padding: 0 10px;
  background: #262626;
  border: 1px solid #484848;
  border-radius: 6px;
  color: #e5e5e5;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  flex-shrink: 0;
  transition: all 0.15s ease;
  font-family: var(--ui-font);
}
button:hover { background: #333333; }
button:active { transform: scale(0.97); }

.btn-icon { width: 32px; height: 32px; padding: 0; }

.icon-svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  display: block;
}

.divider {
  width: 1px;
  height: 20px;
  background: var(--border-color);
  margin: 0 2px;
  flex-shrink: 0;
}

#btn-continuous.active, #btn-batch-mode.active {
  background: #ea580c !important;
  border-color: #f97316 !important;
  color: #ffffff !important;
  box-shadow: 0 0 10px rgba(234, 88, 12, 0.6);
}

.color-btn {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid #555555;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.15s ease;
}
.color-btn.selected {
  border-color: #ffffff;
  transform: scale(1.2);
  box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
}
.c-white { background-color: #ffffff; }
.c-red { background-color: #ef4444; }
.c-yellow { background-color: #ffb703; }
.c-blue { background-color: #38bdf8; }
.c-green { background-color: #4ade80; }

.btn-font {
  height: 30px;
  padding: 0 10px;
  font-size: 12px;
  font-weight: bold;
  color: #d1d5db;
  background: #262626;
  border: 1px solid #484848;
  border-radius: 6px;
}

.size-box {
  display: inline-flex;
  align-items: center;
  background: #262626;
  border: 1px solid #484848;
  border-radius: 6px;
  padding: 2px 4px;
  gap: 2px;
  height: 32px;
  flex-shrink: 0;
}
.btn-size-step {
  width: 20px;
  height: 20px;
  padding: 0;
  background: transparent;
  border: none;
  color: #cccccc;
  font-size: 14px;
}
#size-display {
  font-size: 13px;
  font-weight: bold;
  min-width: 20px;
  text-align: center;
  color: #38bdf8;
}
#file-input { display: none; }

/* 뷰포트 레이아웃 */
#main-viewport {
  position: fixed;
  top: var(--toolbar-height);
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-main);
  z-index: 10;
  -webkit-overflow-scrolling: touch;
}
#main-viewport.view-scroll {
  overflow-y: auto;
  overflow-x: hidden;
  padding: 24px 16px 140px;
}
#main-viewport.view-scroll::-webkit-scrollbar { display: none; }

#main-viewport.view-page {
  overflow-x: auto;
  overflow-y: hidden;
  display: flex;
  align-items: center;
  padding: 0;
  scroll-snap-type: x mandatory;
}
#main-viewport.view-page::-webkit-scrollbar { display: none; }

#document-editor {
  width: 100%;
  min-height: 100%;
  outline: none;
  caret-color: #ffffff;
  position: relative;
  user-select: text;
  -webkit-user-select: text;
}
.view-scroll #document-editor {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--page-gap);
  padding-bottom: 40px;
}
.view-page #document-editor {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 0;
  min-width: max-content;
  height: 100%;
}

.page-lens-wrapper {
  flex: 0 0 100vw;
  width: 100vw;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  scroll-snap-align: center;
  scroll-snap-stop: always;
  padding: 12px;
}

.note-page-card {
  width: var(--page-width);
  max-width: 820px;
  height: var(--page-card-height);
  min-height: 460px;
  background: var(--page-bg);
  border: 2px solid var(--page-border);
  border-radius: 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.95), 0 0 0 1px rgba(255,255,255,0.05);
  position: relative;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
  user-select: text;
}

.page-header {
  height: var(--header-height);
  background: #1a1a1a;
  border-bottom: 1px solid #333333;
  display: grid;
  grid-template-columns: 110px 1fr 60px;
  align-items: center;
  padding: 0 12px 0 16px;
  font-size: 13px;
  color: #888888;
  flex-shrink: 0;
  box-sizing: border-box;
  z-index: 20;
  user-select: none !important;
  -webkit-user-select: none !important;
}

.page-header::selection, .page-header *::selection {
  background: transparent !important;
  color: inherit !important;
}

.page-badge {
  font-weight: bold;
  user-select: none;
  cursor: default;
}

.page-title-input {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: #ffffff;
  font-size: 15px;
  font-weight: 600;
  text-align: center;
  font-family: var(--ui-font);
  padding: 4px 8px;
  user-select: text;
}
.page-title-input::placeholder { color: #555555; }
.page-title-input:focus { color: #38bdf8; }

.btn-page-delete {
  width: 28px;
  height: 28px;
  background: #262626;
  border: 1px solid #484848;
  border-radius: 6px;
  color: #e5e5e5;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  justify-self: end;
  transition: all 0.15s ease;
}
.btn-page-delete:hover {
  background: #333333;
  color: #ef4444;
}

.page-content {
  flex: 1;
  width: 100%;
  height: calc(100% - var(--header-height));
  padding: 24px 36px;
  color: #ffffff;
  font-size: 26px;
  line-height: 1.55;
  outline: none;
  white-space: pre-wrap;
  word-break: break-word;
  overflow: hidden;
  cursor: text;
  font-family: var(--active-font);
  box-sizing: border-box;
  overflow-wrap: anywhere;
  caret-color: #ffffff;
}

.page-content:empty:before, .page-content.is-empty:before {
  content: "여기를 클릭하여 글을 작성하거나 긴 글을 붙여넣으세요.";
  color: #666666;
  pointer-events: none;
}

body.paint-mode .page-content {
  cursor: crosshair !important;
  user-select: none;
}

/* 10px 플로팅 스크롤바 */
#floating-scrollbar-track {
  position: fixed;
  top: calc(var(--toolbar-height) + 12px);
  bottom: 80px;
  right: 4px;
  width: 18px;
  background: transparent;
  z-index: 2000;
  cursor: pointer;
}

#floating-scrollbar-thumb {
  position: absolute;
  top: 0;
  right: 2px;
  width: 10px;
  min-height: 36px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.6);
  box-shadow: 0 0 8px rgba(0, 0, 0, 0.7), inset 0 0 2px rgba(255, 255, 255, 0.6);
  opacity: 0;
  transition: opacity 0.3s ease, width 0.15s ease, background 0.2s ease;
  touch-action: none;
}
#floating-scrollbar-thumb.visible { opacity: 0.9; }
#floating-scrollbar-thumb:hover, #floating-scrollbar-thumb.active {
  width: 12px;
  background: rgba(255, 255, 255, 0.95);
  box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
}

#bottom-dock {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(26, 26, 26, 0.95);
  border: 1px solid #444444;
  padding: 6px 18px;
  border-radius: 30px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.8);
  z-index: 1000;
  backdrop-filter: blur(8px);
}
#page-info { font-size: 13px; font-weight: bold; color: #d1d5db; }

/* 슬라이드 뷰어 */
#reader-container {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  background: #000000;
  z-index: 5000;
  user-select: none;
  overflow: hidden;
}
#reader-viewport {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}
.slide-sheet {
  width: var(--page-width);
  max-width: 820px;
  height: var(--page-card-height);
  min-height: 480px;
  background: var(--page-bg);
  border: 1px solid #383838;
  border-radius: 8px;
  padding: 28px 40px;
  color: #ffffff;
  font-size: 26px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
  overflow: hidden;
  display: none;
  box-sizing: border-box;
  font-family: var(--active-font);
}
.slide-sheet.active { display: block; }
.slide-title-header {
  font-size: 20px;
  font-weight: bold;
  color: #38bdf8;
  text-align: center;
  margin-bottom: 20px;
  padding-bottom: 8px;
  border-bottom: 1px solid #333333;
}
.touch-zone {
  position: absolute;
  top: 0; bottom: 0; width: 50%;
  cursor: pointer;
  z-index: 5500;
  -webkit-tap-highlight-color: transparent;
}
#touch-left { left: 0; }
#touch-right { right: 0; }
#exit-reader-btn {
  position: absolute;
  top: 18px; right: 24px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: rgba(40, 40, 40, 0.85);
  border: 1px solid #666666;
  color: #ffffff;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  z-index: 6000;
}
#reader-page-badge {
  position: absolute;
  top: 22px; left: 24px;
  background: rgba(30, 30, 30, 0.85);
  border: 1px solid #444444;
  padding: 6px 14px;
  border-radius: 12px;
  color: #ffb703;
  font-size: 14px;
  font-weight: bold;
  z-index: 6000;
}

#print-area { display: none; }
@media print {
  @page { margin: 15mm; size: auto; }
  html, body {
    position: static !important;
    overflow: visible !important;
    background: #ffffff !important;
    color: #000000 !important;
    height: auto !important;
  }
  #header-toolbar, #main-viewport, #bottom-dock, #reader-container, #toast, #floating-scrollbar-track {
    display: none !important;
  }
  #print-area { display: block !important; width: 100% !important; background: #ffffff !important; }
  .print-page-sheet {
    page-break-after: always !important;
    break-after: page !important;
    padding: 10px 0 20px;
    color: #000000 !important;
    font-size: 18pt !important;
    line-height: 1.6 !important;
    white-space: pre-wrap !important;
    word-break: break-word !important;
    font-family: var(--active-font);
  }
  .print-page-sheet:last-child { page-break-after: avoid !important; break-after: avoid !important; }
  .print-page-header {
    font-size: 12pt;
    font-weight: bold;
    color: #444444;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #dddddd;
    margin-bottom: 15px;
    padding-bottom: 4px;
  }
}

#toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(30, 30, 30, 0.95);
  border: 1px solid #555555;
  color: #38bdf8;
  padding: 8px 18px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: bold;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 9000;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- 상단 2단 툴바 -->
<div id="header-toolbar">
  <div class="toolbar-row toolbar-row-top">
    <div class="tool-group">
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLetterSpacing(-0.5)" title="자간 좁게">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <line x1="4" y1="12" x2="10" y2="12"></line>
          <polyline points="7 9 10 12 7 15"></polyline>
          <line x1="20" y1="12" x2="14" y2="12"></line>
          <polyline points="17 9 14 12 17 15"></polyline>
        </svg>
      </button>
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLetterSpacing(0.5)" title="자간 넓게">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <line x1="10" y1="12" x2="4" y2="12"></line>
          <polyline points="7 9 4 12 7 15"></polyline>
          <line x1="14" y1="12" x2="20" y2="12"></line>
          <polyline points="17 9 20 12 17 15"></polyline>
        </svg>
      </button>

      <div class="divider"></div>

      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLineHeight(-0.1)" title="줄간격 좁게">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <polyline points="9 6 12 9 15 6"></polyline>
          <line x1="12" y1="2" x2="12" y2="9"></line>
          <polyline points="9 18 12 15 15 18"></polyline>
          <line x1="12" y1="22" x2="12" y2="15"></line>
        </svg>
      </button>
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLineHeight(0.1)" title="줄간격 넓게">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <polyline points="8 6 12 2 16 6"></polyline>
          <line x1="12" y1="2" x2="12" y2="10"></line>
          <polyline points="8 18 12 22 16 18"></polyline>
          <line x1="12" y1="22" x2="12" y2="14"></line>
        </svg>
      </button>

      <div class="divider"></div>

      <button id="btn-font-cycle" class="btn-font" onclick="cycleFontFamily()" title="글꼴 변경">기본</button>

      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="toggleBold()" title="볼드체">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
          <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
        </svg>
      </button>

      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="toggleItalic()" title="이탤릭체">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <line x1="19" y1="4" x2="10" y2="4"></line>
          <line x1="14" y1="20" x2="5" y2="20"></line>
          <line x1="15" y1="4" x2="9" y2="20"></line>
        </svg>
      </button>

      <button id="btn-align-cycle" class="btn-icon" onmousedown="event.preventDefault()" onclick="cycleTextAlign()" title="정렬 변경">
        <svg id="icon-align" class="icon-svg" viewBox="0 0 24 24">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="15" y2="12"></line>
          <line x1="3" y1="18" x2="18" y2="18"></line>
        </svg>
      </button>

      <button id="btn-batch-mode" class="btn-icon" onmousedown="event.preventDefault()" onclick="toggleBatchMode()" title="모든 페이지 일괄 서식 적용 모드">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
      </button>

      <div class="divider"></div>

      <button id="btn-view-mode" class="btn-icon" onclick="toggleViewMode()" title="스크롤 / 페이지 모드 전환">
        <svg id="icon-view-mode" class="icon-svg" viewBox="0 0 24 24">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
      </button>

      <div class="divider"></div>

      <button id="btn-install-app" class="btn-icon" onclick="promptInstallApp()" style="display:none; background:#0284c7; border-color:#38bdf8;" title="앱 설치">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="toolbar-row">
    <div class="tool-group">
      <button class="btn-icon" onclick="document.getElementById('file-input').click()" title="파일 불러오기 (.txt, .json)">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path>
        </svg>
      </button>
      <input type="file" id="file-input" accept=".txt,.json" onchange="handleFileImport(this.files)">

      <button class="btn-icon" onclick="saveNoteData()" title="저장">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
      </button>

      <button class="btn-icon" onclick="shareNoteContent()" title="텍스트 공유">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
      </button>

      <button class="btn-icon" onclick="printNoteDocument()" title="문서 인쇄">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <polyline points="6 9 6 2 18 2 18 9"></polyline>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
          <rect x="6" y="14" width="12" height="8"></rect>
        </svg>
      </button>

<script>
const PLACEHOLDER_TEXT = '여기를 클릭하여 글을 작성하거나 긴 글을 붙여넣으세요.';
const FONT_LIST = [
  { name: '기본', family: "-apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', sans-serif" },
  { name: 'KoPub 돋움', family: "'KoPubWorld Dotum', sans-serif" },
  { name: 'KoPub 바탕', family: "'KoPubWorld Batang', serif" }
];
const ALIGN_MODES = ['left', 'center', 'right'];
const ALIGN_NAMES = ['좌측 정렬', '가운데 정렬', '우측 정렬'];

let currentFontIndex = 0, activeColor = '#ef4444', isContinuousMode = false, isBatchMode = false, isPainting = false, lastPaintedKey = '';
let currentFontSize = 26, globalLetterSpacing = 0, globalLineHeight = 1.55, globalIsBold = false, globalIsItalic = false, currentTextAlignIndex = 0;
let viewMode = 'scroll', pageMeta = [], documentHTML = '', undoStack = [], redoStack = [], MAX_HISTORY = 40;
let isReflowing = false, reflowTimer = null, currentReaderIndex = 0, isReaderOpen = false, toastTimer = null;

let lastWindowWidth = window.innerWidth;

const viewport = document.getElementById('main-viewport');
const readerViewport = document.getElementById('reader-viewport');
const btnFontCycle = document.getElementById('btn-font-cycle'), btnBatchMode = document.getElementById('btn-batch-mode'), btnViewMode = document.getElementById('btn-view-mode');
const iconViewMode = document.getElementById('icon-view-mode'), iconAlign = document.getElementById('icon-align');
const scrollbarThumb = document.getElementById('floating-scrollbar-thumb'), scrollbarTrack = document.getElementById('floating-scrollbar-track');

/* 서비스 워커 및 PWA 설치 등록 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById('btn-install-app');
  if (btn) btn.style.display = 'inline-flex';
});

function promptInstallApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(() => {
      deferredPrompt = null;
      const btn = document.getElementById('btn-install-app');
      if (btn) btn.style.display = 'none';
    });
  } else {
    showToast('💡 브라우저 메뉴의 [홈 화면에 추가] 또는 [설치]를 눌러주세요');
  }
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
function getDynamicAvailableHeight() { return Math.max(300, window.innerHeight * 0.8 - 42 - 48); }
function getDynamicCardWidth() { return Math.min(820, window.innerWidth * 0.92); }

function getMeasureBox() {
  let b = document.getElementById('yslide-measure-box');
  if (!b) {
    b = document.createElement('div');
    b.id = 'yslide-measure-box';
    b.style.cssText = 'position:fixed;left:-100000px;top:0;visibility:hidden;pointer-events:none;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;box-sizing:border-box;';
    document.body.appendChild(b);
  }
  b.style.width = (getDynamicCardWidth() - 72) + 'px';
  b.style.fontSize = currentFontSize + 'px';
  b.style.fontFamily = FONT_LIST[currentFontIndex].family;
  b.style.letterSpacing = globalLetterSpacing + 'px';
  b.style.lineHeight = globalLineHeight;
  b.style.textAlign = ALIGN_MODES[currentTextAlignIndex];
  return b;
}

function paginateDocument() {
  if (!documentHTML || !documentHTML.trim()) return [''];

  const measureBox = getMeasureBox();
  const maxHeight = getDynamicAvailableHeight();
  const rawParts = documentHTML.split(/<br\s*[\/]?>/gi);
  const pages = [];
  let currentLines = [];

  for (let i = 0; i < rawParts.length; i++) {
    let part = rawParts[i];

    if (part === '') {
      const test = [...currentLines, ''].join('<br>');
      measureBox.innerHTML = test || '<br>';
      if (measureBox.offsetHeight <= maxHeight) {
        currentLines.push('');
      } else {
        pages.push(currentLines.join('<br>'));
        currentLines = [''];
      }
      continue;
    }

    while (part.length > 0) {
      const candidate = [...currentLines, part].join('<br>');
      measureBox.innerHTML = candidate;

      if (measureBox.offsetHeight <= maxHeight) {
        currentLines.push(part);
        break;
      } else {
        const words = part.split(' ');
        let lo = 0, hi = words.length, best = 0;

        while (lo <= hi) {
          const mid = Math.floor((lo + hi) / 2);
          const chunk = words.slice(0, mid).join(' ');
          const testCandidate = [...currentLines, chunk].join('<br>');
          measureBox.innerHTML = testCandidate;

          if (measureBox.offsetHeight <= maxHeight) {
            best = mid;
            lo = mid + 1;
          } else {
            hi = mid - 1;
          }
        }

        if (best > 0) {
          const fitChunk = words.slice(0, best).join(' ');
          currentLines.push(fitChunk);
          pages.push(currentLines.join('<br>'));
          currentLines = [];
          part = words.slice(best).join(' ').trim();
        } else {
          if (currentLines.length > 0) {
            pages.push(currentLines.join('<br>'));
            currentLines = [];
          } else {
            const charCount = Math.max(10, Math.floor(part.length / 2));
            currentLines.push(part.slice(0, charCount));
            pages.push(currentLines.join('<br>'));
            currentLines = [];
            part = part.slice(charCount).trim();
          }
        }
      }
    }
  }

  if (currentLines.length) pages.push(currentLines.join('<br>'));
  return pages.length ? pages : [''];
}

function captureGlobalCaret() {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return null;
  const range = sel.getRangeAt(0);
  const root = document.getElementById('document-editor');
  if (!root || !root.contains(range.startContainer)) return null;

  let offset = 0;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
  let node;
  while ((node = walker.nextNode())) {
    if (node.parentElement && node.parentElement.closest('.page-header')) continue;
    if (node === range.startContainer) {
      return offset + range.startOffset;
    }
    offset += node.textContent.length;
  }
  return offset;
}

function restoreGlobalCaret(targetOffset) {
  if (targetOffset === null) return;
  const root = document.getElementById('document-editor');
  if (!root) return;

  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
  let node, accumulated = 0;

  while ((node = walker.nextNode())) {
    if (node.parentElement && node.parentElement.closest('.page-header')) continue;
    const len = node.textContent.length;
    if (accumulated + len >= targetOffset) {
      const range = document.createRange();
      range.setStart(node, Math.min(targetOffset - accumulated, len));
      range.collapse(true);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      return;
    }
    accumulated += len;
  }

  const allContents = root.querySelectorAll('.page-content');
  const last = allContents[allContents.length - 1];
  if (last) {
    const range = document.createRange();
    range.selectNodeContents(last);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
}

function renderPages(savedCaret = null) {
  if (isReflowing) return;
  isReflowing = true;

  const oldScrollTop = viewport.scrollTop;
  const oldScrollLeft = viewport.scrollLeft;
  const pages = paginateDocument();

  while (pageMeta.length < pages.length) pageMeta.push({ title: '', align: 'left' });
  if (pageMeta.length > pages.length) pageMeta = pageMeta.slice(0, pages.length);

  let root = document.getElementById('document-editor');
  if (!root) {
    root = document.createElement('div');
    root.id = 'document-editor';
    root.contentEditable = 'true';
    root.spellcheck = false;
    viewport.appendChild(root);
    bindRootEvents(root);
  }

  const fragment = document.createDocumentFragment();

  pages.forEach((html, index) => {
    const card = document.createElement('div');
    card.className = 'note-page-card';
    card.dataset.index = index;

    const header = document.createElement('div');
    header.className = 'page-header';
    header.contentEditable = 'false';

    const badge = document.createElement('span');
    badge.className = 'page-badge';
    badge.textContent = `[ PAGE ${index + 1} ]`;

    const title = document.createElement('input');
    title.className = 'page-title-input';
    title.type = 'text';
    title.placeholder = '제목을 입력하세요';
    title.value = pageMeta[index]?.title || '';
    title.addEventListener('input', e => {
      pageMeta[index].title = e.target.value;
      saveModel();
    });

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'btn-page-delete';
    del.title = '이 페이지 삭제';
    del.setAttribute('contenteditable', 'false');
    del.innerHTML = `
      <svg class="icon-svg" viewBox="0 0 24 24" style="width:15px;height:15px">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      </svg>
    `;
    del.addEventListener('mousedown', e => e.preventDefault());
    del.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      deletePage(index);
    });

    header.append(badge, title, del);
    card.appendChild(header);

    const content = document.createElement('div');
    content.className = 'page-content';
    content.innerHTML = html || '';
    content.style.textAlign = pageMeta[index]?.align || 'left';
    content.style.fontSize = currentFontSize + 'px';
    content.style.letterSpacing = globalLetterSpacing + 'px';
    content.style.lineHeight = globalLineHeight;
    content.style.fontWeight = globalIsBold ? 'bold' : 'normal';
    content.style.fontStyle = globalIsItalic ? 'italic' : 'normal';

    attachContinuousEvents(content, index);

    card.appendChild(content);

    if (viewMode === 'page') {
      const wrap = document.createElement('div');
      wrap.className = 'page-lens-wrapper';
      wrap.appendChild(card);
      fragment.appendChild(wrap);
    } else {
      fragment.appendChild(card);
    }
  });

  root.replaceChildren(fragment);
  updatePageInfo();
  isReflowing = false;

  viewport.scrollTop = oldScrollTop;
  viewport.scrollLeft = oldScrollLeft;
  updateFloatingScrollbar();

  if (savedCaret !== null) {
    requestAnimationFrame(() => restoreGlobalCaret(savedCaret));
  }
}

function serializeAllContent() {
  const root = document.getElementById('document-editor');
  if (!root) return documentHTML || '';
  const contents = root.querySelectorAll('.page-content');
  let fullHtml = '';
  contents.forEach((c, idx) => {
    if (idx > 0 && fullHtml && !fullHtml.endsWith('<br>') && !c.innerHTML.startsWith('<br>')) {
      fullHtml += '<br>';
    }
    fullHtml += c.innerHTML;
  });
  return fullHtml;
}

/* 💡 핵심: 전역 단일 문서 모델 기준 백스페이스 및 개행 제어 */
function bindRootEvents(root) {
  root.addEventListener('input', (e) => {
    if (isReflowing || e.target.closest('.page-title-input')) return;

    documentHTML = serializeAllContent();
    saveModel();

    if (e.isComposing) return;

    const targetContent = window.getSelection()?.anchorNode?.parentElement?.closest('.page-content');
    if (targetContent && (targetContent.scrollHeight > targetContent.clientHeight + 4)) {
      if (reflowTimer) clearTimeout(reflowTimer);
      reflowTimer = setTimeout(() => {
        const caret = captureGlobalCaret();
        renderPages(caret);
      }, 100);
    }
  });

  root.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') {
      e.preventDefault();
      selectAllPages();
      return;
    }

    const sel = window.getSelection();

    // 1줄 개행
    if (e.key === 'Enter') {
      e.preventDefault();
      pushHistory();
      document.execCommand('insertLineBreak');
      documentHTML = serializeAllContent();
      saveModel();

      const targetContent = sel?.anchorNode?.parentElement?.closest('.page-content');
      if (targetContent && (targetContent.scrollHeight > targetContent.clientHeight + 4)) {
        if (reflowTimer) clearTimeout(reflowTimer);
        reflowTimer = setTimeout(() => {
          renderPages(captureGlobalCaret());
        }, 60);
      }
      return;
    }

    // 💡 페이지 첫머리 백스페이스: 전체 문서 기준에서 앞 글자/개행만 안전하게 제거
    if (e.key === 'Backspace' && sel && sel.rangeCount && sel.isCollapsed) {
      const activeCard = sel.anchorNode?.parentElement?.closest('.note-page-card');
      const pageIndex = activeCard ? parseInt(activeCard.dataset.index, 10) : 0;
      const currentContent = activeCard ? activeCard.querySelector('.page-content') : null;

      if (currentContent) {
        const probeRange = document.createRange();
        probeRange.selectNodeContents(currentContent);
        probeRange.setEnd(sel.anchorNode, sel.anchorOffset);
        const isAtPageStart = probeRange.toString().length === 0;

        if (isAtPageStart) {
          e.preventDefault(); // 헤더 삭제 동작 원천 차단

          if (pageIndex > 0) {
            pushHistory();
            const currentGlobalOffset = captureGlobalCaret() || 0;

            if (currentGlobalOffset > 0) {
              // 1. 전체 문서 HTML에서 현재 위치 직전의 경계(<br> 또는 공백)만 정밀하게 1개 삭제
              let html = serializeAllContent();
              
              // 1페이지 끝과 2페이지 시작 사이의 줄바꿈 또는 공백 제거
              const beforeCaretHtml = html.slice(0, currentGlobalOffset);
              const afterCaretHtml = html.slice(currentGlobalOffset);

              if (/<br\s*[\/]?>$/i.test(beforeCaretHtml)) {
                html = beforeCaretHtml.replace(/<br\s*[\/]?>$/i, '') + afterCaretHtml;
              } else if (/\s$/i.test(beforeCaretHtml)) {
                html = beforeCaretHtml.slice(0, -1) + afterCaretHtml;
              } else {
                html = beforeCaretHtml.slice(0, -1) + afterCaretHtml;
              }

              documentHTML = html;
              saveModel();

              // 2. 커서는 1페이지의 마지막 글자 바로 뒤 위치(currentGlobalOffset - 1)에 정확히 복구
              const newCaretPos = Math.max(0, currentGlobalOffset - 1);
              renderPages(newCaretPos);

              // 3. 화면이 튀지 않고 1페이지 끝을 유지하도록 부드럽게 스크롤
              const prevCard = root.querySelectorAll('.note-page-card')[pageIndex - 1];
              if (prevCard) {
                prevCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
              }
            }
          }
          return;
        }
      }
      pushHistory();
      return;
    }

    if (e.key === 'Delete') {
      pushHistory();
      return;
    }
  });

  root.addEventListener('paste', (e) => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    if (!text) return;

    pushHistory();
    const formatted = text.replace(/\r\n/g, '<br>').replace(/\n/g, '<br>');

    const sel = window.getSelection();
    const startCaret = captureGlobalCaret() || 0;

    const allContents = root.querySelectorAll('.page-content');
    if (allContents.length > 0 && sel && sel.toString().length > 30 && sel.toString().trim() === root.innerText.trim()) {
      documentHTML = formatted;
      renderPages(formatted.length);
      saveModel();
      showToast('📋 전체 원고가 교체되었습니다');
      return;
    }

    if (sel && sel.rangeCount) {
      const range = sel.getRangeAt(0);
      range.deleteContents();
      const tempNode = document.createElement('div');
      tempNode.innerHTML = formatted;
      const frag = document.createDocumentFragment();
      while (tempNode.firstChild) frag.appendChild(tempNode.firstChild);
      range.insertNode(frag);
    } else {
      documentHTML = (documentHTML ? documentHTML + '<br>' : '') + formatted;
    }

    documentHTML = serializeAllContent();
    saveModel();
    renderPages(startCaret + text.length);
    showToast('📋 붙여넣기가 완료되었습니다');
  });
}

function selectAllPages() {
  const root = document.getElementById('document-editor');
  if (!root) return;
  const contents = root.querySelectorAll('.page-content');
  if (!contents.length) return;

  const first = contents[0];
  const last = contents[contents.length - 1];

  const range = document.createRange();
  range.setStart(first, 0);
  range.setEnd(last, last.childNodes.length);

  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

document.addEventListener('copy', (e) => {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;

  const range = sel.getRangeAt(0);
  const clone = range.cloneContents();
  clone.querySelectorAll('.page-header').forEach(h => h.remove());

  const temp = document.createElement('div');
  temp.appendChild(clone);

  const plainText = temp.innerText.trim();
  if (plainText) {
    e.clipboardData.setData('text/plain', plainText);
    e.clipboardData.setData('text/html', temp.innerHTML);
    e.preventDefault();
  }
});

function deletePage(index) {
  const root = document.getElementById('document-editor');
  const contents = root ? root.querySelectorAll('.page-content') : document.querySelectorAll('.page-content');

  if (contents.length <= 1) {
    showToast('⚠️ 마지막 남은 페이지는 삭제할 수 없습니다');
    return;
  }
  if (index < 0 || index >= contents.length) return;

  pushHistory();
  const caretBefore = captureGlobalCaret();

  const pageHtml = contents[index].innerHTML;
  const previousHtml = index > 0 ? contents[index - 1].innerHTML : '';

  if (index > 0) {
    contents[index - 1].innerHTML = previousHtml + pageHtml;
  } else {
    contents[1].innerHTML = pageHtml + contents[1].innerHTML;
  }

  pageMeta.splice(index, 1);
  documentHTML = serializeAllContent();
  saveModel();

  renderPages(caretBefore);
  showToast('🗑️ 페이지가 삭제되었습니다');
}

function addNewPage() {
  pushHistory();
  documentHTML = serializeAllContent() + '<br><br>';
  pageMeta.push({ title: '', align: 'left' });
  renderPages();
  saveModel();
  setTimeout(() => {
    const cards = document.querySelectorAll('.note-page-card');
    const lastCard = cards[cards.length - 1];
    if (lastCard) {
      lastCard.scrollIntoView({ behavior: 'smooth' });
      const ed = lastCard.querySelector('.page-content');
      if (ed) ed.focus();
    }
  }, 50);
  showToast('📄 새 페이지가 추가되었습니다');
}

/* 서식 및 툴바 상태 유지 */
let formatSelectionRange = null;
let colorPreview = null;

function rememberFormatSelection() {
  const root = document.getElementById('document-editor');
  const sel = window.getSelection();
  if (!root || !sel || !sel.rangeCount) return;
  const r = sel.getRangeAt(0);
  if (root.contains(r.commonAncestorContainer) && !r.collapsed) {
    formatSelectionRange = r.cloneRange();
  }
}

function restoreFormatSelection() {
  const root = document.getElementById('document-editor');
  if (!root || !formatSelectionRange || !root.contains(formatSelectionRange.commonAncestorContainer)) return false;
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(formatSelectionRange.cloneRange());
  return true;
}

function applySelectionCommand(command, value = null) {
  if (!restoreFormatSelection()) return false;
  const ok = document.execCommand(command, false, value);
  rememberFormatSelection();
  documentHTML = serializeAllContent();
  saveModel();
  return ok;
}

document.addEventListener('selectionchange', () => {
  const root = document.getElementById('document-editor');
  const sel = window.getSelection();
  if (!root || !sel || !sel.rangeCount) return;
  const r = sel.getRangeAt(0);
  if (root.contains(r.commonAncestorContainer) && !r.collapsed) {
    formatSelectionRange = r.cloneRange();
  }
});

document.addEventListener('mousedown', (e) => {

  if (t && t.closest && (t.closest('#btn-align-cycle') || t.closest('.color-btn') || t.closest('#btn-bold') || t.closest('#btn-italic'))) {

function removeColorPreview() {
  if (colorPreview) {

function showColorPreview(color) {
  if (!formatSelectionRange) return;
  removeColorPreview();

  const rects = Array.from(formatSelectionRange.getClientRects()).filter(r => r.width > 0 && r.height > 0);
  if (!rects.length) return;

  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:2147483646;';
  rects.forEach(r => {
    const el = document.createElement('div');
    el.style.cssText = `position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;background:${color};opacity:.48;mix-blend-mode:multiply;border-radius:1px;`;
    host.appendChild(el);
  });
  document.body.appendChild(host);
  colorPreview = host;
}

function installColorPreview() {

    const color = activeColor;
    if (!color) return;

    rememberFormatSelection();
    if (!formatSelectionRange) return;

    e.preventDefault();
    e.stopPropagation();
    showColorPreview(color);
    try { btn.setPointerCapture(e.pointerId); } catch (_) {}
  }, true);

  toolbar.addEventListener('pointerup', e => {
    const btn = e.target.closest('.color-btn');
    if (!btn || !formatSelectionRange) return;
    e.preventDefault();
    e.stopPropagation();
    removeColorPreview();
    applySelectionCommand('foreColor', activeColor);
    restoreFormatSelection();
  }, true);

  window.addEventListener('pointerup', () => {
    if (colorPreview) removeColorPreview();
  }, true);
}

function attachContinuousEvents(contentEl, pageIdx) {
  function paintAt(x, y) {
    let r = document.caretRangeFromPoint ? document.caretRangeFromPoint(x, y) : null;
    if (!r) return;

    let n = r.startContainer;
    if (n.nodeType !== Node.TEXT_NODE) {
      if (n.childNodes.length > 0 && r.startOffset < n.childNodes.length) {
        n = n.childNodes[r.startOffset];
        while (n && n.nodeType !== Node.TEXT_NODE && n.firstChild) n = n.firstChild;
      }
    }

    if (n && n.nodeType === Node.TEXT_NODE) {
      const txt = n.textContent;
      const off = r.startOffset;
      let a = Math.min(off, txt.length > 0 ? txt.length - 1 : 0);
      while (a > 0 && !/\s/.test(txt[a - 1])) a--;
      let b = off;
      while (b < txt.length && !/\s/.test(txt[b])) b++;

      if (a < b) {
        const key = `${n.textContent}_${a}_${b}`;
        if (key === lastPaintedKey) return;
        lastPaintedKey = key;

        const wr = document.createRange();
        wr.setStart(n, a);
        wr.setEnd(n, b);

        const s = window.getSelection();
        s.removeAllRanges();
        s.addRange(wr);
        document.execCommand('foreColor', false, activeColor);
        s.removeAllRanges();

        documentHTML = serializeAllContent();
        saveModel();
      }
    }
  }

  contentEl.addEventListener('touchstart', e => {
    if (isContinuousMode) {
      pushHistory();
      isPainting = true;
      paintAt(e.touches[0].clientX, e.touches[0].clientY);
      e.preventDefault();
    }
  }, { passive: false });

  contentEl.addEventListener('touchmove', e => {
    if (isContinuousMode && isPainting) {
      paintAt(e.touches[0].clientX, e.touches[0].clientY);
      e.preventDefault();
    }
  }, { passive: false });

  contentEl.addEventListener('mousedown', e => {
    if (isContinuousMode) {
      pushHistory();
      isPainting = true;
      paintAt(e.clientX, e.clientY);
      e.preventDefault();
    }
  });

  contentEl.addEventListener('mousemove', e => {
    if (isContinuousMode && isPainting) {
      paintAt(e.clientX, e.clientY);
      e.preventDefault();
    }
  });
}

function getCurrentPageIndex() {

    let node = sel.anchorNode;

      if (node.classList && node.classList.contains('note-page-card')) {
        return parseInt(node.dataset.index, 10) || 0;
      }

    }

function saveModel() {
  try {
    localStorage.setItem('yslide_note_document_v61', JSON.stringify({
      version: 61,
      html: documentHTML,
      pageMeta,
      viewMode
    }));
  } catch (e) {}
}

function pushHistory() {
  const st = JSON.stringify({ html: documentHTML, pageMeta });
  if (!undoStack.length || undoStack[undoStack.length - 1] !== st) {
    undoStack.push(st);
    if (undoStack.length > MAX_HISTORY) undoStack.shift();
    redoStack = [];
  }
}

function undo() {
  if (undoStack.length <= 1) {
    showToast('⚠️ 더 이상 되돌릴 작업이 없습니다');
    return;
  }
  const cur = undoStack.pop();
  redoStack.push(cur);
  const prev = JSON.parse(undoStack[undoStack.length - 1]);
  documentHTML = prev.html || '';
  pageMeta = prev.pageMeta || [];
  renderPages();
  saveModel();
  showToast('↶ 되돌리기');
}

function redo() {
  if (!redoStack.length) {
    showToast('⚠️ 다시 실행할 작업이 없습니다');
    return;
  }
  const n = redoStack.pop();
  undoStack.push(n);
  const next = JSON.parse(n);
  documentHTML = next.html || '';
  pageMeta = next.pageMeta || [];
  renderPages();
  saveModel();
  showToast('↷ 다시 실행');
}

function updateFloatingScrollbar() {
  if (!scrollbarThumb || viewMode !== 'scroll') {
    scrollbarThumb?.classList.remove('visible');
    return;
  }
  const sh = viewport.scrollHeight, ch = viewport.clientHeight;
  if (sh <= ch + 10) {
    scrollbarThumb.classList.remove('visible');
    return;
  }
  const th = Math.max(36, (ch / sh) * scrollbarTrack.clientHeight);
  const max = sh - ch;
  const top = (viewport.scrollTop / max) * (scrollbarTrack.clientHeight - th);
  scrollbarThumb.style.height = `${th}px`;
  scrollbarThumb.style.transform = `translateY(${top}px)`;
  scrollbarThumb.classList.add('visible');

  clearTimeout(window._sf);
  window._sf = setTimeout(() => {
    if (!isDrag) scrollbarThumb.classList.remove('visible');
  }, 1400);
}

viewport.addEventListener('scroll', updateFloatingScrollbar, { passive: true });

let isDrag = false, startY = 0, startScroll = 0;

function onDragStart(clientY) {
  isDrag = true;
  startY = clientY;
  startScroll = viewport.scrollTop;
  scrollbarThumb.classList.add('active', 'visible');
  document.body.style.userSelect = 'none';
}

function onDragMove(clientY) {
  if (!isDrag) return;
  const trackH = scrollbarTrack.clientHeight - scrollbarThumb.clientHeight;
  const scrollH = viewport.scrollHeight - viewport.clientHeight;
  if (trackH > 0) {
    viewport.scrollTop = startScroll + ((clientY - startY) / trackH) * scrollH;
  }
}

function onDragEnd() {
  if (isDrag) {
    isDrag = false;
    scrollbarThumb.classList.remove('active');
    document.body.style.userSelect = '';
    clearTimeout(window._sf);
    window._sf = setTimeout(() => scrollbarThumb.classList.remove('visible'), 1200);
  }
}

scrollbarThumb.addEventListener('mousedown', e => {
  onDragStart(e.clientY);
  e.preventDefault();
});
window.addEventListener('mousemove', e => onDragMove(e.clientY));
window.addEventListener('mouseup', onDragEnd);

scrollbarThumb.addEventListener('touchstart', e => {
  onDragStart(e.touches[0].clientY);
  e.stopPropagation();
}, { passive: true });
window.addEventListener('touchmove', e => {
  if (isDrag) onDragMove(e.touches[0].clientY);
}, { passive: true });
window.addEventListener('touchend', onDragEnd);

function saveNoteData() {
  documentHTML = serializeAllContent();
  saveModel();
  const now = new Date();
  const ds = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}_${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}`;
  const blob = new Blob([JSON.stringify({ version: 61, html: documentHTML, pageMeta, viewMode }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Yslide_${ds}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  showToast('💾 파일로 저장되었습니다');
}

function handleFileImport(files) {
  if (!files?.length) return;
  const reader = new FileReader();
  reader.onload = e => {
    const raw = e.target.result;
    pushHistory();
    try {
      const x = JSON.parse(raw);
      if (Array.isArray(x)) {
        documentHTML = x.map(p => p.isPlaceholder ? '' : (p.html || '')).filter(Boolean).join('<br><br>');
        pageMeta = x.map(p => ({ title: p.title || '', align: p.align || 'left' }));
      } else {
        documentHTML = x.html || '';
        pageMeta = x.pageMeta || [];
      }
    } catch {
      documentHTML = String(raw).replace(/\r\n/g, '<br>').replace(/\n/g, '<br>');
      pageMeta = [];
    }
    renderPages();
    saveModel();
    showToast('📂 파일을 성공적으로 불러왔습니다');
  };
  reader.readAsText(files[0]);
}

async function shareNoteContent() {
  documentHTML = serializeAllContent();
  const temp = document.createElement('div');
  temp.innerHTML = documentHTML;
  const text = temp.innerText.trim();

  if (!text) return showToast('⚠️ 공유할 내용이 없습니다');

  if (navigator.share) {
    try {
      await navigator.share({ title: 'Yslide 원고 공유', text });
      showToast('📤 공유 완료');
    } catch (e) {}
  } else {
    navigator.clipboard?.writeText(text).then(() => showToast('📋 클립보드에 복사되었습니다'));
  }
}

      </div>

}

async function translateSelectedTextWithGemini() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) return showToast('⚠️ 번역할 문장을 먼저 드래그하세요');

  const range = sel.getRangeAt(0);
  const temp = document.createElement('div');
  temp.appendChild(range.cloneContents());
  const originalHtml = temp.innerHTML;

  let key = localStorage.getItem('yslide_gemini_api_key');
  if (!key) {
    key = prompt('Google Gemini API 키를 입력해주세요 (최초 1회 저장):');
    if (!key) return;
    localStorage.setItem('yslide_gemini_api_key', key.trim());
  }

  showToast('🌐 Gemini AI 영문 번역 중...');
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [{
            text: `Translate the provided HTML naturally into dignified, accurate English. Maintain all existing HTML tags intact. Return ONLY the translated raw HTML without markdown.\n\n${originalHtml}`
          }]
        }]
      })
    });
    const data = await res.json();
    let out = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    out = out.replace(/^```html\s*/i, '').replace(/\s*```$/i, '').trim();

    pushHistory();
    range.deleteContents();
    const d = document.createElement('div');
    d.innerHTML = out;
    const f = document.createDocumentFragment();
    while (d.firstChild) f.appendChild(d.firstChild);
    range.insertNode(f);

    documentHTML = serializeAllContent();
    saveModel();
    renderPages(captureGlobalCaret());
    showToast('✨ 영어 번역 완료');
  } catch (e) {
    showToast('⚠️ 번역 실패: API 키 또는 네트워크 상태를 확인하세요');
  }
}

function previewCurrentViewPage() {
  const cards = document.querySelectorAll('.note-page-card');
  const viewportCenter = viewport.scrollTop + (viewport.clientHeight / 2);
  let targetIndex = 0;
  cards.forEach((c, idx) => {
    if (c.offsetTop <= viewportCenter) targetIndex = idx;
  });
  startFullPresentation(targetIndex);

function startFullPresentation(startIndex = 0) {
  documentHTML = serializeAllContent();
  saveModel();
  readerViewport.innerHTML = '';
  const pages = paginateDocument();

  pages.forEach((html, i) => {
    const sheet = document.createElement('div');
    sheet.className = `slide-sheet ${i === startIndex ? 'active' : ''}`;
    sheet.style.fontSize = `${currentFontSize}px`;
    const title = pageMeta[i]?.title ? `<div class="slide-title-header">${esc(pageMeta[i].title)}</div>` : '';
    sheet.innerHTML = title + html;
    readerViewport.appendChild(sheet);
  });

  currentReaderIndex = Math.min(startIndex, pages.length - 1);
  document.getElementById('reader-curr').innerText = currentReaderIndex + 1;
  document.getElementById('reader-total').innerText = pages.length;
  document.getElementById('reader-container').style.display = 'block';
  isReaderOpen = true;

  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
}

function nextSlide() {
  const s = document.querySelectorAll('.slide-sheet');
  if (currentReaderIndex < s.length - 1) {
    s[currentReaderIndex].classList.remove('active');
    s[++currentReaderIndex].classList.add('active');
    document.getElementById('reader-curr').innerText = currentReaderIndex + 1;
  }
}

function prevSlide() {
  const s = document.querySelectorAll('.slide-sheet');
  if (currentReaderIndex > 0) {
    s[currentReaderIndex].classList.remove('active');
    s[--currentReaderIndex].classList.add('active');
    document.getElementById('reader-curr').innerText = currentReaderIndex + 1;
  }
}

function exitReaderMode() {
  document.getElementById('reader-container').style.display = 'none';
  isReaderOpen = false;
  if (document.fullscreenElement && document.exitFullscreen) {
    document.exitFullscreen().catch(() => {});
  }
}

window.addEventListener('keydown', e => {
  if (isReaderOpen) {
    if (['ArrowRight', 'ArrowDown', ' ', 'PageDown'].includes(e.key)) {
      e.preventDefault();
      nextSlide();
    } else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) {
      e.preventDefault();
      prevSlide();
    } else if (e.key === 'Escape') {
      exitReaderMode();
    }
    return;
  }

  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    e.shiftKey ? redo() : undo();
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
    e.preventDefault();
    redo();
  }
});

window.addEventListener('resize', () => {
  const currentWidth = window.innerWidth;
  if (currentWidth !== lastWindowWidth) {
    lastWindowWidth = currentWidth;
    clearTimeout(reflowTimer);
    reflowTimer = setTimeout(() => renderPages(), 200);
  } else {
    updateFloatingScrollbar();
  }
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1500);
}

function init() {
  try {
    const f = localStorage.getItem('yslide_note_font_idx');
    if (f !== null) currentFontIndex = +f % FONT_LIST.length;
    document.documentElement.style.setProperty('--active-font', FONT_LIST[currentFontIndex].family);
    btnFontCycle.innerText = FONT_LIST[currentFontIndex].name;

    const vm = localStorage.getItem('yslide_note_view_mode');
    if (vm) viewMode = vm;

    const saved = localStorage.getItem('yslide_note_document_v61') || localStorage.getItem('yslide_note_document_v60');
    if (saved) {
      const x = JSON.parse(saved);
      documentHTML = x.html || '';
      pageMeta = Array.isArray(x.pageMeta) ? x.pageMeta : [];
      if (x.viewMode) viewMode = x.viewMode;
    } else {
      const old = localStorage.getItem('yslide_note_pages_v53');
      if (old) {
        const arr = JSON.parse(old);
        if (Array.isArray(arr)) {
          documentHTML = arr.map(p => p.isPlaceholder ? '' : (p.html || '')).filter(Boolean).join('<br><br>');
          pageMeta = arr.map(p => ({ title: p.title || '', align: p.align || 'left' }));
        }
      }
    }
  } catch (e) {
    documentHTML = '';
    pageMeta = [];
  }

  applyViewModeUI();
  renderPages();
  pushHistory();
  updateFloatingScrollbar();
}

init();
installColorPreview();
</script>
