<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yslide Note</title>

<!-- PWA 메타 태그 및 아이콘 설정 -->
<meta name="theme-color" content="#181818">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yslide">
<link rel="apple-touch-icon" href="https://api.iconify.design/fluent-emoji:memo.svg">

<!-- PWA Manifest 연결 -->
<link id="manifest-link" rel="manifest">

<!-- KoPubWorld 및 Pretendard CDN 로드 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-kopubworld@1.0.0/kopubworld.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

<style>
  :root {
    --bg-main: #0a0a0a;
    --panel-bg: #181818;
    --border-color: #333333;
    --page-bg: #141414;
    --page-border: #444444;
    --text-color: #ffffff;
    --accent: #38bdf8;
    --toolbar-height: 96px;
    --page-width: min(820px, 92vw);
    --page-card-height: 80vh; /* 화면 높이의 80% */
    --header-height: 42px;
    --active-font: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
    --ui-font: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    position: fixed;
    overflow: hidden;
    background-color: var(--bg-main);
    color: var(--text-color);
    font-family: var(--ui-font);
  }

  /* 상단 2단 고정 툴바 */
  #header-toolbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: var(--toolbar-height);
    background-color: var(--panel-bg);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 16px;
    z-index: 1000;
    user-select: none;
    gap: 6px;
  }

  .toolbar-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: 40px;
    overflow-x: auto;
    white-space: nowrap;
    gap: 8px;
  }
  .toolbar-row::-webkit-scrollbar { display: none; }

  .toolbar-row-top {
    justify-content: flex-start;
    border-bottom: 1px solid #282828;
    padding-bottom: 4px;
    height: 38px;
    gap: 8px;
  }

  .tool-group {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  button {
    height: 32px;
    padding: 0 10px;
    background-color: #262626;
    border: 1px solid #484848;
    border-radius: 6px;
    color: #e5e5e5;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    flex-shrink: 0;
    transition: all 0.15s ease;
    font-family: var(--ui-font);
  }
  button:hover { background-color: #333333; }
  button:active { transform: scale(0.97); }

  .btn-icon {
    width: 32px;
    height: 32px;
    padding: 0;
  }
  .icon-svg {
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .divider {
    width: 1px;
    height: 20px;
    background-color: var(--border-color);
    margin: 0 2px;
    flex-shrink: 0;
  }

  #btn-continuous.active, #btn-batch-mode.active {
    background-color: #ea580c !important;
    border-color: #f97316 !important;
    color: #ffffff !important;
    box-shadow: 0 0 10px rgba(234, 88, 12, 0.6);
  }

  .color-btn {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid #555555;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.15s ease;
  }
  .color-btn.selected {
    border-color: #ffffff;
    transform: scale(1.2);
    box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
  }
  .c-white { background-color: #ffffff; }
  .c-red { background-color: #ef4444; }
  .c-yellow { background-color: #ffb703; }
  .c-blue { background-color: #38bdf8; }
  .c-green { background-color: #4ade80; }

  .btn-font {
    height: 30px;
    padding: 0 10px;
    font-size: 12px;
    font-weight: bold;
    color: #d1d5db;
    background-color: #262626;
    border: 1px solid #484848;
    border-radius: 6px;
  }

  .size-box {
    display: inline-flex;
    align-items: center;
    background-color: #262626;
    border: 1px solid #484848;
    border-radius: 6px;
    padding: 2px 4px;
    gap: 2px;
    height: 32px;
    flex-shrink: 0;
  }
  .btn-size-step {
    width: 20px;
    height: 20px;
    padding: 0;
    background: transparent;
    border: none;
    color: #cccccc;
    font-size: 14px;
  }
  #size-display {
    font-size: 13px;
    font-weight: bold;
    min-width: 20px;
    text-align: center;
    color: #38bdf8;
  }

  #file-input { display: none; }

  /* 메인 스크롤 뷰포트 */
  #main-viewport {
    position: absolute;
    top: var(--toolbar-height);
    bottom: 0;
    left: 0;
    right: 0;
    background-color: var(--bg-main);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 140px 16px;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }
  #main-viewport::-webkit-scrollbar { display: none; }

  /* 단일 통합 문서 레이아웃 컨테이너 */
  #document-container {
    width: var(--page-width);
    max-width: 820px;
    position: relative;
    display: flex;
    flex-direction: column;
    margin: 0 auto;
  }

  /* 뒤쪽 시각적 페이지 카드 가이드 레이어 */
  #page-sheets-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    gap: 28px;
    z-index: 1;
  }

  .visual-page-sheet {
    width: 100%;
    height: var(--page-card-height);
    min-height: 480px;
    background-color: var(--page-bg);
    border: 2px solid var(--page-border);
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.05);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .visual-page-header {
    height: var(--header-height);
    background-color: #1a1a1a;
    border-bottom: 1px solid #333333;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    font-size: 13px;
    font-weight: bold;
    color: #888888;
    pointer-events: auto;
  }

  .page-title-input {
    background: transparent;
    border: none;
    outline: none;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    font-family: var(--ui-font);
    padding: 4px 8px;
    flex: 1;
    margin: 0 12px;
  }
  .page-title-input::placeholder { color: #555555; }
  .page-title-input:focus { color: #38bdf8; }

  /* 단일 연속 편집 에디터 */
  #unified-editor {
    position: relative;
    width: 100%;
    min-height: calc(var(--page-card-height) - var(--header-height));
    margin-top: var(--header-height);
    padding: 24px 36px 36px 36px;
    color: #ffffff;
    font-size: 26px;
    line-height: 1.55;
    outline: none;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: var(--active-font);
    z-index: 2;
    cursor: text;
  }

  #unified-editor.is-placeholder {
    color: #666666 !important;
  }

  body.paint-mode #unified-editor {
    cursor: crosshair !important;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 하단 고정 독 */
  #bottom-dock {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(26, 26, 26, 0.92);
    border: 1px solid #444444;
    padding: 6px 18px;
    border-radius: 30px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
    z-index: 1000;
    backdrop-filter: blur(8px);
  }
  #page-info { font-size: 13px; font-weight: bold; color: #d1d5db; }

  /* 전체화면 슬라이드 뷰포트 */
  #reader-container {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background-color: #000000;
    z-index: 5000;
    user-select: none;
    overflow: hidden;
  }

  #reader-viewport {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .slide-sheet {
    width: var(--page-width);
    max-width: 820px;
    height: var(--page-card-height);
    background-color: var(--page-bg);
    border: 1px solid #383838;
    border-radius: 8px;
    padding: 28px 40px;
    color: #ffffff;
    font-size: 26px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    overflow: hidden;
    display: none;
    box-sizing: border-box;
    font-family: var(--active-font);
  }
  .slide-sheet.active { display: block; }

  .slide-title-header {
    font-size: 20px;
    font-weight: bold;
    color: #38bdf8;
    text-align: center;
    margin-bottom: 20px;
    padding-bottom: 8px;
    border-bottom: 1px solid #333333;
  }

  .touch-zone {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50%;
    cursor: pointer;
    z-index: 5500;
    -webkit-tap-highlight-color: transparent;
  }
  #touch-left { left: 0; }
  #touch-right { right: 0; }

  #exit-reader-btn {
    position: absolute; top: 18px; right: 24px;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(40, 40, 40, 0.85); border: 1px solid #666666;
    color: #ffffff; font-size: 20px; font-weight: bold;
    cursor: pointer; z-index: 6000;
  }

  #reader-page-badge {
    position: absolute; top: 22px; left: 24px;
    background: rgba(30, 30, 30, 0.85); border: 1px solid #444444;
    padding: 6px 14px; border-radius: 12px;
    color: #ffb703; font-size: 14px; font-weight: bold;
    z-index: 6000;
  }

  /* 인쇄 영역 */
  #print-area { display: none; }

  @media print {
    @page { margin: 15mm; size: auto; }
    html, body {
      position: static !important;
      overflow: visible !important;
      background-color: #ffffff !important;
      color: #000000 !important;
      height: auto !important;
    }
    #header-toolbar, #main-viewport, #bottom-dock, #reader-container, #toast {
      display: none !important;
    }
    #print-area {
      display: block !important;
      width: 100% !important;
      background: #ffffff !important;
    }
    .print-page-sheet {
      page-break-after: always !important;
      break-after: page !important;
      padding: 10px 0 20px 0;
      color: #000000 !important;
      font-size: 18pt !important;
      line-height: 1.6 !important;
      white-space: pre-wrap !important;
      word-break: break-word !important;
      font-family: var(--active-font);
    }
    .print-page-sheet:last-child {
      page-break-after: avoid !important;
      break-after: avoid !important;
    }
    .print-page-header {
      font-size: 12pt;
      font-weight: bold;
      color: #444;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #ddd;
      margin-bottom: 15px;
      padding-bottom: 4px;
    }
  }

  #toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(30, 30, 30, 0.95);
    border: 1px solid #555555;
    color: #38bdf8;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 9000;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- 상단 2단 툴바 -->
<div id="header-toolbar">
  <div class="toolbar-row toolbar-row-top">
    <div class="tool-group">
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLetterSpacing(-0.5)" title="자간 좁게">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <line x1="4" y1="12" x2="10" y2="12"></line>
          <polyline points="7 9 10 12 7 15"></polyline>
          <line x1="20" y1="12" x2="14" y2="12"></line>
          <polyline points="17 9 14 12 17 15"></polyline>
        </svg>
      </button>
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLetterSpacing(0.5)" title="자간 넓게">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <line x1="10" y1="12" x2="4" y2="12"></line>
          <polyline points="7 9 4 12 7 15"></polyline>
          <line x1="14" y1="12" x2="20" y2="12"></line>
          <polyline points="17 9 20 12 17 15"></polyline>
        </svg>
      </button>

      <div class="divider"></div>

      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLineHeight(-0.1)" title="줄간격 좁게">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <polyline points="9 6 12 9 15 6"></polyline>
          <line x1="12" y1="2" x2="12" y2="9"></line>
          <polyline points="9 18 12 15 15 18"></polyline>
          <line x1="12" y1="22" x2="12" y2="15"></line>
        </svg>
      </button>
      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="adjustLineHeight(0.1)" title="줄간격 넓게">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <polyline points="8 6 12 2 16 6"></polyline>
          <line x1="12" y1="2" x2="12" y2="10"></line>
          <polyline points="8 18 12 22 16 18"></polyline>
          <line x1="12" y1="22" x2="12" y2="14"></line>
        </svg>
      </button>

      <div class="divider"></div>

      <button id="btn-font-cycle" class="btn-font" onclick="cycleFontFamily()" title="글꼴 변경">기본</button>

      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="toggleBold()" title="볼드체">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
          <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
        </svg>
      </button>

      <button class="btn-icon" onmousedown="event.preventDefault()" onclick="toggleItalic()" title="이탤릭체">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <line x1="19" y1="4" x2="10" y2="4"></line>
          <line x1="14" y1="20" x2="5" y2="20"></line>
          <line x1="15" y1="4" x2="9" y2="20"></line>
        </svg>
      </button>

      <div class="divider"></div>

      <button id="btn-install-app" class="btn-icon" onclick="promptInstallApp()" style="display:none; background:#0284c7; border-color:#38bdf8;" title="앱 설치">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="toolbar-row">
    <div class="tool-group">
      <button class="btn-icon" onclick="document.getElementById('file-input').click()" title="파일 불러오기 (.txt, .json)">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path>
        </svg>
      </button>
      <input type="file" id="file-input" accept=".txt,.json" onchange="handleFileImport(this.files)">

      <button class="btn-icon" onclick="saveNoteData()" title="저장">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
      </button>

      <button class="btn-icon" onclick="shareNoteContent()" title="텍스트 공유">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
      </button>

      <button class="btn-icon" onclick="printNoteDocument()" title="문서 인쇄">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <polyline points="6 9 6 2 18 2 18 9"></polyline>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
          <rect x="6" y="14" width="12" height="8"></rect>
        </svg>
      </button>

      <button class="btn-icon" onclick="translateSelectedTextWithGemini()" title="영어 번역 (Gemini AI)">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
      </button>

      <button class="btn-icon" onclick="undo()" title="실행 취소 / 되돌리기">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M3 7v6h6"></path>
          <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
        </svg>
      </button>

      <button class="btn-icon" onclick="redo()" title="다시 실행">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M21 7v6h-6"></path>
          <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"></path>
        </svg>
      </button>

      <div class="divider"></div>

      <button id="btn-continuous" onclick="toggleContinuousMode()" title="연속 채색">연속</button>
      <div class="color-btn c-white" onmousedown="event.preventDefault()" onclick="selectColor('#ffffff', this)" title="흰색"></div>
      <div class="color-btn c-red selected" onmousedown="event.preventDefault()" onclick="selectColor('#ef4444', this)" title="빨간색"></div>
      <div class="color-btn c-yellow" onmousedown="event.preventDefault()" onclick="selectColor('#ffb703', this)" title="황금 주황"></div>
      <div class="color-btn c-blue" onmousedown="event.preventDefault()" onclick="selectColor('#38bdf8', this)" title="밝은 파랑"></div>
      <div class="color-btn c-green" onmousedown="event.preventDefault()" onclick="selectColor('#4ade80', this)" title="밝은 초록"></div>

      <div class="divider"></div>

      <div class="size-box">
        <button class="btn-size-step" onclick="changeFontSize(-2)">-</button>
        <span id="size-display">26</span>
        <button class="btn-size-step" onclick="changeFontSize(2)">+</button>
      </div>
    </div>

    <div class="tool-group">
      <!-- 현재 페이지 미리보기 버튼 (눈 모양 아이콘) -->
      <button class="btn-icon" onclick="previewCurrentViewPage()" title="현재 화면 페이지 미리보기">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>

      <!-- 1페이지부터 전체보기 버튼 -->
      <button class="btn-icon" onclick="startFullPresentation(0)" style="background-color:#0284c7; border-color:#38bdf8; color:#fff;" title="1페이지부터 전체보기">
        <svg class="icon-svg" viewBox="0 0 24 24" style="fill: currentColor; stroke: none;">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- 메인 에디터 뷰포트 -->
<div id="main-viewport">
  <div id="document-container">
    <div id="page-sheets-layer"></div>
    <div id="unified-editor" contenteditable="true" spellcheck="false"></div>
  </div>
</div>

<!-- 하단 고정 독 -->
<div id="bottom-dock">
  <span id="page-info">1 페이지</span>
  <button onclick="insertPageBreakAtEnd()">➕ 새 페이지</button>
</div>

<!-- 전체화면 슬라이드 뷰포트 -->
<div id="reader-container">
  <button id="exit-reader-btn" onclick="exitReaderMode()" title="닫기 (ESC)">✕</button>
  <div class="touch-zone" id="touch-left" onclick="prevSlide()"></div>
  <div class="touch-zone" id="touch-right" onclick="nextSlide()"></div>
  <div id="reader-viewport"></div>
  <div id="reader-page-badge"><span id="reader-curr">1</span> / <span id="reader-total">1</span></div>
</div>

<!-- 인쇄 전용 컨테이너 -->
<div id="print-area"></div>

<div id="toast"></div>

<script>
  /* PWA Manifest & Service Worker */
  const manifestData = {
    name: "Yslide Note",
    short_name: "Yslide",
    start_url: "./",
    display: "standalone",
    background_color: "#0a0a0a",
    theme_color: "#181818",
    icons: [{ src: "https://api.iconify.design/fluent-emoji:memo.svg", sizes: "192x192 512x512", type: "image/svg+xml" }]
  };
  const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
  document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);

  if ('serviceWorker' in navigator) {
    const swCode = `
      self.addEventListener('install', e => self.skipWaiting());
      self.addEventListener('activate', e => clients.claim());
      self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
    `;
    const swBlob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
  }

  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    const installBtn = document.getElementById('btn-install-app');
    if (installBtn) installBtn.style.display = 'inline-flex';
  });

  function promptInstallApp() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
        document.getElementById('btn-install-app').style.display = 'none';
      });
    } else {
      showToast('💡 브라우저 메뉴의 [홈 화면에 추가]를 눌러 설치하세요');
    }
  }

  /* 글로벌 상태 */
  const PLACEHOLDER_TEXT = "여기를 클릭하여 글을 작성하거나 긴 글을 붙여넣으세요.";

  const FONT_LIST = [
    { name: "기본", family: "-apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', sans-serif" },
    { name: "KoPub 돋움", family: "'KoPubWorld Dotum', sans-serif" },
    { name: "KoPub 바탕", family: "'KoPubWorld Batang', serif" }
  ];
  let currentFontIndex = 0;

  let activeColor = '#ef4444';
  let isContinuousMode = false;
  let isPainting = false;
  let lastPaintedKey = '';
  let currentFontSize = 26;
  let currentReaderIndex = 0;
  let isReaderOpen = false;

  let globalLetterSpacing = 0;
  let globalLineHeight = 1.55;

  let pageTitles = {};
  let totalPageCount = 1;

  let undoStack = [];
  let redoStack = [];
  const MAX_HISTORY = 40;

  const viewport = document.getElementById('main-viewport');
  const unifiedEditor = document.getElementById('unified-editor');
  const pageSheetsLayer = document.getElementById('page-sheets-layer');
  const readerViewport = document.getElementById('reader-viewport');
  const btnFontCycle = document.getElementById('btn-font-cycle');

  function init() {
    const savedFont = localStorage.getItem('yslide_note_font_idx');
    if (savedFont !== null) {
      currentFontIndex = parseInt(savedFont, 10) % FONT_LIST.length;
    }
    applyCurrentFont();

    const savedDoc = localStorage.getItem('yslide_single_doc_v3');
    const savedTitles = localStorage.getItem('yslide_doc_titles_v3');

    if (savedDoc && savedDoc.trim() !== '' && savedDoc.trim() !== PLACEHOLDER_TEXT) {
      unifiedEditor.innerHTML = savedDoc;
      unifiedEditor.classList.remove('is-placeholder');
    } else {
      unifiedEditor.innerHTML = PLACEHOLDER_TEXT;
      unifiedEditor.classList.add('is-placeholder');
    }

    if (savedTitles) {
      try { pageTitles = JSON.parse(savedTitles); } catch(e) { pageTitles = {}; }
    }

    pushHistory();
    updatePageLayout();
    updateFontSize();
  }

  function pushHistory() {
    const state = {
      html: unifiedEditor.innerHTML,
      titles: { ...pageTitles }
    };
    const stateStr = JSON.stringify(state);
    if (undoStack.length === 0 || undoStack[undoStack.length - 1] !== stateStr) {
      undoStack.push(stateStr);
      if (undoStack.length > MAX_HISTORY) undoStack.shift();
      redoStack = [];
    }
  }

  function undo() {
    if (undoStack.length > 1) {
      const currentState = undoStack.pop();
      redoStack.push(currentState);
      const prev = JSON.parse(undoStack[undoStack.length - 1]);
      unifiedEditor.innerHTML = prev.html;
      pageTitles = prev.titles || {};
      saveToStorageSilent();
      updatePageLayout();
      showToast('↶ 되돌리기');
    } else {
      showToast('⚠️ 더 이상 되돌릴 작업이 없습니다');
    }
  }

  function redo() {
    if (redoStack.length > 0) {
      const nextState = redoStack.pop();
      undoStack.push(nextState);
      const next = JSON.parse(nextState);
      unifiedEditor.innerHTML = next.html;
      pageTitles = next.titles || {};
      saveToStorageSilent();
      updatePageLayout();
      showToast('↷ 다시 실행');
    } else {
      showToast('⚠️ 다시 실행할 작업이 없습니다');
    }
  }

  function cycleFontFamily() {
    currentFontIndex = (currentFontIndex + 1) % FONT_LIST.length;
    localStorage.setItem('yslide_note_font_idx', currentFontIndex);
    applyCurrentFont();
    showToast(`글꼴: ${FONT_LIST[currentFontIndex].name}`);
  }

  function applyCurrentFont() {
    const current = FONT_LIST[currentFontIndex];
    document.documentElement.style.setProperty('--active-font', current.family);
    if (btnFontCycle) btnFontCycle.innerText = current.name;
  }

  /* 레이아웃 동기화 */
  function updatePageLayout() {
    const cardHeight = window.innerHeight * 0.8;
    const editorScrollHeight = unifiedEditor.scrollHeight + 42;
    
    const calculatedPages = Math.max(1, Math.ceil(editorScrollHeight / (cardHeight + 28)));
    totalPageCount = calculatedPages;

    pageSheetsLayer.innerHTML = '';

    for (let i = 0; i < calculatedPages; i++) {
      const sheet = document.createElement('div');
      sheet.className = 'visual-page-sheet';

      const header = document.createElement('div');
      header.className = 'visual-page-header';

      const badge = document.createElement('span');
      badge.className = 'page-badge';
      badge.innerText = `[ PAGE ${i + 1} ]`;

      const titleInput = document.createElement('input');
      titleInput.type = 'text';
      titleInput.className = 'page-title-input';
      titleInput.placeholder = '제목을 입력하세요';
      titleInput.value = pageTitles[i] || '';
      titleInput.addEventListener('input', (e) => {
        pageTitles[i] = e.target.value;
        saveToStorageSilent();
      });

      const empty = document.createElement('div');
      empty.style.width = '60px';

      header.appendChild(badge);
      header.appendChild(titleInput);
      header.appendChild(empty);

      sheet.appendChild(header);
      pageSheetsLayer.appendChild(sheet);
    }

    document.getElementById('page-info').innerText = `${totalPageCount} 페이지`;
  }

  unifiedEditor.addEventListener('focus', () => {
    if (unifiedEditor.classList.contains('is-placeholder') || unifiedEditor.innerHTML.trim() === PLACEHOLDER_TEXT) {
      pushHistory();
      unifiedEditor.innerHTML = '';
      unifiedEditor.classList.remove('is-placeholder');
      saveToStorageSilent();
      updatePageLayout();
    }
  });

  unifiedEditor.addEventListener('input', () => {
    if (unifiedEditor.classList.contains('is-placeholder')) {
      unifiedEditor.classList.remove('is-placeholder');
    }
    saveToStorageSilent();
    updatePageLayout();
  });

  unifiedEditor.addEventListener('paste', (e) => {
    if (unifiedEditor.classList.contains('is-placeholder')) {
      unifiedEditor.innerHTML = '';
      unifiedEditor.classList.remove('is-placeholder');
    }
    setTimeout(() => {
      saveToStorageSilent();
      updatePageLayout();
      pushHistory();
    }, 10);
  });

  window.addEventListener('resize', updatePageLayout);

  function saveToStorageSilent() {
    try {
      localStorage.setItem('yslide_single_doc_v3', unifiedEditor.innerHTML);
      localStorage.setItem('yslide_doc_titles_v3', JSON.stringify(pageTitles));
    } catch(e) {}
  }

  /* 서식 조절 */
  function toggleBold() {
    pushHistory();
    document.execCommand('bold', false, null);
    saveToStorageSilent();
    updatePageLayout();
  }

  function toggleItalic() {
    pushHistory();
    document.execCommand('italic', false, null);
    saveToStorageSilent();
    updatePageLayout();
  }

  function adjustLetterSpacing(delta) {
    pushHistory();
    const sel = window.getSelection();
    if (sel && !sel.isCollapsed) {
      const range = sel.getRangeAt(0);
      let span = document.createElement('span');
      let cur = globalLetterSpacing + delta;
      span.style.letterSpacing = `${cur.toFixed(1)}px`;
      span.appendChild(range.extractContents());
      range.insertNode(span);
    } else {
      globalLetterSpacing = parseFloat((globalLetterSpacing + delta).toFixed(1));
      unifiedEditor.style.letterSpacing = `${globalLetterSpacing}px`;
      showToast(`전체 자간: ${globalLetterSpacing}px`);
    }
    saveToStorageSilent();
    updatePageLayout();
  }

  function adjustLineHeight(delta) {
    pushHistory();
    globalLineHeight = parseFloat(Math.max(0.8, globalLineHeight + delta).toFixed(2));
    unifiedEditor.style.lineHeight = `${globalLineHeight}`;
    showToast(`전체 줄간격: ${globalLineHeight}`);
    saveToStorageSilent();
    updatePageLayout();
  }

  /* Gemini 영문 번역 */
  async function translateSelectedTextWithGemini() {
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || sel.isCollapsed) {
      showToast('⚠️ 번역할 텍스트를 먼저 드래그하여 선택하세요');
      return;
    }

    const range = sel.getRangeAt(0);
    const tempDiv = document.createElement('div');
    tempDiv.appendChild(range.cloneContents());
    const originalHtml = tempDiv.innerHTML.trim();

    if (!originalHtml) {
      showToast('⚠️ 번역할 내용이 없습니다');
      return;
    }

    let apiKey = localStorage.getItem('yslide_gemini_api_key');
    if (!apiKey) {
      apiKey = prompt("Google Gemini API 키를 입력해주세요 (최초 1회 저장):");
      if (!apiKey || !apiKey.trim()) return;
      localStorage.setItem('yslide_gemini_api_key', apiKey.trim());
    }

    const promptText = `Translate the provided HTML text naturally into dignified, accurate English.
Rules:
1. Maintain all existing HTML tags intact.
2. Only translate the human readable text content.
3. Return ONLY the translated raw HTML without markdown code block wrappers.

HTML to Translate:
${originalHtml}`;

    showToast('🌐 Gemini가 영어로 번역 중입니다...');

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
      });

      const resData = await response.json();

      if (resData.error) {
        if (resData.error.code === 400 || resData.error.message.includes("API key")) {
          localStorage.removeItem('yslide_gemini_api_key');
          alert("API 키가 올바르지 않습니다. 다시 확인해주세요.");
        } else {
          alert("번역 오류: " + resData.error.message);
        }
        return;
      }

      let translatedHtml = resData.candidates?.[0]?.content?.parts?.[0]?.text;
      if (translatedHtml) {
        pushHistory();
        translatedHtml = translatedHtml.replace(/^```html\s*/i, '').replace(/\s*```$/i, '').trim();
        
        range.deleteContents();
        const wrapper = document.createElement('div');
        wrapper.innerHTML = translatedHtml;
        const frag = document.createDocumentFragment();
        let node;
        while ((node = wrapper.firstChild)) frag.appendChild(node);
        range.insertNode(frag);

        saveToStorageSilent();
        updatePageLayout();
        showToast('✨ 영어 번역이 완료되었습니다');
      }
    } catch (err) {
      alert("네트워크 오류로 번역에 실패했습니다: " + err.message);
    }
  }

  /* 연속 터치 채색 */
  function attachContinuousEvents(editorEl) {
    function paintAtCoord(clientX, clientY) {
      if (editorEl.classList.contains('is-placeholder')) return;

      let range;
      if (document.caretRangeFromPoint) {
        range = document.caretRangeFromPoint(clientX, clientY);
      } else if (document.caretPositionFromPoint) {
        const pos = document.caretPositionFromPoint(clientX, clientY);
        if (pos) {
          range = document.createRange();
          range.setStart(pos.offsetNode, pos.offset);
          range.collapse(true);
        }
      }

      if (!range) return;
      let node = range.startContainer;

      if (node.nodeType !== Node.TEXT_NODE) {
        if (node.childNodes.length > 0 && range.startOffset < node.childNodes.length) {
          node = node.childNodes[range.startOffset];
          while (node && node.nodeType !== Node.TEXT_NODE && node.firstChild) {
            node = node.firstChild;
          }
        }
      }

      if (node && node.nodeType === Node.TEXT_NODE) {
        const text = node.textContent;
        const offset = range.startOffset;

        let start = Math.min(offset, text.length > 0 ? text.length - 1 : 0);
        while (start > 0 && !/\s/.test(text[start - 1])) start--;
        let end = offset;
        while (end < text.length && !/\s/.test(text[end])) end++;

        if (start < end) {
          const key = `${node.textContent}_${start}_${end}`;
          if (lastPaintedKey === key) return;
          lastPaintedKey = key;

          const wordRange = document.createRange();
          wordRange.setStart(node, start);
          wordRange.setEnd(node, end);

          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(wordRange);

          document.execCommand('foreColor', false, activeColor);
          sel.removeAllRanges();

          saveToStorageSilent();
        }
      }
    }

    editorEl.addEventListener('touchstart', (e) => {
      if (isContinuousMode) {
        pushHistory();
        isPainting = true;
        paintAtCoord(e.touches[0].clientX, e.touches[0].clientY);
        e.preventDefault();
      }
    }, { passive: false });

    editorEl.addEventListener('touchmove', (e) => {
      if (isContinuousMode && isPainting) {
        paintAtCoord(e.touches[0].clientX, e.touches[0].clientY);
        e.preventDefault();
      }
    }, { passive: false });

    editorEl.addEventListener('mousedown', (e) => {
      if (isContinuousMode) {
        pushHistory();
        isPainting = true;
        paintAtCoord(e.clientX, e.clientY);
        e.preventDefault();
      }
    });

    editorEl.addEventListener('mousemove', (e) => {
      if (isContinuousMode && isPainting) {
        paintAtCoord(e.clientX, e.clientY);
        e.preventDefault();
      }
    });
  }

  attachContinuousEvents(unifiedEditor);

  window.addEventListener('mouseup', () => { isPainting = false; lastPaintedKey = ''; });
  window.addEventListener('touchend', () => { isPainting = false; lastPaintedKey = ''; });

  function selectColor(color, el) {
    activeColor = color;
    document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('selected'));
    if (el) el.classList.add('selected');

    if (!isContinuousMode) {
      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0 && !sel.isCollapsed) {
        pushHistory();
        document.execCommand('foreColor', false, color);
        saveToStorageSilent();
      }
    }
  }

  function toggleContinuousMode() {
    isContinuousMode = !isContinuousMode;
    const btn = document.getElementById('btn-continuous');
    if (isContinuousMode) {
      btn.classList.add('active');
      document.body.classList.add('paint-mode');
      showToast('🎨 연속 채색 모드 (글자를 터치하세요)');
    } else {
      btn.classList.remove('active');
      document.body.classList.remove('paint-mode');
      showToast('⌨️ 일반 텍스트 입력 모드');
    }
  }

  function changeFontSize(delta) {
    currentFontSize = Math.min(48, Math.max(16, currentFontSize + delta));
    updateFontSize();
    updatePageLayout();
  }

  function updateFontSize() {
    document.getElementById('size-display').innerText = currentFontSize;
    unifiedEditor.style.fontSize = `${currentFontSize}px`;
  }

  function insertPageBreakAtEnd() {
    pushHistory();
    const cardHeight = window.innerHeight * 0.8;
    const currentHeight = unifiedEditor.scrollHeight;
    const targetHeight = (Math.floor(currentHeight / cardHeight) + 1) * cardHeight;
    const needed = targetHeight - currentHeight;
    const linesNeeded = Math.max(1, Math.floor(needed / (currentFontSize * 1.55)));

    let brs = '';
    for (let i = 0; i < linesNeeded; i++) brs += '<br>';
    unifiedEditor.innerHTML += brs;

    saveToStorageSilent();
    updatePageLayout();
    showToast('📄 새 페이지 영역이 추가되었습니다');
  }

  async function saveNoteData() {
    const now = new Date();
    const dateStr = `${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2, '0')}${now.getDate().toString().padStart(2, '0')}_${now.getHours().toString().padStart(2, '0')}${now.getMinutes().toString().padStart(2, '0')}`;
    const filename = `Yslide_${dateStr}.json`;

    const data = {
      html: unifiedEditor.innerHTML,
      titles: pageTitles
    };

    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);

    showToast('💾 파일로 저장되었습니다');
  }

  function handleFileImport(files) {
    if (!files || files.length === 0) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const raw = e.target.result;
      pushHistory();
      try {
        const parsed = JSON.parse(raw);
        if (parsed.html) {
          unifiedEditor.innerHTML = parsed.html;
          pageTitles = parsed.titles || {};
          unifiedEditor.classList.remove('is-placeholder');
          saveToStorageSilent();
          updatePageLayout();
          showToast('📂 파일을 불러왔습니다');
          return;
        }
      } catch (err) {}

      unifiedEditor.innerHTML = raw.replace(/\r\n/g, '<br>').replace(/\n/g, '<br>');
      unifiedEditor.classList.remove('is-placeholder');
      saveToStorageSilent();
      updatePageLayout();
      showToast('📂 텍스트 파일을 불러왔습니다');
    };
    reader.readAsText(files[0]);
  }

  async function shareNoteContent() {
    const sel = window.getSelection();
    let shareText = (sel && !sel.isCollapsed) ? sel.toString().trim() : unifiedEditor.innerText.trim();

    if (!shareText) {
      showToast('⚠️ 공유할 내용이 없습니다');
      return;
    }

    if (navigator.share) {
      try {
        await navigator.share({ title: 'Yslide 원고 공유', text: shareText });
        showToast('📤 공유 완료');
      } catch (e) {
        if (e.name !== 'AbortError') copyToClipboardFallback(shareText);
      }
    } else {
      copyToClipboardFallback(shareText);
    }
  }

  function copyToClipboardFallback(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('📋 텍스트가 클립보드에 복사되었습니다');
      });
    }
  }

  function printNoteDocument() {
    const printArea = document.getElementById('print-area');
    printArea.innerHTML = '';

    const sheet = document.createElement('div');
    sheet.className = 'print-page-sheet';
    sheet.innerHTML = `
      <div class="print-page-header">
        <span>Yslide Document</span>
      </div>
      <div>${unifiedEditor.innerHTML}</div>
    `;
    printArea.appendChild(sheet);

    window.print();
  }

  /* 현재 보고 있는 화면 페이지 감지 후 미리보기 실행 */
  function previewCurrentViewPage() {
    const cardHeight = window.innerHeight * 0.8 + 28;
    const currentScroll = viewport.scrollTop;
    const targetPageIndex = Math.max(0, Math.min(totalPageCount - 1, Math.floor((currentScroll + 100) / cardHeight)));
    startFullPresentation(targetPageIndex);
  }

  /* 전체화면 슬라이드 발표 모드 */
  function startFullPresentation(startIndex = 0) {
    readerViewport.innerHTML = '';
    
    const lines = unifiedEditor.innerHTML.split(/<br\s*[\/]?>/gi);
    let chunks = [];
    let cur = '';

    for (let i = 0; i < lines.length; i++) {
      cur += (cur ? '<br>' : '') + lines[i];
      if (cur.length > 220 || i === lines.length - 1) {
        chunks.push(cur);
        cur = '';
      }
    }
    if (chunks.length === 0) chunks = [unifiedEditor.innerHTML];

    const safeIndex = Math.min(startIndex, chunks.length - 1);

    chunks.forEach((chunk, idx) => {
      const sheet = document.createElement('div');
      sheet.className = `slide-sheet ${idx === safeIndex ? 'active' : ''}`;
      sheet.style.fontSize = `${currentFontSize}px`;
      const titleHtml = pageTitles[idx] ? `<div class="slide-title-header">${pageTitles[idx]}</div>` : '';
      sheet.innerHTML = `${titleHtml}${chunk}`;
      readerViewport.appendChild(sheet);
    });

    currentReaderIndex = safeIndex;
    document.getElementById('reader-curr').innerText = safeIndex + 1;
    document.getElementById('reader-total').innerText = chunks.length;

    document.getElementById('reader-container').style.display = 'block';
    isReaderOpen = true;

    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  }

  function nextSlide() {
    const slides = document.querySelectorAll('.slide-sheet');
    if (currentReaderIndex < slides.length - 1) {
      slides[currentReaderIndex].classList.remove('active');
      currentReaderIndex++;
      slides[currentReaderIndex].classList.add('active');
      document.getElementById('reader-curr').innerText = currentReaderIndex + 1;
    }
  }

  function prevSlide() {
    const slides = document.querySelectorAll('.slide-sheet');
    if (currentReaderIndex > 0) {
      slides[currentReaderIndex].classList.remove('active');
      currentReaderIndex--;
      slides[currentReaderIndex].classList.add('active');
      document.getElementById('reader-curr').innerText = currentReaderIndex + 1;
    }
  }

  function exitReaderMode() {
    document.getElementById('reader-container').style.display = 'none';
    isReaderOpen = false;
    if (document.fullscreenElement && document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    }
  }

  window.addEventListener('keydown', (e) => {
    if (isReaderOpen) {
      if (['ArrowRight', 'ArrowDown', ' ', 'PageDown'].includes(e.key)) {
        e.preventDefault();
        nextSlide();
      } else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'Escape') {
        exitReaderMode();
      }
      return;
    }

    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      if (e.shiftKey) {
        e.preventDefault();
        redo();
      } else {
        e.preventDefault();
        undo();
      }
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
      e.preventDefault();
      redo();
    }
  });

  let toastTimer = null;
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1500);
  }

  init();
</script>
</body>
</html>
